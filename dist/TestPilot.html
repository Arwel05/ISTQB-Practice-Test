</script><script>/* English overlay for the new Foundation questions (q081 onwards), in authored order (correct option first); see content-en-rotate.js.
   Terminology follows the CTFL 4.0.1 syllabus. Pending review by a CTFL-certified reviewer. */
(function(root){
'use strict';
const rows={
// Lot 1 · chapter 1
q081:['Which is a typical objective of testing?',['Verifying whether specified requirements have been fulfilled','Fixing the defects found in the code','Guaranteeing that the software is defect-free','Replacing the customer’s review of the requirements'],['Verifying that specified requirements have been fulfilled is one of the typical objectives listed in the syllabus.','Fixing defects is debugging, a different activity from testing.','Testing shows the presence of defects; it cannot guarantee their absence.','Testing provides information to stakeholders; it does not replace their decisions.']],
q082:['A regulator asks for evidence that the app complies with a privacy law. Which test objective meets this need?',['Verifying that the test object complies with contractual, legal and regulatory requirements','Reducing the number of lines of code','Debugging the modules','Estimating the project budget'],['Verifying compliance with legal and regulatory requirements is an explicit test objective.','Code size is not a test objective.','Debugging finds and fixes causes; it does not demonstrate compliance.','Budget estimation is a project management activity.']],
q083:['Which statement describes quality assurance (QA)?',['It is a preventive, process-oriented approach that is the responsibility of everyone on the project','It is a corrective, product-oriented approach carried out only by testers','It is a synonym for testing','It concerns only the development process, not the test process'],['QA focuses on implementing and improving processes, on the basis that a good process followed correctly produces a good product.','This describes testing, a form of quality control; and QA is not only for testers.','Testing and QA are often confused, but they are not the same.','QA applies to both the development and the test processes.']],
q084:['How do testing and QA use test results?',['Testing uses them to get defects fixed; QA uses them as feedback on how well the development and test processes work','Only QA uses them','Testing uses them to assess processes, QA to fix defects','Neither uses them after release'],['The same results serve two purposes: fixing product defects and improving processes.','Testing also uses them, to get defects fixed.','The purposes are reversed.','There is no such time limit on using the results.']],
q085:['In the whole team approach, who can perform a task?',['Any team member with the necessary knowledge and skills','Only the person with the corresponding formal role','Only the tester for tests and only the developer for code','Only the product owner'],['In the whole team approach anyone with the skills can do a task, and everyone is responsible for quality.','The formal role does not limit who can contribute.','A rigid split of tasks is exactly what the approach overcomes.','The product owner is a team member, not the only one doing the work.']],
q086:['Which is an advantage of the whole team approach?',['It improves communication and collaboration and leverages the team’s various skills','It always guarantees the highest level of independence of testing','It removes the need for acceptance testing','It makes sharing a workspace unnecessary'],['The syllabus mentions better team dynamics, more communication and collaboration, and synergy between skill sets.','On the contrary: safety-critical contexts may need more independence than the approach provides.','Testers in fact help the business create suitable acceptance tests.','Sharing a workspace, physical or virtual, facilitates communication.']],
q087:['System testing triggers a crash. Which activities follow as part of debugging?',['Reproducing the failure, diagnosing the defect and fixing it','Designing new test cases and estimating effort','Running confirmation testing and closing the report','Reviewing the requirements with the customer'],['The typical debugging process after a failure is reproduction, diagnosis and fixing.','Designing tests and estimating are testing and management activities.','Confirmation testing follows debugging, but it is testing.','Reviewing requirements is static testing, not debugging.']],
q088:['A code review finds a defect. Why does debugging need no reproduction or diagnosis here?',['Static testing finds the defect directly: there is no failure to reproduce','Because defects found in reviews are not fixed','Because debugging applies only to requirements','Because the review replaces confirmation testing'],['When static testing identifies a defect, debugging consists only of removing it.','Defects found in reviews are fixed like any others.','Debugging also concerns code.','The review does not replace checking the fix when that is needed.']],
q089:['In what way does testing represent users in the project?',['Testers make sure their understanding of users’ needs is considered throughout the development lifecycle','Testers replace users in acceptance testing','Testing removes the need to talk to users','Testers decide business priorities instead of users'],['Involving a representative set of users is often too costly: testers bring their perspective into the project.','Acceptance testing remains tied to users and the business.','Testing does not remove the dialogue with users.','Business priority decisions stay with the stakeholders.']],
q090:['Why does testing contribute to the release decision?',['It directly evaluates the quality of the test object and provides measures used in project decisions','Because it guarantees the absence of defects','Because it fixes the defects found directly','Because it replaces project management'],['The measures obtained from testing feed decisions on moving to the next phase, including release.','Testing cannot guarantee the absence of defects.','Fixing is debugging, not testing.','Testing informs decisions; it does not replace those who take them.']],
q091:['Firmware misbehaves because an electromagnetic field altered its memory. What does this case show?',['A failure can be caused by environmental conditions, not only by errors and defects','Every failure comes from a human error in the code','A defect always produces a failure','The problem is an error by the tester'],['The syllabus mentions exactly radiation and electromagnetic fields as environmental conditions that cause failures.','Errors and defects are not the only causes of failures.','Some defects cause failures only under certain conditions, and some never do.','Nothing points to an error by whoever tested.']],
q092:['An analyst under heavy time pressure misunderstands a rule, a defect appears in the code and the customer sees a wrong calculation. What is the most plausible root cause?',['The time pressure that led to the error','The wrong calculation seen by the customer','The defect in the code','The defect report of the problem'],['The root cause is the fundamental reason for the problem: addressing it can prevent similar errors.','The wrong calculation is the observed failure.','The defect is a consequence of the error, not the root cause.','The defect report documents the problem; it does not cause it.']],
q093:['Which test activity answers the question “how to test?”',['Test design','Test analysis','Test completion','Test monitoring'],['Test design turns test conditions into test cases and other testware.','Test analysis answers “what to test?”.','Test completion closes the activities and gathers lessons learned.','Test monitoring compares progress with the plan.']],
q094:['In which activity are test cases organised into test procedures and suites, and is the test environment checked to be set up correctly?',['Test implementation','Test planning','Test analysis','Test execution'],['Test implementation creates the testware needed for execution, organises procedures and suites and prepares the environment.','Test planning defines objectives and approach.','Test analysis identifies test conditions.','Test execution uses what implementation prepared.']],
q095:['The team has little test automation experience and no suitable tools. Which aspect of the test process is most affected?',['The degree of test automation','The customer’s business objectives','The definition of a defect','The seven testing principles'],['Team skills and available tools are contextual factors that affect the degree of test automation.','The customer’s objectives do not depend on the team’s skills.','The definition of a defect does not change with context.','The principles are general guidelines that apply in every context.']],
q096:['A project has a fixed deadline and a small budget. Which aspects of testing does this constraint mainly affect?',['Test strategy, required level of coverage and level of detail of the testware','The definition of error, defect and failure','The seven testing principles','None: testing does not depend on context'],['Project constraints influence strategy, techniques, test automation, coverage, testware detail and reporting.','The definitions of the terms do not change with the budget.','The principles stay the same.','Testing always depends on context.']],
q097:['Which work product is typical of test design?',['Test cases and test charters, with test data and environment requirements','Test logs','The test completion report','The test plan'],['Test design produces test cases, test charters, coverage items, and test data and environment requirements.','Test logs come from test execution.','The test completion report closes the activities.','The test plan comes from test planning.']],
q098:['Stubs, drivers and simulators are work products of which activity?',['Test implementation, as test environment items','Test analysis','Test completion','Test monitoring and test control'],['The syllabus lists them among the test environment items created during test implementation.','Test analysis produces test conditions.','Test completion produces reports and lessons learned.','Test monitoring and test control produce progress reports and control directives.']],
q099:['What value does traceability between test results and risks provide?',['It allows the level of residual risk in the test object to be evaluated','It replaces the test progress report','It reduces the number of tests to run to zero','It removes the need for configuration management'],['The syllabus uses exactly this example: tracing results to risks helps evaluate residual risk.','Traceability makes reports easier to understand; it does not replace them.','Traceability does not remove tests.','Configuration management and traceability have different purposes.']],
q100:['An auditor asks which requirements are covered by tests. What makes it possible to answer?',['Traceability between test cases and requirements','The total number of tests run','A test log with no references to requirements','The length of the test sessions'],['Tracing test cases to requirements verifies requirements coverage and facilitates audits.','A total does not say which requirements are covered.','Without references, the log does not link tests and requirements.','Duration does not measure coverage.']],
q101:['Which activities does the testing role mainly focus on?',['Test analysis, test design, test implementation and test execution','Test planning, test monitoring, test control and test completion','Test execution only','Defect management only'],['The testing role is responsible for the engineering aspects: analysis, design, implementation and execution.','These are the typical activities of the test management role.','Execution is only part of the role.','Defect management does not cover the whole role.']],
q102:['In an Agile team with no test manager, who handles the test management tasks?',['Partly the Agile team itself; tasks spanning several teams may fall to test managers outside the team','Nobody: they do not exist in Agile','Only the Scrum Master','Always a dedicated test manager in every team'],['The syllabus says some test management tasks may be handled by the team, and cross-team tasks by test managers outside it.','Test management tasks also exist in Agile projects.','No specific role is named as solely responsible.','The test management role can be performed by different people depending on context.']],
q103:['Which skill mainly increases the efficiency of testing, for example by choosing suitable test tools?',['Technical knowledge','Domain knowledge','Active listening','Creativity'],['The syllabus links technical knowledge to efficiency, for example by using appropriate test tools.','Domain knowledge helps understand and communicate with users and the business.','Active listening is part of communication skills.','Creativity and critical thinking increase the effectiveness of testing.']],
q104:['Why are communication skills crucial for a tester?',['Because test results may be perceived as criticism of the product and its author, and must be communicated constructively','Because the tester must convince the team that the software is perfect','Because the tester decides the release alone','Because defects must never be discussed with developers'],['The bearer of bad news risks being blamed; confirmation bias also makes such news hard to accept.','Testing does not prove the software is perfect.','The release is a stakeholder decision.','Defects must be discussed, constructively.']],
q105:['Which is a possible drawback of independence of testing?',['Isolation from the development team, leading to communication problems or an adversarial relationship','The tester recognises different kinds of defects','The tester can challenge stakeholders’ assumptions','Developers find many defects in their own code'],['The syllabus mentions isolation, communication problems and an adversarial relationship, and the risk that developers feel less responsible for quality.','This is an advantage of independence.','This is an advantage of independence.','This is an argument for familiarity, not a drawback of independence.']],
q106:['A component is tested by a peer from the author’s own team. What level of independence is this?',['Some independence','No independence','High independence','Very high independence'],['Peers from the same team provide some independence.','No independence means the author tests their own work.','High independence needs testers outside the team, within the organisation.','Very high independence needs testers from outside the organisation.']],
// Lot 2 · chapter 2
q107:['Which good testing practice applies to any software development lifecycle?',['For every development activity there is a corresponding test activity','Testing starts only when the code is complete','All test levels have the same objectives','Testers review work products only in their final version'],['This way every development activity is subject to quality control.','This conflicts with the principle of early testing.','Different test levels have specific, different objectives, to avoid redundancy.','Testers review work products as soon as drafts are available.']],
q108:['According to the good practices that apply to any lifecycle, when do test analysis and test design for a test level start?',['During the corresponding development phase','After all the previous levels are complete','Only after release','When the customer approves the contract'],['Starting during the corresponding development phase applies the principle of early testing.','Waiting for all previous levels delays testing for no reason.','After release it is too late to guide development.','Contract approval is not the reference point given.']],
q109:['Which approach expresses the desired behaviour with test cases in simple natural language, usually in the Given/When/Then format?',['Behavior-Driven Development (BDD)','Test-Driven Development (TDD)','Exploratory testing','Static analysis'],['BDD uses scenarios that stakeholders understand, then translated into executable tests.','TDD drives the code with tests written first, at code level.','Exploratory testing does not define tests before development.','Static analysis does not express behaviour with examples.']],
q110:['Which approach derives tests from acceptance criteria as part of the system design process?',['Acceptance Test-Driven Development (ATDD)','Test-Driven Development (TDD)','Error guessing','Regression testing'],['In ATDD tests come from the acceptance criteria and are written before the part of the application is developed.','TDD starts from code-level test cases, not from acceptance criteria.','Error guessing relies on experience of recurring errors.','Regression testing is not a test-first approach.']],
q111:['Which test level focuses on validation and readiness for deployment, ideally performed by the intended users?',['Acceptance testing','Component testing','Component integration testing','System testing'],['Acceptance testing demonstrates that the system meets the users’ business needs.','Component testing checks components in isolation.','Component integration testing checks interfaces and interactions between components.','System testing checks the overall behaviour, often with an independent test team.']],
q112:['What characterises white-box testing?',['It derives tests from the internal structure, such as code, architecture or data flows, and aims to cover it','It derives tests only from the requirements documentation','It evaluates only non-functional characteristics','It applies only at the acceptance testing level'],['White-box testing is structure-based and aims to cover the structure to an acceptable level.','That is black-box testing, which is specification-based.','Functional testing, non-functional testing, black-box testing and white-box testing are different test types.','All test types can be applied at all test levels.']],
q113:['A test checks that a search function responds within two seconds while returning the correct results. What does this show?',['Many non-functional tests are derived from functional tests, also checking a non-functional constraint','The test is functional testing only','Non-functional testing is run only after release','The test is white-box because it measures a time'],['The syllabus explains that many non-functional tests reuse functional tests while adding a constraint, such as a maximum time.','The time limit is a non-functional characteristic.','Non-functional testing can start early, even in reviews or component testing.','Measuring a time does not make the test structure-based.']],
q114:['After a defect is fixed, the tester re-runs the test that failed and it passes. What remains to be done to check for side effects?',['Regression testing, guided by impact analysis','Nothing: confirmation testing is enough','Repeating the same test several times','Debugging the fixed module'],['Regression testing looks for unintended consequences of the change; impact analysis helps choose what to repeat.','Confirmation testing only checks that the original defect is fixed.','Repeating the same test does not check the other parts.','Debugging has already been done: testing is needed now.']],
q115:['Which situation is a trigger for maintenance testing?',['Migrating the system to a new platform','Writing the first requirements of a new product','The first code review of a new component','The initial project estimate'],['Upgrades and migrations of the operational environment are typical maintenance triggers.','A new product is not in maintenance.','Reviewing new code belongs to development.','The initial estimate does not concern a system in operation.']],
q116:['A system is being retired. What may maintenance testing require?',['Checking data archiving and the restore or retrieval procedures','Nothing: a retired system is not tested','Only performance tests','Only component testing'],['Retiring a system may require testing data archiving and retrieval procedures.','Retirement is also a maintenance trigger.','Performance is not the main point of retirement.','The test level depends on what changes, not only on components.']],
q117:['In a sequential development model, what do testers typically do in the early phases?',['Requirements reviews, test analysis and test design','Dynamic testing of the whole system','Acceptance testing with users','Automated regression testing'],['In sequential models executable code comes later: early on, testers do reviews, analysis and design.','Without executable code, dynamic testing is not possible that early.','Acceptance testing comes when the system is ready.','Regression testing needs an existing product.']],
q118:['Why do Agile projects favour lightweight documentation and extensive test automation?',['Because change can occur throughout the project and regression testing must be made easier','Because Agile projects do no manual testing','Because documentation is forbidden','Because iterations do not produce working software'],['Continuous change needs lightweight documents and extensive test automation for regression testing.','Manual testing remains, often with experience-based techniques.','Useful documentation remains, just lighter.','Each iteration aims precisely at working software.']],
q119:['Which question is part of a retrospective?',['What was not successful and could be improved?','Who is responsible for the defects found?','What salary should team members get?','Which tests should be deleted without discussion?'],['Retrospectives ask what was successful, what was not, and how to carry improvements forward.','A retrospective is not for finding culprits.','Pay is not a retrospective topic.','Decisions come from discussion; they do not avoid it.']],
q120:['Which typical benefit for testing do retrospectives bring?',['Better quality of testware, for example by reviewing the test processes together','A guarantee that there will be no more defects','Getting rid of the test completion report','Replacing test planning'],['The syllabus mentions better testware, more effectiveness and efficiency, team bonding, a better test basis and cooperation.','No practice guarantees the absence of defects.','Retrospective results are normally part of the test completion report.','The retrospective improves the process; it does not replace test planning.']],
q121:['Which benefit for testing does DevOps bring?',['Fast feedback on code quality and on whether changes adversely affect existing code','Complete removal of manual testing','No cost for CI/CD tools','A guarantee that the pipeline needs no maintenance'],['Fast feedback, stable environments and lower regression risk thanks to automated regression testing are benefits cited by the syllabus.','Manual testing, especially from the user’s perspective, is still needed.','CI/CD tools must be introduced and maintained: that is a cost.','The pipeline must be defined and maintained: that is a risk cited.']],
q122:['Which is a risk or challenge of DevOps for testing?',['Test automation needs additional resources and may be difficult to maintain','Visibility of non-functional characteristics decreases','Feedback on the code becomes slower','Regression risk increases because of automation'],['The syllabus mentions defining the pipeline, maintaining the tools and the cost of creating and maintaining test automation.','On the contrary, visibility of non-functional characteristics increases, which helps non-functional testing.','DevOps speeds up feedback.','Extensive automated regression testing reduces regression risk.']],
q123:['Which practice achieves shift left?',['Reviewing the specification from the tester’s perspective before the code exists','Postponing non-functional testing to final acceptance','Running static analysis only after release','Writing test cases after the code'],['Specification reviews by testers find ambiguities, incompleteness and inconsistencies early.','Shift left also brings non-functional testing forward, from component testing where possible.','Static analysis should be done before dynamic testing or in an automated process.','Writing test cases before the code is a shift-left practice.']],
q124:['What does shift left NOT mean?',['Neglecting testing in the later phases of the lifecycle','Testing earlier without waiting for the code','Accepting more effort early to save effort later','Getting stakeholders to support the approach'],['The syllabus states that testing earlier does not mean neglecting later testing.','That is the definition of shift left.','The syllabus expects earlier training or costs, offset by later savings.','Stakeholder buy-in is described as important.']],
// Lot 3 · chapters 3 and 6
q125:['Which of these work products can be examined by static testing?',['A test charter','Only executable code in production','Only the running graphical interface','None: static testing requires execution'],['Any work product that can be read and understood, including test charters, test cases and backlog items, can be examined statically.','Static testing does not need running code.','Observing the running interface is dynamic testing.','It is the opposite: static testing does not execute the software.']],
q126:['Which work product is not appropriate for static testing?',['Third-party executable code that must not be analysed for legal reasons','A contract with the customer','An architecture model','A product backlog item'],['The syllabus excludes work products that are hard for people to interpret and should not be analysed by tools, such as third-party code under legal constraints.','Contracts can be reviewed too.','Models are work products that can be examined.','Backlog items can be reviewed.']],
q127:['Which benefit does early and frequent stakeholder feedback bring?',['It allows early communication of potential quality problems and avoids misunderstandings about requirements','It guarantees that requirements will never change again','It makes reviews unnecessary','It replaces dynamic testing'],['Frequent feedback brings misunderstandings and problems to light early, when fixing them costs less.','Feedback may in fact lead to changing the requirements.','Reviews remain useful.','Feedback does not replace test execution.']],
q128:['What can happen if stakeholders give no feedback during development?',['The product may not match their vision, with costly rework and missed deadlines','The product always meets expectations','Defects automatically decrease','Acceptance testing becomes unnecessary'],['The syllabus mentions products that miss the stakeholders’ vision, rework, delays and even project failure.','Without feedback, expectations are not checked.','No feedback does not reduce defects.','Acceptance testing is still needed.']],
q129:['Which role collates anomalies and records review information, such as decisions?',['The scribe (recorder)','The moderator','The author','The manager'],['The scribe collates the reviewers’ anomalies and records information and decisions.','The moderator facilitates the meetings.','The author creates and fixes the work product.','The manager decides what is reviewed and provides resources.']],
q130:['Which role takes overall responsibility for the review and decides who is involved, when and where?',['The review leader','The reviewer','The scribe','The author'],['The review leader organises the review and holds overall responsibility for it.','The reviewer examines the work product.','The scribe records anomalies and decisions.','The author creates and fixes the work product.']],
q131:['Which factor contributes to a successful review?',['Clear objectives and measurable exit criteria','Using the review to evaluate participants’ performance','Reviewing a very long document in one go','Keeping preparation time to a minimum'],['Clear objectives and measurable exit criteria are among the success factors cited.','Evaluating the participants must never be an objective.','Reviewing small chunks works better.','Adequate time to prepare is needed.']],
q132:['Which other factor supports effective reviews?',['Management support and adequate training for participants','Giving no feedback to authors','Always choosing an inspection, whatever the context','Keeping the review results secret'],['The syllabus mentions management support, training and making reviews part of the organisation’s culture.','Feedback to stakeholders and authors is a success factor.','The review type must suit the context.','Results should be shared, not hidden.']],
q133:['Why does static testing add value even when dynamic testing will follow?',['It can find defects that dynamic testing cannot, such as unreachable code or defects in non-executable work products','Because it guarantees there will be no failures at run time','Because it measures system performance','Because it replaces acceptance testing'],['Static testing finds different defects early, including in work products that cannot be executed.','No technique guarantees the absence of failures.','Performance is measured by executing the software.','Acceptance testing is still needed.']],
q134:['Which advantage of static testing concerns costs?',['Defects found early are usually cheaper to fix','Static testing takes no time','It removes maintenance costs','It makes analysis tools free'],['Finding defects early stops them spreading into later work products and reduces costs.','Reviews need time and preparation.','Maintenance is still needed.','Tools still have a cost.']],
q135:['Which difference between static testing and dynamic testing is correct?',['Static testing finds defects directly; dynamic testing causes failures from which defects are traced','Static testing requires executing the software','Dynamic testing applies to non-executable work products','There is no difference in objectives'],['This is the main distinction described in the syllabus.','Static testing does not execute the software.','Non-executable work products can only be examined statically.','Both evaluate quality, but through different mechanisms.']],
q136:['Which quality characteristic is mainly measured with dynamic testing?',['Performance efficiency','Maintainability of the code','Consistency between requirements','Compliance of the code with standards'],['Performance depends on executing the code.','Maintainability can also be assessed statically.','Inconsistencies between requirements are found by reviews.','Compliance with coding standards is checked statically.']],
q137:['In which review activity are the purpose, the work product to review, the quality characteristics and the exit criteria defined?',['Planning','Individual review','Communication and analysis','Fixing and reporting'],['Planning defines the scope of the review, exit criteria, effort and timeframes.','In individual review each person examines the work product.','In communication and analysis the anomalies are discussed.','In fixing and reporting defects are fixed and results reported.']],
q138:['What happens in the communication and analysis activity of a review?',['The anomalies found are analysed and their status, ownership and actions are decided','The exit criteria are set','The materials are handed out to participants','The review is closed without discussion'],['Anomalies are not automatically defects: they must be analysed and decided, often in a meeting.','Exit criteria are defined in planning.','Materials are handed out at review initiation.','Discussion is the heart of this activity.']],
q139:['Which type of review is led by the author and may also aim to educate the reviewers?',['Walkthrough','Inspection','Technical review','Informal review'],['A walkthrough, led by the author, can serve to educate, build consensus, generate ideas and detect anomalies.','In an inspection the author cannot act as review leader or scribe.','A technical review is led by a moderator.','An informal review follows no defined process.']],
q140:['Which statement about a technical review is correct?',['It is performed by technically qualified reviewers and led by a moderator, to gain consensus and make technical decisions','It is always led by the author','Its only objective is education','It is the most formal type of review'],['Consensus and decisions on technical problems are the typical objectives of a technical review.','It is led by the moderator, not the author.','It has several objectives, including detecting anomalies and evaluating quality.','The most formal type is the inspection.']],
q141:['Which category of tools supports the creation of test data and the design of tests?',['Test design and test implementation tools','Static analysis tools','Defect management tools','Collaboration tools'],['These tools help generate test cases, test data and test procedures.','Static analysis examines code and documents without executing them.','Defect management tracks anomalies.','Collaboration tools facilitate communication.']],
q142:['Which is a risk of test automation?',['Relying too much on the tool and neglecting critical thinking','Reducing test execution times','More objective assessment, for example of coverage','Preventing simple human errors through repeatability'],['The syllabus lists over-reliance on the tool among the risks.','This is a benefit: faster tests give earlier feedback.','This is a benefit: the tool measures what would be complicated by hand.','This is a benefit: execution is more consistent and repeatable.']],
// Lot 4 · chapter 4
q143:['A tester derives tests from the control flow structure of the code. Which family of techniques is this?',['White-box test techniques','Black-box test techniques','Experience-based test techniques','No technique: it is debugging'],['White-box techniques are based on the internal structure of the test object, such as control flow.','Black-box techniques are based on specifications, not structure.','Experience-based techniques use the tester’s knowledge and experience.','Designing tests from the structure is testing, not debugging.']],
q144:['Which family of techniques is mainly based on the tester’s knowledge and experience?',['Experience-based test techniques','Black-box test techniques','White-box test techniques','Automated static analysis techniques'],['Error guessing, exploratory testing and checklist-based testing draw on the tester’s experience.','Black-box techniques start from the specifications.','White-box techniques start from the structure.','Automated static analysis is not a family of test design techniques.']],
q145:['A program has 40 executable statements and the suite executes 30. Which statement is correct?',['Statement coverage is 75%, but this does not prove that the executed statements are correct','Statement coverage is 30%','Branch coverage is certainly 75%','75% of the defects have been found'],['30 out of 40 gives 75%; coverage measures execution, not the correctness of the results.','30 is the number of statements executed, not the percentage.','Statement coverage and branch coverage are different measures.','Coverage does not measure the percentage of defects found.']],
q146:['What does 100% statement coverage NOT guarantee?',['That all the decision logic has been tested, for example both outcomes of every decision','That every executable statement has run at least once','That the tests exercised the code','That a defined coverage measure exists'],['You can execute every statement without taking the false outcome of an IF with no ELSE.','That is exactly what 100% statement coverage guarantees.','Reaching coverage implies the code was executed.','Statement coverage is itself a defined measure.']],
q147:['What counts as a branch in branch coverage?',['A transfer of control between two nodes of the control flow graph, conditional or unconditional','Only the true outcome of each IF','Every comment line','Every executable statement'],['The syllabus counts both conditional and unconditional transfers of control as branches.','The false outcome is also a branch.','Comments are not executable code.','Statements are the coverage items of statement coverage.']],
q148:['What is a strength of white-box testing?',['It takes the whole implementation into account, so it finds defects even when specifications are vague or incomplete','It always finds requirements that were not implemented','It needs no knowledge of the code','It replaces black-box testing'],['The syllabus cites this advantage, together with an objective measure of coverage.','That is its weakness: it cannot see what is missing from the code.','Without the structure it is not white-box testing.','The two families of techniques complement each other.']],
q149:['Can white-box testing also be used in static testing?',['Yes, for example in dry runs of code, pseudocode or flowcharts','No, it always requires execution','Only for acceptance testing','Only with load testing tools'],['The syllabus mentions dry runs of code not yet executable, pseudocode and high-level logic.','White-box techniques do not always require execution.','It is not tied to the acceptance level.','Load testing is dynamic, non-functional testing.']],
q150:['What is a fault attack?',['A structured approach to error guessing: list possible errors, defects and failures and design tests to expose them','A cyber attack on the production system','A kind of load test','A formal code review'],['Fault attacks are the methodical way of applying error guessing.','It is not a real attack but a test design technique.','Load testing is a different matter: non-functional testing.','A review is static testing, not this technique.']],
q151:['What is error guessing based on?',['Knowledge of how the application has worked in the past, the kinds of errors developers make, and failures in similar applications','Only on equivalence partitions','On branch coverage','On the exam quotas'],['Error guessing anticipates errors, defects and failures through experience.','Equivalence partitioning is a black-box technique.','Branch coverage is a white-box technique.','Exam quotas have nothing to do with the technique.']],
q152:['In which situation is exploratory testing particularly useful?',['When specifications are few or inadequate, or under significant time pressure','Only when complete formal specifications exist','Only for automated component tests','Never together with other techniques'],['The syllabus names exactly scarce specifications and time pressure; exploratory testing complements more formal techniques.','It also works, and especially, when specifications are scarce.','It is typically used in manual testing at higher levels.','It can incorporate other techniques and complement them.']],
q153:['Which tester qualities make exploratory testing more effective?',['Experience, domain knowledge, analytical skills, curiosity and creativity','Only typing speed','Only knowledge of a programming language','No knowledge of the product'],['The syllabus lists these qualities as making exploratory testing more effective.','Speed is not mentioned as a factor.','Programming may help, but it is not the main factor.','Knowing the domain and the product helps exploratory testing.']],
q154:['Which item should NOT be in a checklist for checklist-based testing?',['An item that can be checked automatically','A question phrased so it can be verified','A check based on experience of past failures','An aspect that matters to the user'],['The syllabus excludes items that can be checked automatically, items that are too general, and items better suited as entry or exit criteria.','Items should be phrased as verifiable questions.','Experience of past failures is a typical source.','What matters to the user is a typical basis.']],
q155:['What effect do high-level checklists have?',['More variability and coverage in the tests, but less repeatability','Maximum repeatability of the tests','No difference compared with detailed test cases','They never need updating'],['The syllabus notes that high-level checklists bring variability and coverage at the cost of repeatability.','Repeatability decreases, not increases.','Without detailed test cases the result varies more.','Checklists should be updated based on defect analysis.']],
q156:['What are the 3Cs of a user story?',['Card, Conversation, Confirmation','Code, Compile, Commit','Cost, Coverage, Criteria','Customer, Contract, Change'],['The card describes the story, the conversation clarifies it, and the confirmation defines its acceptance criteria.','These are development steps, not aspects of the story.','This is not the acronym used in the syllabus.','This is not the acronym used in the syllabus.']],
q157:['Why should a user story be written by business, development and testing together?',['To reach a shared vision of what to deliver, combining different perspectives','Because the tester must approve every story alone','To avoid writing acceptance criteria','Because development must not know the need'],['Collaboration builds a common understanding and testable stories.','Approval is not the tester’s alone.','Acceptance criteria are part of the confirmation.','Development must understand the need precisely.']],
q158:['Which is a scenario-oriented format for writing acceptance criteria?',['Given/When/Then, as in BDD','A bulleted list of verifications','A table mapping inputs to outputs','A Gantt chart'],['The scenario-oriented format describes context, event and expected result.','A list of verifications is a rule-oriented format.','An input/output table is also rule-oriented.','A Gantt chart is a planning tool.']],
q159:['What are acceptance criteria used for?',['Defining the scope of the story, reaching consensus among stakeholders, and serving as the basis for acceptance testing','Replacing the conversation about the story','Fixing the technical implementation','Measuring the team’s velocity'],['The syllabus also lists describing positive and negative scenarios and supporting planning and estimation.','Acceptance criteria complement the conversation; they do not replace it.','They describe the expected behaviour, not the implementation.','They are not a velocity metric.']],
q160:['State model: Locked →(correct code)→ Active; Active →(timeout)→ Locked; Active →(logout)→ Logged out; Logged out →(login)→ Active. Starting from Locked, which sequence covers all valid transitions in a single test?',['correct code, timeout, correct code, logout, login','correct code, logout, login','correct code, timeout, correct code, timeout','logout, login, timeout'],['It covers Locked→Active, Active→Locked, Active→Logged out and Logged out→Active: all four valid transitions.','The Active→Locked transition on timeout is missing.','Active→Logged out and Logged out→Active are missing.','From Locked, logout is not a valid transition.']],
q161:['Story: “As a customer I want to change my password; the new one must have at least 8 characters and differ from the current one”. With ATDD, which set of tests covers the story without going beyond it?',['New 8-character password accepted; 7-character password rejected; password identical to the current one rejected','Only a valid password accepted','Valid password accepted; password without special characters rejected','7-character password rejected; confirmation email sent'],['It covers the positive case and both rules of the story, without adding requirements.','The two rules are not checked.','Special characters are not in the story: an example must not add anything.','The email is not in the story, and the positive case is missing.']],
q162:['In an ATDD workshop the team has written the positive case of a story. What comes next?',['Writing the negative cases and, where relevant, non-functional testing','Automating straight away with no other cases','Adding examples for features not in the story','Duplicating the positive case with similar values'],['In ATDD, after the positive path come the negative cases and the non-functional attributes.','The negative cases would be missing.','Examples must not go beyond the story.','No two examples should describe the same characteristic.']],
// Lot 5 · chapter 5
q163:['Which tester contribution belongs to release planning?',['Taking part in project and quality risk analyses and planning the testing for the release','Breaking a single story into test tasks for the iteration','Running the nightly regression testing','Fixing the defects found'],['In release planning the tester writes testable stories and criteria, analyses risks, estimates and defines the test approach.','Detailing a story’s tasks belongs to iteration planning.','That is test execution, not planning.','Fixing is debugging.']],
q164:['Which tester contribution belongs to iteration planning?',['Assessing the testability of user stories and estimating the effort of all testing tasks','Redefining the product backlog for the whole release','Approving the project budget','Signing the contract with the customer'],['Detailed risk analysis, testability, testing tasks and estimates belong to iteration planning.','Redefining the release backlog is release planning.','The budget is not a tester’s task.','The contract is not a test planning activity.']],
q165:['What do the lowest layers of the test pyramid represent?',['Many small, isolated and fast tests','A few slow end-to-end tests','Only manual acceptance tests','Only non-functional tests'],['At the base there are many small, fast tests; going up, tests become more complex, slower and fewer.','End-to-end tests are at the top, and there are few of them.','Manual acceptance testing sits at the higher levels.','The model does not separate layers into functional and non-functional testing.']],
q166:['Which statement about the test pyramid is correct?',['The number and names of the layers can vary, for example unit, service and UI','It always has exactly three layers with fixed names','It forbids automating UI tests','It puts end-to-end tests at the base'],['The syllabus notes that the model can have different layers depending on the context.','The number of layers is not fixed.','The pyramid suggests proportions, not bans.','End-to-end tests are at the top.']],
q167:['Which two factors determine the risk level?',['Risk likelihood and risk impact','Project cost and duration','Number of testers and developers','Coverage and velocity'],['The risk level comes from the likelihood of the problem occurring and its impact.','Cost and duration are project constraints, not the measure of risk.','The people available do not define the risk level.','Coverage and velocity are other measures.']],
q168:['Two risks: A has high likelihood and low impact; B has medium likelihood and very high impact. What is needed to compare them?',['Combining likelihood and impact, for example with a risk matrix','Considering likelihood only','Considering only the order in which they were found','Considering only who reported them'],['The risk level combines the two factors, quantitatively or qualitatively with a matrix.','Likelihood alone ignores the consequences.','The order of discovery does not measure risk.','Who reports a risk does not change its level.']],
q169:['Which is a product quality metric?',['Mean time to failure (MTTF)','The number of test cases implemented','Project resource usage','The cost of testing'],['Availability, response time and MTTF are product quality metrics.','This is a test progress metric.','This is a project progress metric.','This is a cost metric.']],
q170:['Which is a defect metric?',['Defect detection percentage','Application response time','Progress of test environment preparation','Requirements coverage'],['Number and priority of defects, defect density and defect detection percentage are defect metrics.','This is a product quality metric.','This is a test progress metric.','This is a coverage metric.']],
q171:['Which content belongs in a test plan?',['The test approach, with test levels, test types, test techniques, and entry criteria and exit criteria','The product source code','The test logs already collected','The testers’ individual appraisals'],['The test plan describes context, stakeholders, communication, risks, approach, budget and schedule.','Code is a development work product.','Test logs come from test execution, not from the plan.','Individual appraisals are not test plan content.']],
q172:['What is one purpose of a test plan?',['Documenting the means and schedule for achieving the test objectives, and supporting communication','Guaranteeing the absence of defects','Replacing the organisation’s test strategy','Preventing any change during the project'],['The test plan helps meet criteria, communicate and think ahead about challenges.','No plan guarantees the absence of defects.','The plan shows adherence to the strategy; it does not replace it.','The plan can be updated when circumstances change.']],
q173:['Which of these is typical of entry criteria?',['All smoke tests have passed','The agreed level of coverage has been reached','All defects found have been reported','All regression testing is automated'],['The initial quality of the test object, such as passed smoke tests, is typical of entry criteria.','This is a measure of thoroughness: it belongs to exit criteria.','This is a yes/no item of exit criteria.','This is a yes/no item of exit criteria.']],
q174:['Time has run out but the agreed coverage has not been reached. When is it acceptable to stop testing anyway?',['When stakeholders have reviewed and accepted the risk of going live without further testing','Never: exit criteria must always be met','Always: time beats everything','When the tester decides alone'],['The syllabus treats running out of time or budget as a valid exit criterion if stakeholders consciously accept the risk.','Running out of time or budget can be a valid exit criterion.','A conscious decision about risk is needed, not an automatic one.','The decision belongs to the stakeholders.']],
q175:['Which quadrant do component testing and component integration testing, automated in CI, belong to?',['Q1: technology facing, supporting the team','Q2: business facing, supporting the team','Q3: business facing, critiquing the product','Q4: technology facing, critiquing the product'],['Q1 contains component testing and component integration testing, to be automated in CI.','Q2 contains functional tests, examples and user story tests.','Q3 contains exploratory testing, usability testing and user acceptance testing.','Q4 contains smoke tests and non-functional testing except usability testing.']],
q176:['Which quadrant does usability testing belong to?',['Q3: business facing, critiquing the product','Q4: technology facing, critiquing the product','Q1: technology facing, supporting the team','Q2: business facing, supporting the team'],['The syllabus places usability, exploratory testing and user acceptance testing in Q3.','Q4 contains non-functional testing except usability testing.','Q1 contains component tests.','Q2 contains functional tests and examples.']],
q177:['Which is a project risk?',['A third-party supplier fails to deliver a component on time','A calculation produces wrong results','Response time is inadequate','A security vulnerability'],['Supplier issues are project risks, like organisational, people and technical issues.','This is a product risk.','This is a product risk.','This is a product risk.']],
q178:['Which is a possible consequence of a product risk that materialises?',['User dissatisfaction and loss of reputation','A delay in delivering the test environment','A shortage of staff in the team','Inaccurate project estimates'],['The syllabus lists dissatisfaction, loss of revenue, trust and reputation and, in extreme cases, physical harm.','This is a project risk, not a consequence of a product risk.','This is a project risk related to people.','This is an organisational project risk.']],
q179:['How can product risk analysis influence testing?',['It determines the scope, test levels, test types, test techniques and coverage, and the priority of testing','It does not: testing is always the same','It removes the need to estimate effort','It only sets the meeting schedule'],['Risk analysis guides the breadth and depth of testing and helps find critical defects early.','Testing depends on risk and context.','Risk feeds directly into the effort estimate.','The meeting schedule is not an outcome of risk analysis.']],
q180:['Risk analysis shows that a module has a very high risk level. Which consequence is most consistent?',['Test it more thoroughly and earlier, with suitable techniques and coverage','Test it last, with fewer tests','Exclude it from testing','Test it like any other module, with no difference'],['More risk means higher priority and more thorough testing.','That is the opposite of what the risk suggests.','Excluding it would leave the highest risk uncovered.','Testing should be proportionate to risk.']],
q181:['Which action mitigates a product risk through testing?',['Applying test techniques and coverage levels suited to the risk','Transferring the risk to an insurer','Accepting the risk and doing nothing','Preparing a contingency plan'],['Choosing suitable testers, independence, reviews, techniques, test types and regression testing are mitigation actions through testing.','Transfer is another response to risk, not mitigation through testing.','Acceptance is another response to risk.','A contingency plan is another response to risk.']],
q182:['What does product risk control consist of?',['Risk mitigation and risk monitoring','Only risk identification','Only cost estimation','Only writing the test plan'],['Risk monitoring checks that mitigation actions work and brings emerging risks to light.','Identification comes before control.','Cost estimation is not risk control.','The plan documents, but control includes actions and checks.']],
q183:['Which content is typical of a test progress report?',['Impediments and workarounds, new or changed risks, and the testing planned for the next period','The lessons learned from the whole project','Only the list of testers’ names','The modified source code'],['The progress report supports ongoing test control: period, progress, impediments, metrics, risks and next steps.','Lessons learned go in the test completion report.','Names do not describe progress.','Code is not part of the report.']],
q184:['Why should test reports be tailored to the audience?',['Because different audiences need different information and formality','Because the data change depending on who reads them','Because formal reports are forbidden','Because only the development team reads them'],['A report for the team differs from one for stakeholders, in content and formality.','The data stay the same; what changes is what to communicate and how.','Formal reports are one of the options.','Stakeholders outside the team use them too.']],
q185:['The team is spread across several time zones. Which way of communicating test status fits best?',['More formal communication, for example reports or online documentation','Only face-to-face conversations in the same office','No communication until the end of the project','Only private messages to a single colleague'],['The syllabus says more formal communication suits distributed teams better.','Distance makes face-to-face-only communication difficult.','Status must be communicated during the work.','Communication should be tailored to different stakeholders, not limited to one.']],
q186:['Which tool is an example of a dashboard for communicating test status?',['A burn-down chart or a task board','A signed contract','An entity-relationship diagram','The user manual'],['The syllabus mentions CI/CD dashboards, task boards and burn-down charts.','A contract does not show test status.','The diagram describes data, not progress.','The manual describes the product, not test status.']],
q187:['How does configuration management support testing?',['It identifies, controls and tracks test work products as configuration items, with versions and baselines','It replaces defect management','It sets test priorities','It measures code coverage'],['Test plans, test cases, scripts, results and logs become versioned configuration items linked together.','Defect management is a different activity.','Priority depends on risks and dependencies.','Coverage is measured with other tools.']],
q188:['Why is it useful to be able to revert to an earlier baseline?',['To reproduce test results obtained in the past','To delete defects permanently','To avoid versioning the tests','To skip change control'],['Configuration management records what changes in each baseline and allows going back to reproduce results.','Reverting does not delete defects.','A baseline presupposes versioning.','Changes go through a formal change control process.']],
q189:['On similar projects the ratio of development effort to test effort is 3:2. Development is estimated at 600 days. Which ratio-based estimate does this give for testing?',['400 days','900 days','200 days','240 days'],['With a 3:2 ratio, testing is two-thirds of development: 600 × 2 / 3 = 400. This is estimation based on ratios.','900 reverses the ratio (600 × 3 / 2).','200 is one-third, not two-thirds.','240 corresponds to 40%, not to the 3:2 ratio.']],
q190:['Test cases: TC1 high priority, requires TC3 to run first; TC2 medium priority; TC3 low priority, no dependency; TC4 low priority, no dependency. Which order follows priority while respecting dependencies?',['TC3, TC1, TC2, TC4','TC1, TC3, TC2, TC4','TC1, TC2, TC3, TC4','TC3, TC4, TC1, TC2'],['TC1 matters most but needs TC3: run TC3, then TC1, then TC2 (medium) and finally TC4 (low).','TC1 cannot run before TC3.','TC1 cannot run before TC3.','TC4, with low priority, needlessly delays TC1 and TC2.']],
q191:['A defect report contains title, steps to reproduce, expected and actual results, severity and priority. Which important information is missing?',['Identification of the test object and test environment, with versions','The project manager’s name','An estimate of the cost of the fix','An opinion about the developer'],['Without the version of the test object and environment, the problem is hard to reproduce and isolate.','The manager’s name does not help reproduce the defect.','A cost estimate is not typical defect report content.','Personal opinions must not be included.']],
q192:['Which defect report title is most useful?',['The order total applies the discount twice when two coupons are used','Bug in the cart!!!','Nothing works','Error found by Mark'],['A good title briefly sums up what is wrong and in which situation.','It does not say which problem was observed.','It is vague and does not help understand the defect.','Who found it does not describe the problem.']]

</script><script>/* English chapter bodies (sections, trap, example) merged into D.en.chapters. Section order matches the Italian chapters. */
(function(root){

const bodies={
1:{sections:[
 ['Testing as information','A team is about to release a booking app. Your job is to provide evidence: which behaviours you checked, which risks remain and what you could not check. A passing test is information about what you tried, not a universal guarantee.'],
 ['Error → defect → failure','A developer misreads the fare (error), writes a wrong formula (defect), and a customer receives a wrong total (failure). The defect can stay hidden until the conditions that trigger it occur. Debugging looks for the cause and fixes the code; testing evaluates and makes problems visible.'],
 ['Seven ideas to use in practice','Testing shows the presence of defects, not their absence. Exhaustive testing is generally impossible. Early testing saves rework. Defects cluster together. Tests that never change wear out. Testing is context dependent. A system with no detected defects may still not meet users’ needs: the absence-of-defects fallacy.'],
 ['From requirement to evidence','Plan objectives and resources; analyse what to verify; design how to verify it; prepare data, procedures and environment; execute and compare results; report and archive. Test monitoring and test control accompany the work. Traceability links requirements, tests, results and defects.'],
 ['Working together','Quality and responsibility are shared. An independent viewpoint can catch shared assumptions, but isolation and hostile communication make the work worse. Describe reproducible facts, listen, and separate the product from the person who made it.']],
 trap:'“All tests passed” does not mean “there are no defects”.',
 example:'A checkout implements every documented requirement, but needs 18 steps and users abandon it: the problem is value for the user, not the number of passing tests.'},
2:{sections:[
 ['Start early','Before the code exists you can discuss examples, review requirements and prepare tests. In iterative work these activities repeat at every increment. Shift left means bringing testing forward where appropriate: checks on the integrated system are still needed.'],
 ['Levels and types','A component is tested in isolation. Component integration testing checks their interfaces. System testing evaluates the complete system. System integration testing looks at the connections with other systems. Acceptance testing checks business needs and readiness for use. Functional testing and non-functional testing are test types, not test levels.'],
 ['One fix, two questions','After a fix, confirmation testing asks whether the original problem is solved. Regression testing looks for side effects elsewhere, using impact analysis to decide what to re-test. A migration or an environment upgrade can also require maintenance testing.'],
 ['Test-driven approaches','TDD starts from small tests on the code. ATDD agrees acceptance tests with the business before implementation. BDD describes behaviour with understandable examples. In DevOps, fast feedback and pipelines help, but they do not remove human judgement or test maintenance.'],
 ['Learning from the process','In a retrospective the team looks at what worked, chooses verifiable improvements and follows up their effects. A concrete action has an owner and a way of telling whether it helped.']],
 trap:'Confirmation testing and regression testing answer different questions.',
 example:'You fix the loyalty discount: re-run the case that failed, then check VAT and refunds, which use the same calculation.'},
3:{sections:[
 ['Reading is already testing','A review of a user story can find a contradictory requirement. A static analysis tool can flag unreachable code. Neither requires executing the program under test. Dynamic testing, by contrast, observes behaviour during execution.'],
 ['A review that works','Define purpose, work product and criteria. Distribute the material and allow individual review. Discuss and analyse the anomalies, agree actions and check the fixes. An anomaly is not automatically a defect: the context may need clarifying.'],
 ['People and responsibilities','The author prepares and fixes the work product. Reviewers examine it. The moderator facilitates collaboration. The scribe records anomalies and decisions. The review leader organises the work; management provides resources. One person may take several roles where appropriate.'],
 ['How formal to be','An informal review needs little structure. A walkthrough is generally led by the author. A technical review seeks consensus and technical decisions. An inspection uses a more formal process with roles, criteria and metrics. The choice depends on risk, objective and context.']],
 trap:'Static testing finds defects in work products directly; it does not observe failures during execution.',
 example:'“The response must be fast” gives no verifiable threshold. A review can surface this ambiguity before development starts.'},
4:{sections:[
 ['Equivalence partitioning','For an age field accepting integers from 18 to 65, consider three partitions: below 18, from 18 to 65, above 65. One representative per partition gives partition coverage, not coverage of every possible value. Invalid partitions count too.'],
 ['Boundary values','On the same range, 2-value BVA uses 17, 18, 65, 66. 3-value BVA adds 19 and 64. Always write down the domain, inclusiveness and the technique required: with real numbers there is no automatic “previous integer”.'],
 ['Rules and states','A decision table combines conditions and actions. Two independent Boolean conditions produce up to four rules: remove only impossible combinations, or merge equivalent ones with a reason. In state transition models history matters too: visiting every state does not guarantee exercising every transition.'],
 ['Looking at the code','Statement coverage compares executed and executable statements. Branch coverage looks at transfers of control. Covering all branches implies covering all reachable statements, but not every path nor the correctness of the results. A false branch may contain no new statements.'],
 ['Experience and collaboration','Error guessing uses experience of recurring errors. Exploratory testing combines learning, test design and test execution towards an objective. Checklists remind you of categories of checks. User stories, examples and acceptance criteria become clearer when business, development and testing collaborate.'],
 ['Worked example','Free shipping if the customer is premium OR the total is ≥ €50. The four combinations are: premium/above threshold, premium/below threshold, standard/above threshold, standard/below threshold. Only the last one pays for shipping. A test covering “premium with €80” does not prove the rule for a standard customer.']],
 trap:'100% coverage of one measure does not mean 100% coverage of all the others.',
 example:'If you execute only the true branch of an IF with no ELSE you may execute every statement, leaving the false branch untested.'},
5:{sections:[
 ['Plan and criteria','A test plan clarifies objectives, scope, approach, resources, risks and communication. Entry criteria state the conditions for starting; exit criteria the conditions for completing. A deadline may require a conscious decision about residual risk.'],
 ['Estimating and prioritising','Weighted three-point estimation uses (optimistic + 4 × most likely + pessimistic) / 6. The result is an estimate, not a firm commitment. When sequencing tests consider risks, coverage, availability and dependencies: a high-priority test may need a preparation test first.'],
 ['Different risks','A product risk concerns the quality of the product: for example, a duplicated payment. A project risk concerns delivery: for example, an unavailable environment. Likelihood and impact help determine the risk level and the intensity of testing.'],
 ['Monitoring and acting','Test monitoring compares status and plan using useful measures. Test control decides actions: changing priorities, resources or schedule. A test progress report supports ongoing decisions; a test completion report summarises results, deviations, open problems and residual risks.'],
 ['Making it reproducible','Manage versions of software, tests, data and environment with configuration management. A useful defect report gives a clear title, version, preconditions, steps, expected and actual results, evidence and severity. The severity of the effect and the priority of the fix do not necessarily coincide.'],
 ['Pyramid and quadrants','The test pyramid suggests many small, fast tests at the base and fewer broad tests at the higher levels. The testing quadrants distinguish a technology or business perspective, and supporting the team or critiquing the product. They are models for reasoning, not a mandatory sequence.']],
 trap:'The percentage of passed tests does not, on its own, describe release risk.',
 example:'98% of tests pass, but a payment can be duplicated: an aggregate metric does not make a critical defect negligible.'},
6:{sections:[
 ['One aid, many tasks','Tools can manage tests and defects, analyse code, generate data, run tests, and measure coverage or load. Choose them according to objectives and how they fit into the process. A test management tool does not automatically run every test it stores.'],
 ['Value and cost of test automation','Repetitive checks are good candidates: test automation can increase repeatability and speed. But it needs implementation, data, environments, maintenance and analysis of the results. Flaky tests and over-reliance on reports can hide problems.'],
 ['An experiment before scaling up','Try the tool on representative cases, measure benefits and costs, and check skills and compatibility. If the interface changes often, consider moving some checks to a more stable level.']],
 trap:'Automating a poor check makes it faster, not necessarily more useful.',
 example:'A suite that fails at random on every build consumes attention: stabilise data, synchronisation and environment before extending it.'},
7:{sections:[
 ['Values, not bans','The Manifesto puts individuals, working software, collaboration and responding to change first. It does not remove tools, documents, contracts or plans: it weighs their usefulness. If a requirement is ambiguous, a conversation with examples works better than adding mandatory fields to a form. The decision is then kept in whatever form testing, maintenance and project constraints require.'],
 ['Whole team and feedback','Quality is a shared responsibility. Business, development and testing clarify examples, risks and criteria together before implementing. The tester contributes critical thinking, but does not become solely responsible for quality. An early demo can disprove an assumption about the user’s need even when every technical test passes: verifying the code and validating the value are complementary activities.'],
 ['Testable stories','The 3Cs are Card, Conversation and Confirmation. The card starts a conversation, while examples and criteria confirm the understanding. INVEST asks for stories that are independent, negotiable, valuable, estimable, small and testable. “The site must be fast” does not specify a verifiable outcome: agreed conditions, load and threshold are needed. Avoid prescribing the implementation when the need can be expressed as behaviour.'],
 ['Scrum, Kanban and planning','Scrum uses fixed-length Sprints, at most one month in the 2020 Scrum Guide; two weeks is not mandatory. The Daily Scrum inspects progress toward the Sprint Goal: the three traditional questions are not mandatory. Kanban makes the flow visible and limits work in progress. Release planning looks at a wider horizon; iteration planning details the upcoming stories, risks, tasks and tests. Adapting the plan does not mean accepting any change without assessing its impact.'],
 ['Workshop: the wrong booking','Original scenario: a clinic receives a prototype that lets patients book a visit but not choose the location. The code passes every test written. Before going on, describe whom to involve, which question to ask and which evidence to collect. Worked solution: involve a front-office representative, development and testing; ask whether the location is a mandatory choice for the patient; try an example with two locations. A passing technical test does not solve a misunderstood need. The outcome of the conversation becomes a verifiable criterion and a change to the plan, assessed together with the priorities.'],
 ['Self-check: explain, do not spot keywords','Before marking the chapter as read, explain with an example why a useful procedure can stay in an Agile project, why sharing quality does not remove specialisations, and why feedback must be able to change a decision. If you can only pick a sentence containing “collaboration”, repeat the workshop in a different context: a refund, a delivery address or informed consent.'],
 ['Reference version and limits','Preparation for CTFL-AT, 2014 syllabus, not Advanced Agile Tester 2.0. The 2020 Scrum Guide reference in the supplementary material is a modern comparison, not an extra objective of the 2014 exam. The questions are original and cover every syllabus objective; they are not official ISTQB questions. Sources and sunset dates are on the track’s home page.']],
 trap:'Agile does not mean no documentation, nor arbitrary changes that jeopardise the Sprint Goal.',
 example:'A discount request arrives during the Sprint: clarify value, risk and impact with the Product Owner before changing the work. The change is neither automatically forbidden nor automatically accepted.'},
8:{sections:[
 ['Testing while building','Analysis and testing start with the stories: looking for ambiguity before the code prevents rework. During the iteration, components, integrations and system behaviour are tested according to risk. Test levels do not disappear and need not all be sequential. Regression testing checks existing parts after a change; confirmation testing instead verifies that the specific defect has been fixed.'],
 ['CI and sustainable regression testing','Frequent integration gives fast feedback only if builds and checks are reliable. A pipeline can compile, run static analysis, execute tests and produce reports. A green build only shows that those checks passed under those conditions. Useful tests, maintenance, reproducible data and failure analysis are needed. A smoke test quickly selects testable builds; it does not replace full regression testing.'],
 ['Informing decisions','A board shows the status of the work, a burndown the remaining work according to the chosen measure: neither proves quality on its own. Add open risks, coverage, defects and results. A high number of passed tests can hide the fact that payment was never checked. The tester makes these limits visible without turning the report into a meaningless list of activities.'],
 ['Independence and improvement','Working with developers supports prevention and context; keeping a critical viewpoint reduces shared biases. Pair testing, cross-reviews or outside expertise can help depending on the risk. The retrospective examines the process and chooses verifiable actions: for example, stabilising three intermittent tests and measuring false alarms in the next iteration. It is not a meeting for assigning blame.']],
 trap:'Test automation and a green build do not prove the absence of defects. Team velocity and product quality are different measures.',
 example:'If a hundred passing tests do not cover refunds, a change to payments needs new targeted checks. Comparing the total number of tests is not enough.'},
9:{sections:[
 ['TDD, ATDD and BDD: reading the clues','TDD drives small development steps: a test that fails for the expected reason, the minimal implementation that passes, refactoring with the tests green. ATDD starts from acceptance examples agreed by business, development and testing before implementation. BDD promotes a shared understanding of behaviour, often expressed with Given–When–Then. The phrase “automated system tests” alone does not let you choose between these practices: you need purpose, participants and timing.'],
 ['Pyramid and quadrants','The test pyramid suggests many fast checks at the low levels and fewer expensive end-to-end tests; it does not forbid UI tests or impose a universal percentage. The testing quadrants combine a technology/business perspective with supporting the team/critiquing the product: Q1 technical components, Q2 supporting functional examples, Q3 exploration and business evaluation, Q4 technical quality such as performance. They guide conversation and coverage; they are not four phases to run in order.'],
 ['Risk, estimation and criteria','Product risk depends on the likelihood and impact of the problem. Risk guides priority, depth and techniques; the estimate includes data preparation, environments, execution, analysis and maintenance. Do not confuse risk with cost alone or frequency alone. Concrete acceptance criteria are a basis for testing, but they do not cover every risk: security, accessibility and regression testing may need further checks.'],
 ['Techniques in practice','For an integer field allowed from 18 to 65, the partitions are below 18, from 18 to 65, above 65. 2-value BVA uses 17, 18, 65, 66; testing a middle value is not enough. In exploratory testing, a test charter defines mission, scope and risks; the session keeps notes, results and questions. A mind map organises ideas but does not run tests automatically. Choose tools for the problem, considering maintenance, skills and the reliability of the results.']],
 trap:'The test level alone does not identify TDD, ATDD or BDD. Look at who collaborates, when and for what purpose.',
 example:'Before developing a refund, business, tester and developer agree valid and rejected examples: ATDD. The programmer then writes a failing component test and implements the rule: TDD. The two practices can coexist.'},
10:{sections:[
 ['How to use this set','The document supplied is titled “Practice questionnaire, Version 5”. The questionnaire version is not a syllabus version. The file contains no answer grid; the answers and rationales here are an editorial review by the trainer, not an official ITA-STQB key. Each question keeps a reference to the number and page of the PDF.'],
 ['Rewording and compatibility','The set contains terminology and topics that do not match the CTFL 4.0.1 path. Questions on roles, exit criteria, configuration, estimation and the classification of techniques were made more precise to avoid answers that depend on implicit assumptions. Use cases and the test harness are kept as supplementary topics. This set is not automatically included in the CTFL mock exam.'],
 ['Method for numeric questions','Before reading the options, write down the partitions or paths. For equivalence partitioning, assign each value to a partition and look for partitions left uncovered. For coverage, count the distinct elements, not how many times a statement is executed. A single run can cover every statement of an if with no else, but not both outcomes of the condition.'],
 ['Method for distinctions','Ask yourself what is observed and what is the cause: the delay is a failure, the unnecessary check in the code is a defect. Ask yourself what is measurement and what is action: collecting progress is test monitoring, replanning is test control. Separate the budget constraint from the estimate of the work, and the severity of a problem from the urgency of fixing it.']],
 trap:'The solutions are editorial. The word “official” in the source does not make these rewordings or their answers official.',
 example:'With an if and no else, the test that makes the condition true can cover every statement. Covering the false outcome needs another test: do not confuse the two measures.'}
