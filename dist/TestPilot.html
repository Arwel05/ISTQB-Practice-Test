'use strict';
const D=root.TrainerData;
// One reviewed adaptation per source question; correct option first before rotation.
// No official answer key is present in the supplied PDF.
const rows=[
[1,2,3,'Ispezioni','Quale descrizione identifica un’ispezione?', ['Una review formale con processo definito per trovare difetti','Una review necessariamente svolta da un auditor esterno','Una lettura informale senza processo definito','Un altro nome del test di accettazione'], ['Formalità, ruoli e processo distinguono l’ispezione; lo scopo è rilevare anomalie nei prodotti di lavoro.','Un auditor esterno non è un requisito che definisce un’ispezione.','Una review informale è utile ma non è un’ispezione formale.','L’accettazione valuta bisogni e disponibilità all’uso, non identifica un tipo di review.']],
[2,2,5,'Rischio di progetto','Quale rischio riguarda soprattutto il progetto, anziché la qualità del prodotto?', ['Non riuscire a concordare i requisiti in tempo','Un calcolo produce importi sbagliati','Il prodotto risponde troppo lentamente','Un guasto del dispositivo danneggia una persona'], ['Il problema minaccia organizzazione, tempi e capacità di realizzare il lavoro. Può anche avere conseguenze sulla qualità, ma la causa descritta è di progetto.','La correttezza del calcolo è una proprietà del prodotto.','Le prestazioni insufficienti sono un rischio di prodotto.','Il danno dovuto al funzionamento del prodotto è un rischio di prodotto, anche se molto grave.']],
[3,2,4,'Copertura strutturale','Quale tecnica usa le istruzioni eseguite per misurare la copertura?', ['Testing delle istruzioni, una tecnica white-box','Testing esplorativo come unica definizione','Testing di accettazione come livello','Testing di integrazione come livello'], ['La misura confronta istruzioni eseguite e istruzioni eseguibili. È copertura strutturale, non una prova generale di efficacia o assenza di difetti.','L’esplorazione è guidata dall’apprendimento e dall’esperienza, non definita da questa metrica.','Un livello indica l’oggetto e lo scopo del test, non la tecnica di copertura.','L’integrazione verifica interfacce; può usare tecniche diverse.']],
[4,3,4,'Quattro assegnazioni alternative','Un programma sceglie il ramo maschile o femminile. In ciascuno assegna una taglia diversa per 3 < età < 5 oppure 5 ≤ età < 7. Le quattro assegnazioni sono mutuamente esclusive. Quanti test servono almeno per eseguirle tutte?', ['4','2','6','8'], ['Ogni esecuzione raggiunge al massimo una delle quattro assegnazioni: servono almeno quattro test. Le combinazioni maschile/4, maschile/5, femminile/4 e femminile/5 le raggiungono tutte, quindi quattro sono anche sufficienti.','Due test possono raggiungere al massimo due assegnazioni distinte.','I percorsi senza assegnazione possono servire ad altri obiettivi, non a coprire queste quattro istruzioni.','Contare tutte le combinazioni di condizioni non è richiesto dalla copertura delle istruzioni.']],
[5,3,1,'Ruoli nel testing','In un progetto con ruoli distinti, quale attività è prevalentemente tecnico-operativa per il tester?', ['Preparare l’ambiente ed elaborare i test','Approvare da solo il budget del progetto','Assumere automaticamente tutta la responsabilità della strategia','Decidere le priorità di business senza stakeholder'], ['Preparazione e attività tecniche appartengono al lavoro di testing. La distribuzione concreta dei ruoli dipende dal contesto: il modello a V non impone da solo tutti i confini organizzativi.','L’autorità sul budget non deriva automaticamente dal ruolo di tester.','La strategia coinvolge responsabilità gestionali e confronto con il progetto.','Le priorità di business richiedono il contributo dei responsabili del prodotto.']],
[6,3,6,'Test harness','A cosa serve un test harness?', ['Fornire supporti per eseguire test, come driver e stub','Essere soltanto la descrizione testuale di un caso','Essere un capitolo del report finale','Essere soltanto il file dei dati di input'], ['Il driver richiama il componente; lo stub sostituisce una dipendenza chiamata. Questi supporti consentono di eseguire e osservare test anche in isolamento.','La specifica del caso descrive il test, ma non costituisce da sola il supporto di esecuzione.','Il report comunica risultati, non invoca il componente.','I dati possono essere parte dell’ambiente, ma non esauriscono il concetto di harness.']],
[7,4,1,'Errore, difetto, failure','Un salvataggio supera il limite richiesto di un secondo. Un controllo inutile nel ciclo ne è la causa. Che cosa è il ritardo osservato?', ['Un malfunzionamento (failure)','Il difetto nel codice stesso','L’errore umano che ha introdotto il controllo','Una prova che i requisiti non contano'], ['Il comportamento osservato diverge da quello richiesto: è il malfunzionamento. Il controllo inutile è il difetto che lo causa; una decisione umana può averlo introdotto.','Il difetto è la causa nel prodotto, non il comportamento lento osservato.','L’errore umano è un’azione o valutazione sbagliata, non il tempo misurato.','Un requisito prestazionale verificabile è una base valida per rilevare il problema.']],
[8,4,6,'Categorie di strumenti','Quale associazione descrive uno strumento di monitoraggio del sistema, non di gestione dei test?', ['Raccogliere consumo di memoria e comportamento durante l’esecuzione','Organizzare casi e campagne di test','Tracciare stato di esecuzione e risultati delle campagne','Collegare requisiti, casi e difetti'], ['Le misure del sistema sono monitoraggio tecnico. Un prodotto integrato può offrire più funzioni, ma lo scopo della funzione resta distinto.','Questa è una funzione tipica di gestione del testware.','Questa è gestione e rendicontazione delle attività di test.','Questa è tracciabilità, spesso supportata dalla gestione dei test.']],
[9,4,1,'Completamento del testing','Quale attività NON è tipicamente un risultato specifico del completamento dei test?', ['Scrivere da zero tutta la documentazione del sistema','Archiviare il testware utile','Condividere le lezioni apprese','Consegnare gli asset di test a chi li manterrà'], ['Documentare l’intero sistema è un’attività più ampia del progetto. Il completamento del testing conserva evidenze, risorse riutilizzabili e apprendimento.','L’archiviazione permette riuso e consultazione successiva.','Le lezioni apprese aiutano a migliorare il processo.','Il passaggio di consegne sostiene manutenzione e test futuri.']],
[10,4,6,'Effetto sonda','Aggiungere log temporali rende più lento il programma misurato. Quale fenomeno si osserva?', ['Effetto sonda','Prova che il programma originale è più difettoso','Perdita di efficacia dei test ripetuti','Copertura completa delle istruzioni'], ['La misurazione perturba il fenomeno misurato: i log consumano tempo e risorse. Considerare overhead, buffering e condizioni di misura prima di attribuire tutto il ritardo al prodotto.','La differenza può essere introdotta dalla strumentazione stessa.','La ripetizione dei medesimi test è un principio diverso.','Una variazione di prestazione non misura la copertura.']],
[11,5,2,'TDD','Quale descrizione rappresenta il ciclo TDD?', ['Scrivere un test che fallisce, implementare il necessario e rifattorizzare con test verdi','Scrivere test solo dopo tutto il codice','Definire TDD come qualsiasi automazione fatta da tester','Attendere l’accettazione finale prima di ogni modifica'], ['Il test precede e guida piccoli incrementi del codice. Verificare il fallimento atteso evita un test apparentemente verde che non controlla il comportamento desiderato.','I test tardivi non guidano l’implementazione nel senso del TDD.','L’autore e la sola automazione non definiscono la pratica.','Il TDD usa cicli brevi, non una barriera di accettazione finale.']],
[12,5,3,'Statico e dinamico','È corretto saltare sempre il testing statico perché si faranno test dinamici?', ['No: lo statico può trovare presto difetti senza esecuzione','Sì: il dinamico rende ridondante ogni review','No: lo statico è obbligatoriamente successivo al dinamico','Sì: un requisito non eseguibile non può contenere difetti'], ['Ambiguità, contraddizioni e problemi nel codice possono emergere prima dell’esecuzione, riducendo rilavorazione. Statico e dinamico si completano.','Possono rilevare categorie di problemi diverse e in momenti diversi.','Lo statico può iniziare molto prima che il software sia eseguibile.','Anche documenti e modelli possono contenere difetti.']],
[13,5,5,'Report di avanzamento','Quale insieme offre evidenze quantitative utili in un report di avanzamento del testing?', ['Difetti aperti/chiusi, effort effettivo, test eseguiti/falliti/bloccati','Soltanto il piano iniziale','Soltanto un elenco di nomi dei tester','Soltanto il numero di righe del report'], ['Le tre misure descrivono stato del prodotto, consumo di risorse e progresso dei test. Vanno interpretate rispetto a piano, rischio e destinatari, senza ridurre la qualità al conteggio.','Il piano da solo non mostra ciò che è realmente successo.','I nomi non descrivono progresso, risultati o rischi.','La lunghezza del report non è una misura utile dello stato del testing.']],
[14,6,4,'Percentuali di copertura','L’80% degli esiti delle decisioni è stato esercitato. Ciò dimostra automaticamente almeno l’80% delle istruzioni eseguite?', ['No: gli esiti possono contenere quantità molto diverse di istruzioni','Sì: le percentuali sono sempre uguali','Sì: il 50% delle decisioni implica sempre il 100% delle istruzioni','No: invece l’80% delle istruzioni implica sempre l’80% delle decisioni'], ['Un esito non attraversato può contenere molte istruzioni. Per esempio, con cinque if indipendenti si possono coprire otto dei dieci esiti evitando due corpi molto lunghi: la percentuale di istruzioni resta bassa. Misurare il criterio richiesto.','Le unità di conteggio e i denominatori sono diversi.','La copertura parziale non garantisce quella completa dell’altra metrica.','Neppure l’implicazione inversa vale per percentuali parziali.']],
[15,6,2,'Regressione e livelli','A quali livelli si possono svolgere test di regressione?', ['A tutti i livelli pertinenti alla modifica','Soltanto ai componenti','Soltanto al sistema completo','Mai all’accettazione'], ['Una modifica può danneggiare componenti, interfacce, sistema o comportamenti di accettazione. L’analisi d’impatto decide quali controlli ripetere.','I difetti introdotti non sono confinati ai componenti.','Un feedback a livello più basso può essere utile e più rapido.','Anche comportamenti già accettati possono subire regressioni.']],
[16,6,5,'Controllo e monitoraggio','Quale attività rappresenta il controllo del testing?', ['Ripianificare i test in risposta a un ritardo rilevato','Misurare il numero di casi eseguiti senza intervenire','Raccogliere tempi senza confrontarli o agire','Archiviare un grafico senza decisioni'], ['Il monitoraggio produce informazioni; il controllo usa quelle informazioni per azioni correttive verso gli obiettivi. Non significa abbassare automaticamente i criteri per ottenere un verde.','La misurazione è monitoraggio, non ancora controllo.','La raccolta di dati non è un’azione correttiva.','Un artefatto archiviato non modifica il piano o il lavoro.']],
[17,7,4,'Casi d’uso: approfondimento','Quale descrizione è coerente con un caso d’uso?', ['Interazione verso un obiettivo, con precondizioni, risultati e possibili alternative','Una semplice estensione delle partizioni numeriche','Solo un elenco di istruzioni interne','Un unico scenario che esclude sempre errori e alternative'], ['Il caso d’uso descrive interazioni e risultati dal punto di vista degli attori. Flusso principale e varianti aiutano a ricavare scenari; questo è materiale integrativo, non una tecnica centrale della lista CTFL 4.0.1.','Il raggruppamento di input equivalenti ha una base diversa dalle interazioni verso un obiettivo.','Le istruzioni interne appartengono a una prospettiva strutturale.','Flussi alternativi ed eccezioni possono essere importanti per i test.']],
[18,7,5,'Criteri di uscita: riformulazione','Quale criterio è più oggettivo e verificabile per una decisione di completamento?', ['Nessun difetto critico aperto e copertura concordata raggiunta','Il tester si sente genericamente tranquillo','Il codice sembra elegante','Il report è abbastanza lungo'], ['Soglie e misure concordate rendono la decisione valutabile. Anche tempo e budget possono essere vincoli, ma uscire per esaurimento risorse richiede accettare consapevolmente il rischio residuo.','La fiducia soggettiva va sostenuta da evidenze e non è una soglia riproducibile.','L’eleganza percepita non dimostra copertura o rischio accettabile.','La lunghezza non misura la qualità delle evidenze.']],
[19,8,4,'Istruzioni ed esiti','Programma Y: se D > E, esegui F_D; poi esegui sempre F_E e F_F. Qual è il minimo per coprire tutte e tre le chiamate?', ['Un test con D > E: ciascuna chiamata viene eseguita una volta','Un test con D ≤ E','Due test sono sempre necessari anche per le sole istruzioni','Nessun insieme finito può riuscirci'], ['Con condizione vera si raggiungono F_D, F_E e F_F in una sola esecuzione. Per esercitare entrambi gli esiti della decisione serve anche una condizione falsa: F_E e F_F verranno allora eseguite due volte complessivamente.','Con condizione falsa F_D non è eseguita.','Due test servono per entrambi gli esiti, non per tutte le chiamate in questo programma.','Tutte le chiamate sono raggiungibili con un input adeguato.']],
[20,8,6,'Selezionare strumenti','Quale valutazione è utile prima di adottare uno strumento?', ['Bisogni e maturità, fornitore, costi/benefici e formazione','Solo il numero di aziende che lo usano','Solo il colore dell’interfaccia','Solo la promessa di eliminare ogni attività manuale'], ['La scelta deve funzionare nel contesto reale: integrazione, competenze e costo totale possono rendere inadatto uno strumento tecnicamente valido.','La popolarità non dimostra l’adeguatezza ai propri requisiti.','L’aspetto non sostituisce la valutazione delle funzioni e dei costi.','L’automazione richiede giudizio, progettazione e manutenzione.']],
[21,9,5,'Report riproducibili','Quale descrizione richiede più precisazioni per essere utile in un defect report?', ['L’interfaccia è confusa e non mi piace','Il salvataggio restituisce 500 con i passi e dati allegati','Il totale atteso è 10, quello osservato è 12, nella versione indicata','La lista impiega 13 secondi rispetto ai 10 richiesti, con condizioni documentate'], ['Una valutazione di usabilità può segnalare un problema reale, ma servono compito, utenti o criteri, passi ed evidenze osservabili. Evitare di liquidare l’usabilità come mera opinione.','Codice, procedura e dati aiutano a riprodurre il comportamento.','Atteso, osservato e versione rendono il problema più preciso.','La discrepanza misurata è collegata a requisito e condizioni.']],
[22,9,5,'Rischi di prodotto','Quale elenco contiene soltanto rischi di prodotto?', ['Funzionalità mancante, prestazioni scarse, conversione dati errata','Ambiente consegnato tardi e budget insufficiente','Contratto del fornitore in ritardo e team incompleto','Tester indisponibili e licenze non acquistate'], ['Sono problemi del comportamento o delle proprietà del prodotto che possono danneggiare utenti e business.','Tempi e disponibilità economica minacciano lo svolgimento del progetto.','Contratti e personale sono fattori organizzativi di progetto.','Disponibilità di persone e strumenti riguarda la capacità di svolgere il lavoro.']],
[23,9,6,'Proof of concept','Qual è lo scopo principale di un proof of concept per uno strumento di test?', ['Verificare fattibilità e adeguatezza rispetto a bisogni concreti','Giustificare comunque una decisione già presa','Dimostrare che il prodotto finale sarà senza difetti','Eliminare ogni successiva prova pilota'], ['Una prova circoscritta verifica ipotesi tecniche con casi rappresentativi. Può ridurre incertezza, non dimostrare tutti i benefici organizzativi di un’adozione su larga scala.','La valutazione deve poter smentire l’ipotesi di acquisto.','Uno strumento non garantisce la qualità del prodotto.','Un pilota può ancora servire per processi, ruoli e integrazione reale.']],
[24,9,1,'Dal cosa al come','Quale sequenza logica descrive lo sviluppo dei test?', ['Condizioni di test → casi di test → procedure di esecuzione','Procedure → condizioni → casi','Casi → procedure → bisogno da verificare','Risultati → procedure → condizioni, sempre'], ['Le condizioni identificano cosa verificare; i casi precisano input e risultati; le procedure organizzano l’esecuzione. In pratica sono possibili iterazioni, non un divieto di tornare alle decisioni precedenti.','Organizzare l’esecuzione prima di capire cosa testare non è questa sequenza logica.','La base e le condizioni orientano i casi, non vengono necessariamente scoperte solo alla fine.','I risultati possono fornire feedback, ma non definiscono l’ordine logico iniziale.']],
[25,10,2,'Conferma e regressione','Dopo la correzione di un difetto, quali domande guidano conferma e regressione?', ['La correzione risolve il problema? Ha danneggiato altre parti?','Entrambe chiedono solo se il difetto iniziale è risolto','La conferma cerca solo effetti collaterali','La regressione sostituisce sempre la conferma'], ['La conferma verifica il difetto corretto; la regressione cerca conseguenze indesiderate della modifica, anche in componenti collegati. Sono complementari.','Questo trascura gli effetti collaterali.','Gli effetti collaterali sono il focus della regressione.','Una suite di regressione potrebbe non riprodurre il caso specifico del difetto.']],
[26,10,5,'Configurazione: riformulazione','È stato installato un tool di configurazione. Quale controllo serve prima di dichiarare il testware sotto controllo di versione?', ['Verificare che asset e versioni siano effettivamente identificati e gestiti','Considerare l’installazione come prova sufficiente','Escludere dati e script dalla configurazione','Imporre senza valutazione un tool diverso da quello dello sviluppo'], ['Possedere un tool non significa averne applicato il processo. Baseline, identificazione e gestione delle modifiche rendono riproducibile il test e possono sostenere criteri di ingresso.','L’installazione non dimostra che gli asset siano stati registrati.','Anche dati, script e ambiente influenzano la riproducibilità.','La scelta deve considerare interoperabilità e bisogni, non diversità obbligata.']],
[27,10,5,'Dati per riprodurre difetti','Un report specifica esattamente il file dati usato e la sua versione. A cosa serve?', ['Aiutare a riprodurre e isolare il problema','Dimostrare automaticamente la causa del difetto','Sostituire risultato atteso e osservato','Misurare da solo l’avanzamento del progetto'], ['Gli stessi dati riducono le differenze tra ambienti e tentativi. Conservare una versione identificabile evita che un file condiviso modificato renda la riproduzione impossibile.','La riproduzione aiuta la diagnosi ma non prova automaticamente la causa.','Occorre comunque descrivere la discrepanza osservata.','Un riferimento ai dati non è una misura complessiva del progresso.']],
[28,11,4,'Tecniche basate sull’esperienza','Quale beneficio offrono le tecniche basate sull’esperienza?', ['Suggerire scenari difficili da ricavare con altre tecniche','Funzionare solo se si conosce tutto il codice','Rendere sempre inutili le specifiche','Garantire sempre più difetti di ogni altra tecnica'], ['Conoscenza di dominio, guasti passati e comportamento degli utenti orientano casi speciali. Sono complementari alle tecniche sistematiche, non una garanzia universale di superiorità.','Si può usare esperienza di dominio senza conoscere il codice.','Specifiche ed esperienza possono essere usate insieme.','Il risultato dipende da contesto, competenze e tipo di difetti.']],
[29,11,5,'Stima e budget: riformulazione','Il lavoro previsto richiede circa 20 giornate ma il budget ne consente 12. Quale comportamento è corretto?', ['Rendere visibile il divario e negoziare ambito, risorse o rischio','Dichiarare che la stima è 12 solo perché quello è il budget','Mantenere tutto l’ambito senza comunicare l’incertezza','Trattare la stima come una certezza senza assunzioni'], ['Il budget è un vincolo; la stima descrive l’effort atteso sotto determinate ipotesi. Cambiare ambito può cambiare la stima, ma non basta cambiare il numero per eliminare il lavoro.','Confondere disponibilità e fabbisogno nasconde il rischio.','Un piano incompatibile con le risorse richiede decisioni esplicite.','Qualità, complessità e dipendenze rendono le stime incerte e aggiornabili.']],
[30,11,5,'Severità e priorità','Quale affermazione sulla gestione delle anomalie è corretta?', ['Si possono registrare anomalie prima di confermare che siano difetti; severità e priorità sono distinte','Ogni problema grave deve avere sempre la massima priorità','Solo i tester possono segnalare anomalie','Si registra una segnalazione solo dopo aver corretto la causa'], ['La severità descrive impatto, la priorità l’urgenza di intervento. Un problema grave in una funzionalità non rilasciata può avere urgenza diversa da un problema meno grave che blocca un evento imminente.','L’urgenza dipende anche da contesto, esposizione e obiettivi.','Sviluppatori e altri stakeholder possono segnalare problemi.','La registrazione supporta proprio indagine, decisione e correzione.']],
[31,11,1,'Attività di test','Quale attività appartiene soprattutto all’analisi, anziché all’esecuzione?', ['Individuare e prioritizzare le condizioni da testare','Registrare i risultati effettivi','Confrontare atteso e osservato','Eseguire una procedura sulla build'], ['L’analisi stabilisce cosa verificare e quanto conta. Implementazione prepara testware e dati; esecuzione usa tali asset e produce risultati. Le attività possono ripetersi e sovrapporsi.','La registrazione avviene durante l’esecuzione e documenta evidenze.','Il confronto valuta l’esito di un’esecuzione.','L’applicazione della procedura è esecuzione.']],
[32,12,1,'Contributo del testing','Come contribuisce il testing alla qualità?', ['Fornendo evidenze per valutare il prodotto e decidere miglioramenti','Eliminando sempre tutti i rischi','Correggendo automaticamente ogni difetto trovato','Provando l’assenza di ogni difetto residuo'], ['Scoprire problemi e valutare caratteristiche informa decisioni e correzioni. Il testing può anche prevenire difetti attraverso feedback precoce, ma non garantisce perfezione.','Il rischio può essere ridotto e gestito, non necessariamente eliminato.','Diagnosi e correzione richiedono attività ulteriori, come debugging.','Un insieme finito di test non prova in generale l’assenza di difetti.']],
[33,12,4,'Base della tecnica: riformulazione','Si ricavano test da una lista di errori frequenti in progetti precedenti. Qual è la base prevalente?', ['Esperienza, ad esempio error guessing','Specifiche, solo perché i test usano l’interfaccia esterna','Struttura, anche senza informazioni sul codice','Nessuna tecnica: la storia dei difetti è sempre inutile'], ['La classificazione dipende da come si ricavano i casi. Una lista di guasti passati usa esperienza; osservare l’esterno non trasforma automaticamente la derivazione in una tecnica basata sulle specifiche.','La prospettiva esterna non identifica da sola la base di progettazione.','Una tecnica strutturale richiede informazioni sulla struttura pertinente.','La storia può suggerire rischi, pur senza garantire copertura completa.']],
[34,12,3,'Preparazione delle ispezioni','Quale pratica è meno coerente con un’ispezione efficace?', ['Riunioni senza obiettivo o limite concordato','Preparazione individuale del materiale','Registrazione delle anomalie','Ruoli e processo definiti'], ['Una sessione senza confini favorisce dispersione e stanchezza. Ambito, preparazione e gestione del tempo sostengono una review rigorosa e risultati verificabili.','La preparazione permette di individuare anomalie prima della discussione.','Le evidenze registrate supportano analisi e follow-up.','La formalità dell’ispezione richiede responsabilità e attività definite.']],
[35,12,4,'Partizioni: gruppo al museo','Il numero intero di visitatori ammesso è da 2 a 20 inclusi. Quali partizioni numeriche rispettano la regola?', ['Minore di 2; da 2 a 20; maggiore di 20','Solo negativi; da 2 a 20; maggiore di 20','Minore di 2; da 2 a 19; da 20 in su','Minore di 3; da 3 a 19; da 20 in su'], ['I tre gruppi separano il dominio numerico in non valido basso, valido e non valido alto. Sono disgiunti e coprono tutti gli interi; testo o campo vuoto richiederebbero altre condizioni se ammessi come input.','Zero e uno restano esclusi dal partizionamento proposto.','Venti è valido e non va classificato con i valori troppo grandi.','Due e venti sono entrambi validi ma vengono classificati male.']],
[36,13,4,'Quattro partizioni','Per x ≤ −100; −100 < x < 100; 100 ≤ x < 1000; x ≥ 1000, quale insieme copre tutte le partizioni?', ['−500, 0, 100, 1000','−1000, −100, 100, 1000','−100, 100, 1000, 1001','−99, 99, 101, 1001'], ['−500 appartiene alla prima, 0 alla seconda, 100 alla terza e 1000 alla quarta. Non serve scegliere sempre confini: la copertura delle partizioni richiede rappresentanti di ciascun gruppo.','I primi due valori sono entrambi nella prima; manca la seconda.','Gli ultimi due sono nella quarta; manca la seconda.','I primi due sono nella seconda; manca la prima.']],
[37,13,4,'BVA ed esperienza','Quale tecnica NON è classificata come basata sull’esperienza?', ['Analisi dei valori limite','Error guessing','Testing esplorativo','Attacco ai difetti basato su guasti tipici'], ['La BVA deriva sistematicamente valori dai confini delle partizioni ordinate. Conoscere bene il dominio aiuta, ma non cambia la base della tecnica.','Error guessing usa conoscenza ed esperienza di possibili errori.','L’esplorazione usa apprendimento, progettazione ed esecuzione insieme.','L’attacco a difetti tipici si basa su conoscenza di guasti ricorrenti.']],
[38,13,2,'Livelli e ordine','Dopo aver testato un sistema isolato si verificano le interfacce con un altro sistema. È sensato?', ['Sì: l’integrazione di sistemi può richiedere verifiche successive del collegamento','No: qualunque integrazione deve sempre precedere qualunque test di sistema','No: tutti i livelli hanno esattamente gli stessi obiettivi','Sì, perché il testing di componente rende inutili gli altri livelli'], ['Livelli diversi hanno oggetti e obiettivi diversi. Distinguere integrazione tra componenti e tra sistemi evita di imporre un unico ordine rigido a ogni contesto.','L’affermazione ignora tipi di integrazione e cicli iterativi.','Componenti, interfacce, sistema e accettazione non hanno obiettivi identici.','La correttezza locale non dimostra quella delle interazioni o del sistema.']],
[39,14,4,'Età nella trentina','Età intere da 30 a 39 inclusi appartengono alla trentina. Quale insieme rappresenta le tre partizioni sotto/dentro/sopra?', ['25, 30, 40','30, 35, 25','20, 35, 39','30, 39, 45'], ['25 è sotto, 30 è dentro e 40 è sopra. Si coprono tre partizioni con tre rappresentanti; non è ancora una copertura completa dei valori limite.','30 e 35 sono dentro; manca un valore sopra 39.','35 e 39 sono dentro; manca un valore sopra 39.','30 e 39 sono dentro; manca un valore sotto 30.']],
[40,14,4,'Strutturale e livelli','Il testing basato sulla struttura è limitato al solo livello di componente?', ['No: si può applicare a livelli diversi se la struttura pertinente è disponibile','Sì: non può riguardare interfacce o flussi più ampi','Sì: deve sempre precedere la costruzione dei componenti','No: significa che ogni test di sistema è automaticamente strutturale'], ['La struttura può essere codice, architettura o altri elementi pertinenti al livello. La possibilità di applicare la tecnica non significa che sia sempre la scelta più utile o economica.','L’ambito strutturale non è necessariamente confinato a una singola unità.','Serve una struttura pertinente su cui basare l’analisi; non è una fase obbligata precedente.','Un livello di test non determina automaticamente la tecnica usata.']]
];

['Come usare questa raccolta','Il documento fornito si intitola “Questionario di prova, Versione 5”. La versione del questionario non è una versione del syllabus. Il file non contiene una griglia delle soluzioni; le risposte e motivazioni qui presenti sono una revisione editoriale del trainer, non una chiave ufficiale ITA-STQB. Ogni domanda conserva un riferimento al numero e alla pagina del PDF.'],
['Riformulazioni e compatibilità','Sono presenti terminologia e argomenti non coincidenti con il percorso CTFL 4.0.1. I quesiti su ruoli, criteri di uscita, configurazione, stima e classificazione delle tecniche sono stati precisati per evitare risposte dipendenti da assunzioni implicite. I casi d’uso e il test harness sono mantenuti come approfondimenti. Questa raccolta non viene inserita automaticamente nella simulazione CTFL.'],
['Metodo per le domande numeriche','Prima delle opzioni scrivi le partizioni o i percorsi. Per l’equivalenza assegna ogni valore a una classe e cerca classi scoperte. Per la copertura conta gli elementi distinti, non il numero di volte che un’istruzione viene ripetuta. Una singola esecuzione può coprire tutte le istruzioni di un if senza else, ma non entrambi gli esiti della condizione.'],
['Metodo per le distinzioni','Chiediti cosa è osservato e cosa è causa: il ritardo è un malfunzionamento, il controllo inutile nel codice è un difetto. Chiediti cosa è misurazione e cosa è azione: raccogliere progresso è monitoraggio, ripianificare è controllo. Distingui il vincolo economico dalla stima del lavoro e la gravità del problema dall’urgenza di correggerlo.']

const D=root.TrainerData;
const questions={
q001:{prompt:'Which of these is a legitimate objective of testing?',options:['Providing information about quality and risk','Proving that no defects exist','Fixing all the defects in the code','Replacing every release decision'],explanation:'Test results provide evidence that supports decisions. They do not prove the complete absence of defects; fixing the code is debugging.'},
q002:{prompt:'A test reveals an incorrect total. The developer finds a wrong formula and fixes it. What is this second activity called?',options:['Acceptance testing','Automated static analysis','Test planning','Debugging'],explanation:'Finding the cause in the code and fixing it is debugging. The test revealed the problem; a subsequent test can confirm the fix.'},
q003:{prompt:'Why discuss examples of behaviour while the requirements are being defined?',options:['To hand all responsibility for quality over to the tester','To prove that the product is already correct','To prevent different interpretations before implementation','To avoid any later dynamic testing'],explanation:'Examples expose ambiguities at a point when they are cheaper to fix. They do not replace verifying the implemented software.'},
q004:{prompt:'Which activity is mainly quality assurance, focused on the process?',options:['Comparing actual and expected results','Improving the review process after analysing its gaps','Running a login test','Reporting an incorrect total in the shopping cart'],explanation:'Quality assurance aims to improve processes in order to prevent problems. The other activities evaluate a product directly: they are quality control.'},
q005:{prompt:'An analyst misreads a rule, the code contains a wrong comparison and a transaction is rejected. What is the defect?',options:['The wrong comparison in the code','The analyst’s misreading','The observed rejection of the transaction','The customer who submits the transaction'],explanation:'A human error can introduce a defect into the product. When that defect is triggered during execution, a failure is observed.'},
q006:{prompt:'A system meets all its specifications, but users cannot get their work done. Which principle best explains the problem?',options:['Defects are always distributed evenly','Exhaustive testing is always possible','Every defect always causes a failure','Absence-of-defects fallacy'],explanation:'Even a product that conforms to its specifications may not meet users’ real needs. Verifying the requirements is not enough without also considering use and value.'},
q007:{prompt:'An unchanged test suite finds fewer and fewer new defects. What is the most appropriate response?',options:['Conclude that the system contains no defects','Just repeat the same data more often','Review the test cases, data and scenarios while keeping the useful regression tests','Remove all the tests that pass'],explanation:'Tests can become less effective at finding new problems. Updating and extending them helps, and regression testing keeps its value.'},
q008:{prompt:'You are deriving test conditions from a specification. Which activity are you mainly performing?',options:['Debugging','Test analysis','Test execution','Test completion'],explanation:'Test analysis identifies what to test. Test design determines how, test implementation prepares what is needed for execution, and test execution produces results.'},
q009:{prompt:'Two teams are testing a video game and a medical device. Why might their test processes differ?',options:['Risks, constraints and context influence the process','Testing has a single process that is valid for every product','Only the size of the team influences testing','Video games do not need testing'],explanation:'The test approach and its rigour depend on the context, the risks, the development lifecycle and the constraints. Test techniques are not applied identically to every product.'},
q010:{prompt:'Which work product is typically produced during test execution?',options:['An initial definition of the strategic objectives','The code of the fix','The commercial contract for the project','A record of the actual results'],explanation:'The test log records what happened during execution. The test plan, the code of fixes and contracts serve different purposes at different times.'},
q011:{prompt:'A requirement changes. Which information helps most in identifying the tests to update?',options:['The alphabetical order of the test names','The number of closed defects alone','The traceability links between the requirement and the tests','The total number of developers'],explanation:'Traceability makes dependencies and coverage visible, which supports impact analysis. An aggregate count does not identify the tests affected.'},
q012:{prompt:'Which task belongs mainly to the test management role?',options:['Writing all the production code, as a mandatory duty','Coordinating test planning, test monitoring and test control','Fixing every application defect','Unilaterally approving every business requirement'],explanation:'The test management role coordinates activities and resources. The testing role focuses mainly on the technical activities; the same person can take on both roles.'},
q013:{prompt:'How does a tester best communicate a contentious problem?',options:['By presenting the steps and the evidence, and listening to the team’s explanations','By blaming the defect on the author’s lack of skill','By not reporting the problem, to avoid conflict','By sending only “it doesn’t work”'],explanation:'Precise, constructive communication makes the problem easier to solve. Blaming people or leaving out evidence reduces collaboration.'},
q014:{prompt:'In the whole team approach, who contributes to quality?',options:['Only the testers','Only the product owner','Only an external reviewer','The whole team'],explanation:'Skills complement each other and quality is a shared responsibility. This does not remove specialist roles or any independence requirements.'},
q015:{prompt:'Which of these is a possible benefit of a tester who is independent of the author?',options:['They do not need to communicate with the team','They always know the code better than the author','They can challenge assumptions that the author holds','They guarantee that no defects remain'],explanation:'Independence brings different perspectives, but it does not guarantee completeness and can lead to isolation if collaboration is lacking.'},
q016:{prompt:'70% of the detected defects are in two modules out of twenty. What does this evidence suggest?',options:['Always spread the effort equally','Focus further investigation on the high-risk modules without ignoring the others','Stop testing all the other modules','Assume that 70% of future defects will be identical'],explanation:'Defect clustering informs test priority. It does not show that there are no problems elsewhere, nor does it predict future defects exactly.'},
q017:{prompt:'In iterative development, where do the test activities normally fit?',options:['They are repeated and adapted in each increment','They happen only after the last iteration','They are limited to the initial documentation','They are replaced by the retrospective'],explanation:'Each increment needs feedback and verification consistent with the work done. Regression testing remains necessary as the product evolves.'},
q018:{prompt:'Which practice supports testing in any software development lifecycle?',options:['Always waiting for coding to finish before thinking about tests','Having only end users design the tests','Not linking tests to objectives','Involving testers early in reviewing work products'],explanation:'Early involvement makes it possible to clarify requirements and prepare tests. It does not require any particular development model.'},
q019:{prompt:'Which approach uses small tests on the code to drive its implementation?',options:['Beta testing','Formal inspection','TDD','Maintenance testing'],explanation:'In TDD you start with a failing test, implement just enough code and then refactor. ATDD, by contrast, works from shared acceptance examples.'},
q020:{prompt:'A DevOps pipeline runs automated tests on every change. Which statement is most accurate?',options:['It makes non-functional testing unnecessary','It speeds up feedback, but needs reliable tests and maintenance','It removes any need for manual testing','It guarantees that every build is ready for release'],explanation:'Test automation and continuous integration speed up the discovery of problems, but they do not cover all risks on their own.'},
q021:{prompt:'Which example represents shift left?',options:['Reviewing the acceptance criteria before coding','Moving all testing to after the release','Eliminating system testing','Leaving all verification to users in production'],explanation:'Bringing discussion and verification forward helps to prevent problems. It does not mean removing the checks that are needed in later phases.'},
q022:{prompt:'A retrospective identifies delays in the test environments. What is the most useful outcome?',options:['A list of who is to blame, with no actions','Cancelling the integration tests','A general promise to work better','An assigned action, with a measure to evaluate the improvement'],explanation:'A concrete improvement must be implemented and checked. Discussion alone, without ownership and follow-up, does not change the process.'},
q023:{prompt:'You check the messages exchanged between the order system and an external payment gateway. Which test level best describes this test?',options:['Static analysis','Unit test of an internal function','System integration testing','An isolated component'],explanation:'The interaction between separate systems is the subject of system integration testing. Interactions between internal components are the subject of component integration testing instead.'},
q024:{prompt:'You measure response time with 500 concurrent users. What type of testing are you performing?',options:['Informal review','Non-functional testing (performance)','Functional testing only','Confirmation testing only'],explanation:'Performance describes how well the system behaves. The test type does not, on its own, determine the test level at which it is performed.'},
q025:{prompt:'After a fix, you re-run the case that caused the crash. What is the immediate objective?',options:['To confirm that the original defect has been fixed','To prove that there is no regression of any kind','To measure the requirements coverage of the project','To check every external interface'],explanation:'This is confirmation testing. To look for side effects of the change, regression testing with a selection of tests is also needed.'},
q026:{prompt:'A stable application is migrated to a new version of its database. Which testing is relevant?',options:['None, because the application code does not change','Only a review of the contract','Only the tests from the original development, without adaptation','Maintenance testing based on the impact of the migration'],explanation:'A change to the environment can change the behaviour. Impact analysis helps to select tests for the migration and for regression testing.'},
q027:{prompt:'A group of users checks that the product supports their operational workflow. Which test level is most relevant?',options:['Component integration testing','Control flow analysis','Acceptance testing','Component testing'],explanation:'Acceptance testing focuses on needs and readiness for use. System testing may already have verified the technical requirements without validating the whole operational use.'},
q028:{prompt:'The login fix might affect password recovery. Which activity looks for this side effect?',options:['Removing tests that have already passed','Regression testing','Confirmation testing of the login only','Analysis of the initial requirements only'],explanation:'Regression testing looks for unintended consequences of changes. Re-testing only the original defect does not check the related functionality.'},
q029:{prompt:'Which work product can be examined by static testing?',options:['A user story that has not yet been implemented','Only a running program','Only an installed executable file','Only a screen in production'],explanation:'Requirements, models, code and tests can be examined without executing the software under test.'},
q030:{prompt:'A review finds that two requirements contradict each other. What is the main benefit?',options:['Guaranteeing that all the requirements are complete','Automatically eliminating all dynamic testing','Directly measuring the performance of the system','Correcting the inconsistency before it spreads into the implementation'],explanation:'Early detection can avoid rework. A review does not prove completeness and does not measure runtime performance.'},
q031:{prompt:'Which activity is static testing?',options:['A user observes a crash','A test measures memory use during execution','An analyser reports a variable used before initialisation, without executing the program','A test sends HTTP requests to the service'],explanation:'The analyser examines the work product without executing it. The other activities observe a running system.'},
q032:{prompt:'What benefit does frequent stakeholder feedback provide?',options:['Preventing any change','Clarifying expectations and misunderstandings earlier','Freezing the requirements forever','Making all future communication unnecessary'],explanation:'Early and frequent feedback helps to align the product with real needs and to reduce misunderstandings. It does not eliminate change.'},
q033:{prompt:'Before the group discussion, the reviewers examine the document on their own. Which activity is this?',options:['Individual review','Fixing and reporting','Test implementation','Dynamic execution'],explanation:'Individual review allows anomalies to be identified and then analysed together. Fixing and reporting, by contrast, concerns the corrections and their follow-up.'},
q034:{prompt:'Who facilitates a review meeting and helps to keep it productive?',options:['The compiler','The end user, necessarily','The author alone, in every type of review','The moderator'],explanation:'The moderator facilitates collaboration, discussion and time management. The scribe records; the author explains and fixes the work product.'},
q035:{prompt:'Which review type is normally the most formal, with defined criteria, roles and collection of metrics?',options:['An ad hoc chat exchange','Any walkthrough without preparation','Inspection','Informal review'],explanation:'An inspection follows a formalised process. A walkthrough is generally led by the author and is not automatically equivalent to an inspection.'},
q036:{prompt:'Which factor contributes to a successful review?',options:['Avoiding different skills in the group','Clear objectives and enough time to prepare','Using defect counts to blame the authors','Discussing without reading the material'],explanation:'Preparation, shared objectives and a constructive atmosphere improve a review. Judging people punitively discourages useful reports.'},
q037:{prompt:'You derive tests from the rules in a specification without using the structure of the code. Which family of test techniques are you using?',options:['Black-box','White-box','Static analysis only','Debugging only'],explanation:'Black-box test techniques derive tests from the specified behaviour. White-box test techniques use the internal structure and the control flow instead.'},
q038:{prompt:'A field accepts whole-number ages from 18 to 65 inclusive. Which set covers the three partitions below, within and above the range?',options:['18, 40, 65','20, 30, 40','17, 16, 66','17, 40, 66'],explanation:'17 represents the partition below the range, 40 the valid partition and 66 the partition above the range. Several values from the same partition do not cover a missing partition.'},
q039:{prompt:'A fare is A for 0–9 km, B for 10–29 km and C for 30 km or more. For non-negative whole distances, what is the minimum number of tests that covers these valid partitions?',options:['4','40','3','2'],explanation:'The three bands behave differently, so at least one representative of each is needed. The question concerns only the valid partitions given.'},
q040:{prompt:'A field accepts integers from 10 to 20 inclusive. Which set achieves 2-value BVA coverage of both boundaries?',options:['8, 10, 20, 22','9, 10, 20, 21','10, 15, 20','9, 11, 19, 21'],explanation:'Each boundary separates two partitions: 9/10 at the lower boundary and 20/21 at the upper one. 2-value BVA needs the two values on either side of each boundary.'},
q041:{prompt:'For the valid integer range 10–20, which values do you add to 9, 10, 20, 21 for 3-value BVA?',options:['11 and 19','8 and 22','12 and 18','0 and 30'],explanation:'3-value BVA tests each boundary value and both its neighbours: 9, 10, 11 and 19, 20, 21. 8 and 22 are not the inner neighbours of the valid boundaries.'},
q042:{prompt:'A discount applies only if the customer is a member AND the total is at least €100. Which case gets the discount?',options:['Non-member, total €150','Member, total €99','Non-member, total €99','Member, total €100'],explanation:'Both conditions must be true. “At least 100” includes 100; neither membership alone nor the amount alone is enough.'},
q043:{prompt:'Two Boolean conditions are independent and all combinations are possible. How many rules does the full decision table have before it is simplified?',options:['3','8','4','2'],explanation:'Two possible values for each of the two conditions give 2 × 2 = 4 combinations. Rules with the same actions may allow the table to be simplified afterwards.'},
q044:{prompt:'An account changes from Active to Locked after three consecutive wrong passwords; a correct login resets the count. Starting from Active, which sequence locks it?',options:['Wrong, wrong, correct','Wrong, wrong, wrong','Wrong, correct, wrong','Correct, wrong, correct'],explanation:'Locking depends on three consecutive login errors. A successful login resets the count and breaks the sequence.'},
q045:{prompt:'A state model has the transitions A→B, B→A, B→C and C→A. What percentage of the transitions does the path A→B→C→A cover?',options:['75%','100%','50%','25%'],explanation:'The path exercises three distinct transitions out of four. It visits every state but does not exercise B→A: all states coverage and valid transitions coverage are different.'},
q046:{prompt:'A test suite executes 18 of the 24 executable statements. What is the statement coverage?',options:['80%','60%','100%','75%'],explanation:'Statement coverage is 18/24 × 100 = 75%. You do not count the number of tests or the number of lines in the file, which may include comments.'},
q047:{prompt:'A test suite covers 100% of the reachable branches. What can you conclude about the reachable statements?',options:['No statement is necessarily executed','All possible paths are covered','They are 100% covered','They are necessarily only 50% covered'],explanation:'Branch coverage subsumes statement coverage of the reachable statements. It does not imply that all paths are covered, especially when there are loops.'},
q048:{prompt:'What is a limitation of a test suite with 100% structural coverage?',options:['It makes expected results unnecessary','It may not detect required functionality that has not been implemented','It proves that all the requirements are met','It guarantees the absence of defects'],explanation:'The existing structure alone cannot reveal missing functionality. Specification-based tests and suitable test oracles are also needed.'},
q049:{prompt:'A tester tries a name containing an apostrophe, remembering similar defects in the past. Which test technique are they using?',options:['Error guessing','Boundary value analysis, necessarily','Branch coverage','Three-point estimation'],explanation:'The choice comes from experience of likely errors. It does not require a partition or a formal structural model.'},
q050:{prompt:'In a session with a defined objective, the tester learns from the behaviour and immediately adapts the next tests. This is an example of:',options:['Rigidly scripted execution','Inspection only','Random testing with no objective','Exploratory testing'],explanation:'In exploratory testing, learning, test design and test execution influence one another. A test charter and notes keep the session focused and easy to communicate.'},
q051:{prompt:'What is a risk of an overly generic checklist?',options:['It prevents any use of experience','It always requires access to the source code','Different testers may interpret the items in different ways','It automatically guarantees full coverage'],explanation:'Checklist items should be understandable and verifiable. A checklist guides attention but does not guarantee full coverage or identical results.'},
q052:{prompt:'Business, development and testing discuss a user story together. What are they mainly trying to achieve?',options:['Testers choosing the programming language','A shared understanding supported by examples','A story without any verifiable criteria','Eliminating all future communication'],explanation:'Different perspectives bring out ambiguities and missing cases. Collaboration improves the understanding and testability of the story.'},
q053:{prompt:'“Given an empty cart, when I add a product, then a line item appears” is an acceptance criterion written in which format?',options:['Scenario-oriented','Branch coverage','Risk estimation','Resource table'],explanation:'The Given/When/Then format describes a concrete scenario. Acceptance criteria can also be rule-oriented, for example a checklist.'},
q054:{prompt:'A story says: “After three consecutive wrong attempts the account is locked”. Which acceptance test is most directly relevant?',options:['Active account; one wrong password; expect it to be locked','Active account; correct login; expect it to be locked','Locked account; change the colour of the button','Active account; three consecutive wrong passwords; check that it is locked'],explanation:'In acceptance testing, the test turns the criterion into a precondition, actions and an observable result. The other cases contradict the rule or do not check it.'},
q055:{prompt:'A format field accepts only PDF or PNG; all other values form an invalid partition. Which set covers the three partitions given?',options:['TXT, DOC, GIF','PNG, PNG, PNG','PDF, PNG, TXT','PDF, PDF, PNG'],explanation:'The specified partitions are PDF, PNG and other. TXT represents the invalid partition; three invalid formats do not cover the two valid partitions.'},
q056:{prompt:'A shopping cart accepts whole-number quantities from 1 to 99. Which set covers both boundaries with 2-value BVA?',options:['0, 50, 100','0, 1, 99, 100','1, 50, 99','2, 98'],explanation:'The pairs next to the boundaries are 0/1 and 99/100. A middle value may be useful for other purposes, but it does not replace a boundary value.'},
q057:{prompt:'An IF has a true branch and a false branch, with no ELSE. A test exercises only the true branch. What is the branch coverage of the two branches?',options:['50%','100%','0%','There is no false branch without an ELSE'],explanation:'Even without an ELSE block, there is a transfer of control when the condition is false. Exercising only the true outcome covers one branch out of two.'},
q058:{prompt:'Access is granted if (badge valid) AND (PIN correct). You have tested true/true and false/true. How many combinations remain to cover the full decision table?',options:['0','1','3','2'],explanation:'True/false and false/false are missing. All four combinations are possible for the two independent conditions.'},
q059:{prompt:'Which content is appropriate in a test plan?',options:['Only the source code','A guarantee that there are no risks','Scope, test approach, resources and exit criteria','Only the list of defects already fixed'],explanation:'The test plan coordinates objectives and work. A list of defects or the code cannot replace the test approach, the resources and the criteria.'},
q060:{prompt:'How can a tester contribute to iteration planning?',options:['By postponing all discussion of testing until the end','By clarifying the testability, risks and test effort of the stories','By guaranteeing that every story is free of defects','By single-handedly setting every business priority'],explanation:'The tester brings a perspective on verification and risks, helping with estimates and acceptance criteria. Planning remains a collaborative activity.'},
q061:{prompt:'“The environment is available and the smoke test passes” is used to decide whether to start a test cycle. This is an example of:',options:['Entry criteria','Exit criteria','Defect report','Branch coverage metric'],explanation:'Entry criteria define the readiness to start an activity. Exit criteria define when it can be considered complete.'},
q062:{prompt:'Most optimistic estimate 4 hours, most likely 7, most pessimistic 16. Using three-point estimation, E = (a + 4*m + b) / 6, what is the estimate?',options:['9 hours','7 hours','27 hours','8 hours'],explanation:'(4 + 4×7 + 16) / 6 = 48 / 6 = 8. The simple average of the three values would give 9, but that is not the weighted formula required.'},
q063:{prompt:'T1 covers a low risk. T2 covers a high risk but requires T3. T3 is available and prepares the data. Which order respects both risk and dependency?',options:['T1, T2, T3','T2, T1, T3','T3, T2, T1','T2, T3, T1'],explanation:'T3 must run first for T2 to run correctly. Then the high risk is addressed before T1: priority does not override dependencies.'},
q064:{prompt:'Which configuration describes the test pyramid?',options:['Only manual acceptance tests','Many small, fast tests at the bottom and fewer broad tests at the top','Only end-to-end tests','The same number of tests at every level, as a mandatory rule'],explanation:'The test pyramid represents a typical distribution that gives fast feedback and limits the cost of broader tests. It does not prescribe a fixed number.'},
q065:{prompt:'In the testing quadrants, where are business-facing exploratory tests that critique the product typically placed?',options:['Q3','Q1','Q2','Q4'],explanation:'Q3 is business facing and critiques the product: it includes exploratory testing. Q1 is technology facing and supports the team, Q2 is business facing and supports the team, and Q4 is technology facing and critiques the product.'},
q066:{prompt:'Which two attributes are normally used to assess the level of a risk?',options:['Number of testers and colour of the user interface','Age of the project and name of the product','Number of tests and number of comments','Likelihood and impact'],explanation:'Risk combines the possibility that an event occurs with its consequences. A simple count of tests does not represent these two aspects.'},
q067:{prompt:'Which of these is a project risk, as distinct from a product risk?',options:['A user can read other users’ data','Checkout charges a payment twice','The test environment will not be ready on time','The system calculates taxes incorrectly'],explanation:'A late test environment threatens the plan and the delivery. The other examples concern problematic characteristics or behaviour of the product.'},
q068:{prompt:'Risk analysis identifies a function with a high likelihood of failure and a severe impact. How should this influence testing?',options:['Just count the total number of tests','Increase the priority and depth of the relevant tests','Exclude it because it is difficult','Reduce testing because the risk is already known'],explanation:'Risk analysis guides the scope, priority, test techniques and effort. Knowing about a risk is not the same as reducing it.'},
q069:{prompt:'After testing, a significant unmitigated risk remains. What is an appropriate response?',options:['Communicate it and support an explicit decision about the residual risk','Leave it out if most of the tests pass','Declare it non-existent because the date is close','Change the metric so that everything appears green'],explanation:'Risk control includes risk mitigation and risk monitoring. Residual risks must be visible to the decision makers; a passed test elsewhere does not remove them.'},
q070:{prompt:'Which of these is a test execution progress metric?',options:['Name of the project manager','Colour of the application logo','Number of sales meetings','Number of tests executed compared with those planned'],explanation:'Comparing executed with planned tests helps to track progress. It should be read together with results, risk and quality, not as the only evidence of readiness.'},
q071:{prompt:'Which information is particularly useful in a test completion report?',options:['Only the number of hours, with no results','All the raw logs, with no summary for the reader','Overall results, deviations and residual risks','An absolute statement that there are no defects'],explanation:'The report summarises what has been achieved and what remains open. It should help the reader make decisions, not just pile up data.'},
q072:{prompt:'You need to report test status to non-technical executives. Which approach is most suitable?',options:['Use the same technical detail for every audience','Summarise the impact, the risks and the decisions needed, with accessible evidence','Send only stack traces, with no context','Hide all open defects'],explanation:'The format and level of detail should be adapted to the audience. The summary must stay faithful to the evidence and make the risks clear.'},
q073:{prompt:'A test fails only on an old build, but the results do not record the versions. Which practice solves this traceability problem?',options:['Configuration management of builds, tests, data and environment','Just increasing the number of tests','Deleting all failed results','Renaming the product'],explanation:'Identifying versions and baselines makes results interpretable and reproducible. More tests do not make up for unknown configurations.'},
q074:{prompt:'An app closes when you save a name containing an apostrophe. Which report is most useful?',options:['“Profile broken, fix now”','“Developer error”','“App slow”, with no other details','Build 2.1, Windows 11; open Profile, enter D’Amico, save; expected: saved; actual: app closes; log attached'],explanation:'The detailed report gives the context, steps, data, expected versus actual results and evidence. The others do not allow the problem to be reproduced and analysed.'},
q075:{prompt:'On comparable projects, testing takes 25% of the development effort. For 120 person-days of development, what estimate do you get with estimation based on ratios?',options:['45 person-days','480 person-days','30 person-days','25 person-days'],explanation:'120 × 0.25 = 30. Its validity depends on how comparable the projects are: a historical ratio does not guarantee the actual effort.'},
q076:{prompt:'T1 covers R1 and R2; T2 covers R2 and R3; T3 covers R4. You have already run T1. Giving priority to the greatest additional coverage, how many new requirements does T2 cover?',options:['0','1','2','3'],explanation:'R2 is already covered by T1, so T2 adds only R3. Additional coverage counts the items not yet covered, not all the items the test covers.'},
q077:{prompt:'You want to identify unreachable code automatically, without executing the program. Which tool do you choose?',options:['Static analysis tool','Load generator','GUI test recorder','A ticketing system on its own'],explanation:'Static analysis examines the structure of the code. A load generator requires execution, and a ticketing system organises reports.'},
q078:{prompt:'Which of these is a possible benefit of test automation?',options:['No maintenance at all','An automatic guarantee of quality','No more test design','Repeatable execution of frequent checks'],explanation:'Test automation can make checks repeatable and fast. Test design, maintenance and interpretation of the results are still needed.'},
q079:{prompt:'You need to organise test cases, test runs and shared results. Which category of tools is most relevant?',options:['Compilation only','Load generation only','Test management','Memory profiling only'],explanation:'Test management tools help to plan and record the work. They do not mean that the recorded test cases are executed automatically.'},
q080:{prompt:'Which of these is a risk of test automation?',options:['Reducing repetitive work','Underestimating maintenance effort and placing excessive trust in automated tests','Having repeatable checks','Getting faster feedback'],explanation:'Brittle suites, underestimated costs and over-reliance can reduce the value of test automation. The other options are potential benefits.'}
};

const glossary=[
['Error','A human action that produces an incorrect result.'],
['Defect','A flaw in a work product, such as a wrong formula or an incorrect requirement.'],
['Failure','Observed behaviour that does not meet what is required.'],
['Test oracle','The source you use to determine the expected result: a rule, a model or a trusted reference.'],
['Testware','The work products of testing, such as test cases, test data, scripts and results.'],
['Test basis','The information used to analyse and design tests.'],
['Traceability','The links between items such as requirements, tests, results and defects.'],
['Confirmation testing','Checking that the original problem has been fixed.'],
['Regression testing','Looking for unintended side effects after a change.'],
['Equivalence partition','A group of values that are expected to be handled in the same way.'],
['BVA','Boundary value analysis: designing tests around the boundaries of ordered partitions.'],
['Coverage','How much of the identified items has been exercised, according to an explicit measure.'],
['Test charter','A short mission that guides an exploratory testing session.'],
['Residual risk','The part of a risk that remains after mitigation actions.'],
['Severity','How serious the consequences of a defect are.'],
['Priority','How urgently action is needed compared with other work.'],
['Entry criteria','Conditions used to decide whether to start an activity.'],
['Exit criteria','Conditions used to decide whether an activity can be completed.'],
['Baseline','An agreed version of configuration items, which can be changed only through a controlled process.'],
['ATDD','Acceptance tests agreed before implementation to guide development.'],
['TDD','Developing code driven by small tests, in cycles of test, implementation and refactoring.'],
['Shift left','Moving test activities earlier in the development lifecycle where appropriate.'],
['Static testing','Examining a work product without executing the software under test.'],
['Dynamic testing','Testing that requires executing the software under test.']
];
D.en={questions,chapters,glossary};
