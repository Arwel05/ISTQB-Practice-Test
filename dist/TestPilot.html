</script><script>/* English overlay for the ITA-STQB v5 set (ita001–ita040), in authored order (correct option first); see content-en-rotate.js.
   Editorial adaptations with editorial solutions, as in Italian. Pending review. */
(function(root){
'use strict';
const rows={
ita001:['Which description identifies an inspection?',['A formal review with a defined process to find defects','A review that must be carried out by an external auditor','An informal read-through with no defined process','Another name for acceptance testing'],['Formality, roles and process set the inspection apart; its purpose is to detect anomalies in work products.','An external auditor is not a defining requirement of an inspection.','An informal review is useful, but it is not a formal inspection.','Acceptance testing assesses needs and readiness for use; it is not a type of review.']],
ita002:['Which risk concerns mainly the project rather than the quality of the product?',['Failing to agree the requirements in time','A calculation produces wrong amounts','The product responds too slowly','A device failure injures a person'],['The problem threatens organisation, schedule and the ability to do the work. It may also affect quality, but the cause described is a project risk.','The correctness of a calculation is a property of the product: a product risk.','Insufficient performance is a product risk.','Harm caused by the product’s behaviour is a product risk, even a very serious one.']],
ita003:['Which technique uses the executed statements to measure coverage?',['Statement testing, a white-box technique','Exploratory testing as the only definition','Acceptance testing as a test level','Integration testing as a test level'],['The measure compares executed statements with executable statements. It is structural coverage, not general proof of effectiveness or of the absence of defects.','Exploratory testing is driven by learning and experience, not defined by this metric.','A test level indicates the object and purpose of testing, not the coverage technique.','Integration testing checks interfaces; it can use various techniques.']],
ita004:['A program chooses the male or female branch. In each, it assigns a different size for 3 < age < 5 or 5 ≤ age < 7. The four assignments are mutually exclusive. What is the minimum number of tests needed to execute them all?',['4','2','6','8'],['Each run reaches at most one of the four assignments, so at least four tests are needed. The combinations male/4, male/5, female/4 and female/5 reach them all, so four are also enough.','Two tests can reach at most two distinct assignments.','Paths with no assignment may serve other objectives, not the coverage of these four statements.','Counting every combination of conditions is not required by statement coverage.']],
ita005:['In a project with distinct roles, which activity is mainly technical and operational for the tester?',['Preparing the environment and developing the tests','Approving the project budget alone','Automatically taking full responsibility for the strategy','Deciding business priorities without stakeholders'],['Preparation and technical activities belong to the testing work. The actual distribution of roles depends on context: the V-model alone does not set every organisational boundary.','Authority over the budget does not come automatically with the tester role.','The strategy involves management responsibilities and discussion with the project.','Business priority decisions need the input of the product owners.']],
ita006:['What is a test harness for?',['Providing support for running tests, such as drivers and stubs','Being only the written description of a test case','Being a chapter of the final report','Being only the input data file'],['The driver calls the component; the stub replaces a called dependency. These aids allow tests to be run and observed even in isolation.','The test case specification describes the test, but is not by itself the execution support.','The report communicates results; it does not call the component.','Data can be part of the environment, but they do not cover the whole concept of a harness.']],
ita007:['A save operation exceeds the required one-second limit. The cause is an unnecessary check in the loop. What is the observed delay?',['A failure','The defect in the code itself','The human error that introduced the check','Proof that the requirements do not matter'],['The observed behaviour differs from what is required: that is the failure. The unnecessary check is the defect that causes it; a human decision may have introduced it.','The defect is the cause in the product, not the slow behaviour observed.','The human error is a wrong action or judgement, not the measured time.','A verifiable performance requirement is a valid basis for detecting the problem.']],
ita008:['Which association describes a system monitoring tool rather than a test management tool?',['Collecting memory usage and behaviour during execution','Organising test cases and test campaigns','Tracking execution status and results of the campaigns','Linking requirements, test cases and defects'],['Measuring the system is technical monitoring. An integrated product may offer several functions, but the purpose of each function stays distinct.','This is a typical testware management function.','This is management and reporting of test activities, not monitoring.','This is traceability, often supported by test management.']],
ita009:['Which activity is NOT typically a specific outcome of test completion?',['Writing all the system documentation from scratch','Archiving useful testware','Sharing lessons learned','Handing test assets over to whoever will maintain them'],['Documenting the whole system is a broader project activity. Test completion preserves evidence, reusable resources and learning.','Archiving allows reuse and later consultation.','Lessons learned help improve the process.','The handover supports maintenance and future testing.']],
ita010:['Adding timing logs makes the measured program slower. Which phenomenon is this?',['The probe effect','Proof that the original program is more defective','Tests losing effectiveness when repeated','Full statement coverage'],['Measuring disturbs what is measured: the logs consume time and resources. Consider overhead, buffering and measurement conditions before blaming the product for all of the delay.','The difference may be introduced by the instrumentation itself.','The repetition of the same tests is a different principle.','A change in performance does not measure coverage.']],
ita011:['Which description represents the TDD cycle?',['Write a failing test, implement what is needed and refactor with the tests green','Write tests only after all the code','Define TDD as any test automation done by testers','Wait for final acceptance before any change'],['The test comes first and drives small increments of code. Checking the expected failure avoids a test that is green but does not check the desired behaviour.','Late tests do not drive the implementation in the TDD sense.','Neither the author nor automation alone defines the practice.','TDD uses short cycles, not a final acceptance barrier.']],
ita012:['Is it right to always skip static testing because dynamic testing will be done?',['No: static testing can find defects early, without execution','Yes: dynamic testing makes every review redundant','No: static testing must always come after dynamic testing','Yes: a requirement that cannot be executed cannot contain defects'],['Ambiguities, contradictions and problems in the code can surface before execution, reducing rework. Static testing and dynamic testing complement each other.','They can detect different kinds of problems at different times.','Static testing can start long before the software can be executed.','Documents and models can contain defects too.']],
ita013:['Which set provides useful quantitative evidence in a test progress report?',['Defects open/closed, actual effort, tests run/failed/blocked','Only the initial plan','Only a list of the testers’ names','Only the number of lines in the report'],['The three measures describe the state of the product, the resources used and test progress. They must be read against plan, risk and audience, without reducing quality to a count.','The plan alone does not show what actually happened.','Names say nothing about progress, results or risks.','The length of the report is not a useful measure of the state of testing.']],
ita014:['80% of decision outcomes have been exercised. Does this automatically prove that at least 80% of statements were executed?',['No: outcomes can contain very different numbers of statements','Yes: the percentages are always equal','Yes: 50% decision coverage always implies 100% statement coverage','No: but 80% statement coverage always implies 80% decision coverage'],['An outcome not taken may contain many statements. For example, with five independent if statements you can cover eight of the ten outcomes while avoiding two very long bodies: statement coverage stays low. Measure the criterion that is required.','The counting units and the denominators are different.','Partial coverage does not guarantee full coverage of the other metric.','The reverse implication does not hold for partial percentages either.']],
ita015:['At which levels can regression testing be performed?',['At every level relevant to the change','Only at component level','Only on the complete system','Never at acceptance level'],['A change can damage components, interfaces, the system or accepted behaviour. Impact analysis decides which checks to repeat.','The defects introduced are not confined to components.','Feedback at a lower level can be useful and faster.','Behaviour that has already been accepted can also regress.']],
ita016:['Which activity represents test control?',['Replanning the tests in response to a detected delay','Measuring the number of test cases run without taking action','Collecting timings without comparing them or acting','Archiving a chart without any decision'],['Test monitoring produces information; test control uses that information for corrective actions towards the objectives. It does not mean automatically lowering the criteria to get a green result.','Measuring is test monitoring, not yet control.','Collecting data is not a corrective action.','An archived artefact does not change the plan or the work.']],
ita017:['Which description fits a use case?',['An interaction towards a goal, with preconditions, results and possible alternatives','A simple extension of numeric partitions','Only a list of internal statements','A single scenario that always excludes errors and alternatives'],['A use case describes interactions and results from the actors’ point of view. The main flow and its variants help derive scenarios; this is supplementary material, not a core technique of the CTFL 4.0.1 list.','Grouping equivalent inputs into a partition has a different basis from goal-oriented interactions.','Internal statements belong to a structural perspective.','Alternative flows and exceptions can matter for testing.']],
ita018:['Which criterion is the most objective and verifiable for a completion decision?',['No open critical defects and the agreed coverage reached','The tester feels generally confident','The code looks elegant','The report is long enough'],['Agreed thresholds and measures make the decision assessable. Time and budget can also be constraints, but stopping because resources ran out means consciously accepting the residual risk.','Subjective confidence must be backed by evidence and is not a reproducible threshold.','Perceived elegance does not prove coverage or acceptable risk.','Length does not measure the quality of the evidence.']],
ita019:['Program Y: if D > E, call F_D; then always call F_E and F_F. What is the minimum to cover all three calls?',['One test with D > E: each call is executed once','One test with D ≤ E','Two tests are always needed, even for statements alone','No finite set can achieve it'],['With the condition true, F_D, F_E and F_F are reached in a single run. Exercising both outcomes of the decision also needs a false condition: F_E and F_F will then run twice in total.','With the condition false, F_D is not executed.','Two tests are needed for both outcomes, not for all the calls in this program.','All the calls are reachable with suitable input.']],
ita020:['Which assessment is useful before adopting a tool?',['Needs and maturity, vendor, costs and benefits, and training','Only the number of companies using it','Only the colour of the interface','Only the promise of eliminating every manual activity'],['The choice must work in the real context: integration, skills and total cost can make a technically sound tool unsuitable.','Popularity does not prove it fits your own requirements.','Appearance does not replace assessing functions and costs.','Test automation needs judgement, design and maintenance.']],
ita021:['Which description needs the most clarification to be useful in a defect report?',['The interface is confusing and I don’t like it','Saving returns a 500 error, with steps and data attached','The expected total is 10, the observed total is 12, in the stated version','The list takes 13 seconds instead of the required 10, under documented conditions'],['A usability judgement can point to a real problem, but it needs a task, users or criteria, steps and observable evidence. Avoid dismissing usability as mere opinion.','Code, procedure and data help reproduce the behaviour.','Expected, observed and version make the problem more precise.','The measured discrepancy is linked to a requirement and to conditions.']],
ita022:['Which list contains only product risks?',['Missing functionality, poor performance, incorrect data conversion','Environment delivered late and insufficient budget','Supplier contract late and incomplete team','Testers unavailable and licences not purchased'],['These are problems in the behaviour or properties of the product that can harm users and the business.','Schedule and money threaten the running of the project.','Contracts and staff are organisational project factors.','Availability of people and tools concerns the ability to do the work.']],
ita023:['What is the main purpose of a proof of concept for a test tool?',['Checking feasibility and fit against concrete needs','Justifying a decision already taken anyway','Proving that the final product will be defect-free','Eliminating any later pilot project'],['A limited trial checks technical assumptions with representative cases. It can reduce uncertainty, but it cannot prove all the organisational benefits of large-scale adoption.','The assessment must be able to disprove the purchase hypothesis.','A tool does not guarantee product quality.','A pilot may still be needed for processes, roles and real integration.']],
ita024:['Which logical sequence describes test development?',['Test conditions → test cases → test procedures','Procedures → conditions → test cases','Test cases → procedures → the need to verify','Results → procedures → conditions, always'],['Test conditions identify what to verify; test cases specify inputs and results; procedures organise execution. In practice iteration is possible; going back to earlier decisions is not forbidden.','Organising execution before understanding what to test is not this logical sequence.','The test basis and the test conditions guide the test cases; they are not necessarily discovered only at the end.','Results can provide feedback, but they do not define the initial logical order.']],
ita025:['After a defect is fixed, which questions guide confirmation testing and regression testing?',['Does the fix solve the problem? Has it damaged other parts?','Both ask only whether the original defect is fixed','Confirmation testing looks only for side effects','Regression testing always replaces confirmation testing'],['Confirmation testing checks the fixed defect; regression testing looks for unintended consequences of the change, including in related components. They are complementary.','This overlooks side effects.','Side effects are the focus of regression testing.','A regression suite might not reproduce the specific case of the defect.']],
ita026:['A configuration management tool has been installed. What must be checked before declaring the testware under version control?',['That assets and versions are actually identified and managed','Treat the installation as sufficient proof','Exclude data and scripts from configuration management','Impose a tool different from development’s without assessment'],['Owning a tool does not mean its process has been applied. Baselines, identification and change management make testing reproducible and can support entry criteria.','Installation does not show that the assets have been recorded.','Data, scripts and environment also affect reproducibility.','The choice must consider interoperability and needs, not difference for its own sake.']],
ita027:['A report states exactly which data file was used and its version. What is this for?',['Helping reproduce and isolate the problem','Automatically proving the cause of the defect','Replacing the expected and observed results','Measuring project progress on its own'],['The same data reduces differences between environments and attempts. Keeping an identifiable version prevents a modified shared file from making reproduction impossible.','Reproduction helps diagnosis but does not automatically prove the cause.','The observed discrepancy must still be described.','A reference to data is not an overall measure of progress.']],
ita028:['Which benefit do experience-based techniques offer?',['Suggesting scenarios that are hard to derive with other techniques','Working only if you know all the code','Always making specifications unnecessary','Always finding more defects than any other technique'],['Domain knowledge, past failures and user behaviour point to special cases. They complement systematic techniques; they are not universally superior.','Domain experience can be used without knowing the code.','Specifications and experience can be used together.','The result depends on context, skills and the type of defects.']],
ita029:['The planned work needs about 20 days, but the budget allows 12. Which behaviour is correct?',['Make the gap visible and negotiate scope, resources or risk','Declare the estimate to be 12 just because that is the budget','Keep the full scope without communicating the uncertainty','Treat the estimate as a certainty with no assumptions'],['The budget is a constraint; the estimate describes the expected effort under certain assumptions. Changing the scope can change the estimate, but changing the number does not remove the work.','Confusing what is available with what is needed hides the risk.','A plan incompatible with the resources requires explicit decisions.','Quality, complexity and dependencies make estimates uncertain and subject to updates.']],
ita030:['Which statement about anomaly management is correct?',['Anomalies can be logged before they are confirmed as defects; severity and priority are distinct','Every serious problem must always get the highest priority','Only testers can report anomalies','A report is logged only after the cause has been fixed'],['Severity describes impact, priority the urgency of action. A serious problem in an unreleased feature may be less urgent than a less serious problem that blocks an imminent event.','Urgency also depends on context, exposure and objectives.','Developers and other stakeholders can report problems.','Logging supports exactly the investigation, decision and fix.']],
ita031:['Which activity belongs mainly to test analysis rather than test execution?',['Identifying and prioritising the test conditions','Recording the actual results','Comparing expected and observed results','Running a procedure on the build'],['Test analysis establishes what to verify and how much it matters, which sets its priority. Implementation prepares testware and data; test execution uses those assets and produces results. The activities can repeat and overlap.','Recording happens during test execution and documents evidence.','The comparison evaluates the outcome of a run.','Applying the procedure is test execution.']],
ita032:['How does testing contribute to quality?',['By providing evidence to evaluate the product and decide on improvements','By always eliminating every risk','By automatically fixing every defect found','By proving the absence of any remaining defect'],['Finding problems and evaluating characteristics informs decisions and fixes. Testing can also prevent defects through early feedback, but it does not guarantee perfection.','Risk can be reduced and managed, not necessarily eliminated.','Diagnosis and fixing require further activities, such as debugging.','A finite set of tests cannot prove in general that there are no defects.']],
ita033:['Tests are derived from a list of common errors in previous projects. What is the prevailing basis?',['Experience, for example error guessing','Specifications, only because the tests use the external interface','Structure, even without information about the code','No technique: the defect history is always useless'],['The classification depends on how the test cases are derived. A list of past failures uses experience; observing from outside does not automatically make it a specification-based technique.','The external perspective alone does not identify the design basis.','A structural technique needs information about the relevant structure.','History can suggest risks, even without guaranteeing full coverage.']],
ita034:['Which practice is least consistent with an effective inspection?',['Meetings with no agreed goal or time limit','Individual preparation of the material','Recording the anomalies','Defined roles and process'],['A session without boundaries invites drifting and fatigue. Scope, preparation and time management support a rigorous review and verifiable results.','Preparation allows anomalies to be found before the discussion.','Recorded evidence supports analysis and follow-up.','The formality of an inspection requires defined responsibilities and activities.']],
ita035:['The integer number of visitors allowed is from 2 to 20 inclusive. Which numeric partitions follow the rule?',['Less than 2; from 2 to 20; greater than 20','Negatives only; from 2 to 20; greater than 20','Less than 2; from 2 to 19; from 20 upwards','Less than 3; from 3 to 19; from 20 upwards'],['The three groups divide the numeric domain into invalid low, valid and invalid high. They are disjoint and cover all integers; text or an empty field would need other conditions if accepted as input.','Zero and one are left out of the proposed partitioning.','Twenty is valid and must not be grouped with the values that are too large.','Two and twenty are both valid but are classified wrongly.']],
ita036:['For x ≤ −100; −100 < x < 100; 100 ≤ x < 1000; x ≥ 1000, which set covers all the partitions?',['−500, 0, 100, 1000','−1000, −100, 100, 1000','−100, 100, 1000, 1001','−99, 99, 101, 1001'],['−500 belongs to the first, 0 to the second, 100 to the third and 1000 to the fourth. You do not always have to choose boundaries: partition coverage needs a representative of each group.','The first two values are both in the first partition; the second is missing.','The last two are in the fourth partition; the second is missing.','The first two are in the second partition; the first is missing.']],
ita037:['Which technique is NOT classified as experience-based?',['Boundary value analysis','Error guessing','Exploratory testing','Fault attacks based on typical failures'],['BVA systematically derives values from the boundaries of ordered partitions. Knowing the domain well helps, but it does not change the basis of the technique.','Error guessing uses knowledge and experience of possible errors.','Exploratory testing combines learning, design and execution.','Attacks on typical defects are based on knowledge of recurring failures.']],
ita038:['After testing an isolated system, the interfaces with another system are tested. Does this make sense?',['Yes: system integration testing may require later checks of the connection','No: any integration must always precede any system testing','No: all test levels have exactly the same objectives','Yes, because component testing makes the other levels unnecessary'],['Different levels have different objects and objectives. Distinguishing component integration from system integration avoids imposing a single rigid order on every context.','The statement ignores the types of integration and iterative cycles.','Component, integration, system and acceptance testing do not have identical objectives.','Local correctness does not prove that the interactions or the system are correct.']],
ita039:['Integer ages from 30 to 39 inclusive belong to the thirties. Which set represents the three partitions below/inside/above?',['25, 30, 40','30, 35, 25','20, 35, 39','30, 39, 45'],['25 is below, 30 inside and 40 above. Three representatives cover the three partitions; this is not yet full coverage for boundary value analysis.','30 and 35 are inside; a value above 39 is missing.','35 and 39 are inside; a value above 39 is missing.','30 and 39 are inside; a value below 30 is missing.']],
ita040:['Is structure-based testing limited to component level only?',['No: it can be applied at different levels if the relevant structure is available','Yes: it cannot cover interfaces or wider flows','Yes: it must always come before the components are built','No: it means that system testing is always structural'],['The structure can be code, architecture or other elements relevant to the level. Being able to apply the technique does not mean it is always the most useful or economical choice.','The structural scope is not necessarily confined to a single unit.','It needs a relevant structure on which to base the analysis; it is not a mandatory earlier phase.','A test level does not automatically determine the technique used.']]
