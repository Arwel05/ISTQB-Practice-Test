function courses(){return header(tx('Scegli il tuo percorso.','Choose your learning track.'),tx('Foundation e Agile Tester sono percorsi distinti. Quiz, ripasso e progressi non vengono mescolati.','Foundation and Agile Tester are separate tracks. Quizzes, reviews and progress are not mixed.'))+'<div class="mode-grid">'+['foundation','agile'].map(id=>'<section class="panel"><div class="eyebrow">'+(id==='foundation'?'FOUNDATION':'AGILE TESTER')+'</div><h2>'+(id==='foundation'?'CTFL 4.0.1':'CTFL-AT')+'</h2><p>'+(id==='foundation'?tx('80 domande CTFL, simulazione da 40 quesiti in italiano e inglese beta. In più, 40 quesiti storici ITA-STQB solo per allenamento.','80 CTFL questions, 40-question mock exam in Italian and English beta. Plus 40 historical ITA-STQB practice questions.'):tx('24 domande e tre capitoli dedicati ad Agile, in italiano. Materiale di supporto: non è un corso completo né una simulazione CTFL-AT.','24 questions and three Agile chapters in Italian. Supplementary learning material: not a complete course or CTFL-AT mock exam.'))+'</p>'+btn((id==='foundation'?tx('Entra in Foundation','Enter Foundation'):tx('Entra in Agile','Enter Agile')),'track','', 'data-track="'+id+'"')+'</section>').join('')+'</div><p class="small muted">'+tx('Backup e profilo restano unici. Lo storico misto precedente è conservato nel backup, ma escluso dai riepiloghi dei due percorsi.','Profile and backup remain shared. Earlier mixed sessions are preserved in the backup but excluded from track summaries.')+'</p>';}
function agileHome(){return header('Agile Tester · CTFL-AT',tx('Un percorso autonomo: collaborazione, pratiche e tecniche di testing Agile.','A separate track: collaboration, practices and Agile testing techniques.'))+betaNotice()+statsMarkup()+'<div class="actions">'+pageBtn(tx('Studia Agile','Study Agile'),'learn','')+pageBtn(tx('Allenamento Agile','Agile practice'),'practice','secondary')+'</div><div class="chapter-list section-gap">'+chapterRows()+'</div>'+agileExam();}
function agileExam(){return '<section class="panel section-gap"><h2>'+tx('Simulazione Agile non disponibile','Agile mock exam unavailable')+'</h2><p>'+tx('La banca attuale contiene 24 quesiti: non viene riciclata la simulazione Foundation. Allenamento e ripasso Agile restano disponibili in italiano.','The current bank contains 24 questions: the Foundation mock exam is not reused. Agile practice and review are available in Italian.')+'</p></section>';}
function chapterRows(){return D.chapters.map(raw=>{const ch=LC(raw),pool=bank().filter(q=>q.chapter===ch.id),size=pool.length,summary=C.summarize(pool,state.stats);return `<button class="chapter-row" data-action="lesson" data-id="${ch.id}"><div class="chapter-icon" style="--chapter:${ch.color}">${icon(ch.icon)}</div><div class="chapter-body"><h3>${String(track==='agile'?ch.id-6:ch.id).padStart(2,'0')} &nbsp; ${ch.title}</h3><small>${!size?t('chapter.noEnglish'):summary.unique?t('chapter.attempted',{n:summary.unique,size}):t('chapter.ready')} · ${ch.weight?t('chapter.inExam',{n:ch.weight}):t('chapter.practiceOnly')}</small><div class="progress-track"><div style="width:${size?summary.unique/size*100:0}%"></div></div></div><span class="muted">${summary.accuracy===null?'—':summary.accuracy+'%'}</span>${icon('chevron')}</button>`;}).join('');}
function header(title,description,extra=''){return `<div class="page-head"><div><h1>${title}</h1><p>${description}</p></div>${extra}</div>`;}
function statsMarkup(){const s=C.summarize(D.questions,state.stats),due=C.due(bank(),state).length;return `<div class="stats"><div class="stat"><div class="stat-top">${t('stats.explored')} ${icon('layers')}</div><div class="stat-value">${s.unique} <span>/ ${D.questions.length}</span></div><small>${t('stats.coverage')}</small></div><div class="stat"><div class="stat-top">${t('stats.correct')} ${icon('target')}</div><div class="stat-value">${s.accuracy===null?'—':s.accuracy+'%'} </div><small>${s.seen?t('stats.correctOf',{correct:s.correct,seen:s.seen}):t('stats.firstStep')}</small></div><div class="stat"><div class="stat-top">${t('stats.toReview')} ${icon('cycle')}</div><div class="stat-value">${due} <span>${t('stats.questions')}</span></div><small>${due?t('stats.dueHint'):t('stats.adaptsHint')}</small></div></div>`;}
// English beta notice with the translated-question counter and a one-tap way back to Italian.
function betaNotice(){if(!english())return '';if(track==='agile')return '<div class="callout">Agile learning material is currently in Italian. Switch to Italian to practise; no Foundation questions are substituted.</div>';return `<div class="resume beta"><span>${icon('globe')} ${t('beta.notice',{n:bank().length,total:D.questions.length})}</span>${btn(t('beta.switch'),'lang','secondary sm','data-lang="it" lang="it"')}</div>`;}
function heroArt(){return `<div class="hero-art" aria-hidden="true"><svg viewBox="0 0 330 230"><ellipse cx="170" cy="187" rx="115" ry="18" fill="#cfdbc4" opacity=".5" stroke="none"/><path d="M55 164C25 111 58 58 115 73s55 104 108 68 52-98 27-113" stroke="#90a781" stroke-dasharray="4 6" stroke-width="1.5"/><circle cx="53" cy="164" r="8" fill="#eaf0e2" stroke="#78916b"/><circle cx="250" cy="28" r="5" fill="#e8bb68" stroke="none"/><g transform="rotate(-9 170 110)"><rect x="92" y="44" width="143" height="153" rx="12" fill="#f9fbf4" stroke="#c3d0b6"/><rect x="106" y="31" width="143" height="153" rx="12" fill="#fffef7" stroke="#c3d0b6"/><rect x="122" y="52" width="46" height="7" rx="3" fill="#b3c1a5" stroke="none"/><text x="121" y="86" fill="#315b3f" font-size="15" font-weight="650">${t('hero.art')}</text><path d="M123 108h104 M123 132h104 M123 156h64" stroke="#e0e6d6"/><circle cx="129" cy="104" r="8" fill="#e6efdf" stroke="none"/><path d="m125 104 3 3 5-6" stroke="#50734b" stroke-width="1.5"/><circle cx="129" cy="128" r="8" fill="#e6efdf" stroke="none"/><path d="m125 128 3 3 5-6" stroke="#50734b" stroke-width="1.5"/></g><g transform="rotate(8 250 156)"><rect x="211" y="132" width="76" height="61" rx="13" fill="#2b634c" stroke="none"/><path d="m237 162 8 8 17-20" stroke="#fff9e3" stroke-width="3"/></g><path d="m69 43 3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#d3ad61" stroke="none"/></svg></div>`;}
function installPanel(){if(!P)return '';const last=P.lastExport();const status=P.standalone()?`<p><strong>${icon('check')} ${t('install.installed')}</strong> ${t('install.offline')}</p>`:P.canPrompt()?`<p>${t('install.prompt')}</p>${btn(icon('download')+' '+t('install.button'),'install')}`:P.ios?`<p>${t('install.iosIntro')}</p><ol class="install-steps"><li>${t('install.ios1')}</li><li>${t('install.ios2')}</li><li>${t('install.ios3')}</li></ol><p class="small">${t('install.iosWarning')}</p>`:`<p>${t('install.menu')}</p>`;return `<section class="panel"><h2>${t('install.title')}</h2>${status}<p class="small">${t('install.sync',{date:last?date(last):t('install.never')})}</p></section>`;}
function webNotice(){if(!P)return '';if(P.backupDue(state))return `<div class="resume"><span>${icon('download')} ${t('notice.backup')}</span>${pageBtn(t('notice.backupButton')+' '+icon('arrow'),'settings','secondary sm')}</div>`;if(!P.standalone()&&matchMedia('(pointer:coarse)').matches)return `<div class="resume"><span>${icon('spark')} ${t('notice.install')}</span>${pageBtn(t('notice.installButton')+' '+icon('arrow'),'settings','secondary sm')}</div>`;return '';}
function home(){if(track==='agile')return agileHome();const s=C.summarize(D.questions,state.stats);const next=LC(D.chapters.find(ch=>!state.lessons.includes(ch.id))||D.chapters[0]);return `${webNotice()}${betaNotice()}${header(state.name?t('home.welcomeBack',{name:esc(state.name)}):t('home.title'),t('home.subtitle'),`<span class="pill">${icon('book')} Foundation · CTFL 4.0.1</span>`)}<section class="hero"><div><div class="eyebrow">${icon('spark')} ${t('home.eyebrow')}</div><h2>${t('home.heroTitle')}</h2><p>${t('home.heroText')}</p><div class="actions">${btn((s.seen?t('home.continue'):t('home.start10'))+' '+icon('arrow'),'quick')}${pageBtn(t('home.explore'),'learn','ghost')}</div></div>${heroArt()}</section>${statsMarkup()}<div class="columns"><section><div class="section-title"><h2>${t('home.chaptersTitle')}</h2>${pageBtn(t('home.chaptersCount',{n:D.chapters.length})+' '+icon('arrow'),'learn','ghost')}</div><div class="chapter-list">${chapterRows()}</div></section><aside class="stack"><div class="panel dark"><div class="eyebrow">${t('home.examEyebrow')}</div><h2 style="margin-top:14px">${t('home.examTitle')}</h2><p>${t('home.examText')}</p><div class="exam-numbers"><div><strong>40</strong><small>${t('exam.questions')}</small></div><div><strong>60</strong><small>${t('home.standardMinutes')}</small></div><div><strong>65%</strong><small>${t('home.threshold')}</small></div></div>${pageBtn(t('home.prepareExam')+' '+icon('arrow'),'exam','')}</div><div class="panel"><div class="tip-line">${icon('bulb')}<div><h3>${t('home.nextTopic')}</h3><p>${esc(next.title)}. ${esc(next.intro)}</p>${btn(t('home.openChapter')+' '+icon('arrow'),'lesson','ghost',`data-id="${next.id}"`)}</div></div></div></aside></div>`;}
function learn(){return `${betaNotice()}${header(t('learn.title'),track==='agile'?tx('Tre capitoli dedicati esclusivamente ad Agile Tester.','Three chapters dedicated exclusively to Agile Tester.'):tx('Sei capitoli CTFL e una raccolta storica Foundation separata dalla simulazione.','Six CTFL chapters and a historical Foundation set outside the mock exam.'))}<div class="cards">${D.chapters.map(raw=>{const ch=LC(raw),n=bank().filter(q=>q.chapter===ch.id).length;return `<article class="lesson-card"><div class="chapter-icon" style="--chapter:${ch.color}">${icon(ch.icon)}</div><div class="eyebrow muted">${t('learn.chapter')} ${String(track==='agile'?ch.id-6:ch.id).padStart(2,'0')} ${state.lessons.includes(ch.id)?'· '+t('learn.read'):''}</div><h2 style="margin-top:10px">${ch.title}</h2><p>${ch.intro}</p><div class="meta">${t('learn.count',{n})} · ${ch.weight?t('learn.inExam',{n:ch.weight}):t('learn.practiceOnly')}</div><div class="actions">${btn(t('learn.readChapter')+' '+icon('arrow'),'lesson','secondary',`data-id="${ch.id}"`)}${btn(t('learn.practice'),'chapter-practice','ghost',`data-id="${ch.id}"`+(n?'':' disabled'))}</div></article>`;}).join('')}</div><section class="section-gap" ${track==='agile'?'hidden':''}><h2>${t('learn.planTitle')}</h2><p class="muted small">${t('learn.planText')}</p><div class="days">${Array.from({length:14},(_,i)=>`<label class="day"><input type="checkbox" data-day="${i+1}" ${state.days.includes(i+1)?'checked':''}><div><strong>${t('learn.day')} ${String(i+1).padStart(2,'0')}</strong><span>${t('day.'+(i+1))}</span></div></label>`).join('')}</div></section>`;}
// Chapter bodies stay Italian in English mode until an overlay provides sections, trap and example.
function lesson(id){const raw=D.chapters.find(ch=>ch.id===id);if(!raw)return courses();const ch=LC(raw),body=english()&&EN.chapters[id]?.sections?ch:raw,bodyIt=english()&&body===raw;return `<div class="reading">${pageBtn(icon('back')+' '+t('lesson.all'),'learn','ghost')}<div class="eyebrow muted" style="margin:20px 0 12px">${t('learn.chapter')} ${track==='agile'?ch.id-6:ch.id} · ${ch.id===10?t('lesson.kindIta'):ch.id>6?t('lesson.kindAgile'):t('lesson.kindCtfl')}</div>${header(ch.title,ch.intro)}${bodyIt?`<div class="callout">${t('lesson.italianOnly')}</div>`:''}<div${bodyIt?' lang="it"':''}>${body.sections.map(([title,text])=>`<section class="panel"><h2>${title}</h2><p>${text}</p></section>`).join('')}<div class="callout"><strong>${t('lesson.trap')}</strong><br>${body.trap}</div><div class="panel"><h3>${t('lesson.practice')}</h3><p>${body.example}</p></div></div><div class="actions">${btn(state.lessons.includes(id)?icon('check')+' '+t('lesson.done'):t('lesson.markRead'),'read-lesson','secondary',`data-id="${id}"`)}${btn(t('lesson.practiceChapter')+' '+icon('arrow'),'chapter-practice','',`data-id="${id}"`+(bank().some(q=>q.chapter===id)?'':' disabled'))}</div><p class="small muted" style="margin-top:24px">${t('lesson.summaryNote')} <a href="${ch.id>6&&ch.id<10?'https://istqb.org/wp-content/uploads/2024/11/ISTQB-CTFL-AT_Syllabus_v1.0.pdf':D.syllabusUrl}" target="_blank" rel="noopener">${t('lesson.officialSyllabus')}</a>${id===10?t('lesson.itaNote'):t('lesson.chapterRef',{n:id>6?id-6:id})}</p></div>`;}
function practice(){const due=C.due(bank(),state),wrong=bank().filter(q=>state.stats[q.id]&&!state.stats[q.id].lastCorrect);return `${betaNotice()}${header(t('practice.title'),t('practice.subtitle'))}<div class="mode-grid"><section class="panel"><div class="chapter-icon" style="--chapter:#317866">${icon('target')}</div><h2 style="margin-top:20px">${t('practice.heading')}</h2><p>${t('practice.text')}</p><div class="form-row"><label class="field">${t('practice.topic')}<select id="practice-chapter"><option value="0">${t('practice.allChapters')}</option>${D.chapters.filter(ch=>bank().some(q=>q.chapter===ch.id)).map(ch=>`<option value="${ch.id}">${track==='agile'?ch.id-6:ch.id}. ${LC(ch).short}</option>`).join('')}</select></label><label class="field">${t('practice.length')}<select id="practice-count"><option value="10">${t('practice.n',{n:10})}</option><option value="5">${t('practice.n',{n:5})}</option><option value="20">${t('practice.n',{n:20})}</option></select></label></div>${btn(t('practice.start')+' '+icon('arrow'),'start-practice')}<p class="small" style="margin-top:15px">${t('practice.fewer')}</p></section><div class="stack"><section class="panel"><div class="eyebrow muted">${t('practice.reviewEyebrow')}</div><div class="big-number">${due.length}</div><h3>${t('practice.dueToday')}</h3><p>${t('practice.wrongCount',{n:wrong.length})}</p>${btn(t('practice.startReview')+' '+icon('cycle'),'start-review','secondary',due.length?'':'disabled')}</section><section class="panel"><h3>${icon('bookmark')} ${t('practice.saved')}</h3><p>${t('practice.savedCount',{n:D.questions.filter(q=>state.bookmarks.includes(q.id)).length})}</p>${btn(t('practice.trainSaved'),'start-bookmarks','secondary',bank().some(q=>state.bookmarks.includes(q.id))?'':'disabled')}</section></div></div><div class="callout">${t('practice.confidenceTip')}</div>`;}
function examPage(){if(track==='agile')return agileExam();const off=!examAvailable();return `${betaNotice()}${header(t('exam.title'),t('exam.subtitle'))}<div class="mode-grid"><section class="panel"><div class="eyebrow muted">${t('exam.eyebrow')}</div><h2 style="margin-top:16px;font-size:28px">${t('exam.heading')}</h2><div class="exam-numbers"><div><strong>40</strong><small class="muted">${t('exam.questions')}</small></div><div><strong>26</strong><small class="muted">${t('exam.toPass')}</small></div><div><strong>1</strong><small class="muted">${t('exam.point')}</small></div></div><p>${t('exam.rules')}</p><label class="field" style="max-width:340px">${t('exam.duration')}<select id="exam-minutes" ${off?'disabled':''}><option value="60" ${state.examMinutes===60?'selected':''}>${t('exam.standard')}</option><option value="75" ${state.examMinutes===75?'selected':''}>${t('exam.extended')}</option></select></label><p class="small">${t('exam.extensionNote')}</p>${off?`<div class="callout">${t('exam.betaOff')}</div>${btn(t('beta.switch'),'lang','','data-lang="it" lang="it"')}`:btn(t('exam.start')+' '+icon('arrow'),'start-exam')}<div class="callout">${t('exam.timerNote')}</div></section><section class="panel"><h3>${t('exam.composition')}</h3><table><thead><tr><th>${t('exam.chapter')}</th><th>${t('exam.questionsCol')}</th></tr></thead><tbody>${D.chapters.filter(ch=>ch.weight).map(ch=>`<tr><td>${LC(ch).short}</td><td>${ch.weight}</td></tr>`).join('')}</tbody></table><p class="small" style="margin-top:20px">${t('exam.compositionNote')}</p><a class="small" href="${D.rulesUrl}" target="_blank" rel="noopener">${t('exam.officialStructure')} ↗</a></section></div>`;}
function start(mode,questions){if(state.active&&T.session(state.active)!==track){toast(tx('Concludi prima la sessione precedente tramite Riprendi.','Finish the previous session using Resume first.'));return;}if(questions.some(q=>T.course(q)!==track))return;if(!questions.length){toast(t('toast.noQuestions'));return;}const run=()=>{const now=Date.now();state.active={id:'s'+now+'-'+Math.random().toString(36).slice(2,8),mode,ids:questions.map(q=>q.id),answers:{},flags:[],index:0,startedAt:now,deadline:mode==='exam'?now+state.examMinutes*60000:null};save();nav('quiz');};if(state.active)ask(t('confirm.replaceTitle'),t('confirm.replaceText'),t('confirm.replaceButton'),run);else run();}
function bookmark(id){if(state.bookmarks.includes(id))state.bookmarks=state.bookmarks.filter(x=>x!==id);else state.bookmarks.push(id);save();render(false);}
function quiz(){const s=state.active;if(!s)return `<div class="empty">${icon('target')}<h2>${t('quiz.none')}</h2>${pageBtn(t('quiz.choose'),'practice','')}</div>`;const q=L(byId(s.ids[s.index])),a=s.answers[q.id],isExam=s.mode==='exam',locked=!!a&&!isExam,choice=isExam?(a?.choice??null):(locked?a.choice:selected);const ch=LC(ALL.chapters.find(ch=>ch.id===q.chapter)),saved=state.bookmarks.includes(q.id),it=langAttr(q);return `<div class="quiz-shell"><div class="quiz-header"><div><span class="eyebrow muted">${modeLabel(s.mode)}</span><div class="small muted">${t('quiz.position',{n:s.index+1,total:s.ids.length})}</div></div>${isExam?`<div class="timer" id="timer" role="timer" aria-label="${t('quiz.timeLeft')}">${remaining(s)}</div>`:pageBtn(t('quiz.saveLater'),'practice','ghost')}</div><div class="progress-track"><div style="width:${Object.keys(s.answers).length/s.ids.length*100}%"></div></div><section class="quiz-card"><div class="question-meta"><div><span class="tag">${ch.short}</span> <span class="small muted">${q.lo} · K${q.k}</span>${it?` <span class="tag">${t('quiz.italianOnly')}</span>`:''}</div><button class="book-btn ${saved?'saved':''}" data-action="bookmark" data-id="${q.id}" aria-label="${saved?t('quiz.unsave'):t('quiz.save')}" aria-pressed="${saved}">${icon('bookmark')}</button></div><h1 class="question-title" tabindex="-1"${it}>${esc(q.prompt)}</h1><div class="options" role="group" aria-label="${t('quiz.chooseAnswer')}">${q.options.map((text,i)=>`<button class="option ${choice===i?'selected':''} ${locked&&i===q.answer?'correct':''} ${locked&&a.choice===i&&i!==q.answer?'wrong':''}" data-action="choose" data-choice="${i}" aria-pressed="${choice===i}" ${locked?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${mark(it,esc(text))} ${locked&&i===q.answer?`<strong> · ${t('quiz.correctAnswer')}</strong>`:''}</span></button>`).join('')}</div>${locked?`<div class="feedback ${a.choice===q.answer?'':'incorrect'}" role="status"><strong>${a.choice===q.answer?t('quiz.right'):t('quiz.wrong')}</strong>${explanation(q)}<span class="small">${t('quiz.reference')}: ${q.lo} · <a href="${q.syllabusUrl||D.syllabusUrl}" target="_blank" rel="noopener">${t('quiz.syllabus')} ↗</a></span></div>`:''}<div class="quiz-bottom">${!isExam&&!locked?`<fieldset class="confidence"><legend>${t('quiz.confidence')}</legend>${['low','medium','high'].map(value=>`<label><input type="radio" name="confidence" value="${value}" ${confidence===value?'checked':''}>${t('confidence.'+value)}</label>`).join('')}</fieldset>`:isExam?`<button class="book-btn ${s.flags.includes(q.id)?'saved':''}" data-action="flag" aria-pressed="${s.flags.includes(q.id)}">${icon('flag')} ${s.flags.includes(q.id)?t('quiz.flagged'):t('quiz.flag')}</button>`:`<span class="small muted">${t('quiz.whyMatters')}</span>`}${!isExam&&!locked?btn(t('quiz.check')+' '+icon('check'),'check','',selected===null?'disabled':''):btn((s.index===s.ids.length-1?t('quiz.summary'):t('quiz.next'))+' '+icon('arrow'),s.index===s.ids.length-1?'finish':'next')}</div></section>${isExam?`<div class="qmap" aria-label="${t('quiz.map')}">${s.ids.map((id,i)=>`<button data-action="jump" data-index="${i}" class="${s.answers[id]?'answered':''} ${i===s.index?'current':''} ${s.flags.includes(id)?'flagged':''}" aria-label="${t('quiz.mapItem',{n:i+1})}${s.answers[id]?t('quiz.mapAnswered'):''}${s.flags.includes(id)?t('quiz.mapFlagged'):''}" ${i===s.index?'aria-current="step"':''}>${i+1}</button>`).join('')}</div><div class="quiz-bottom"><span class="small muted">${t('quiz.examStatus',{answered:Object.keys(s.answers).length,flagged:s.flags.length})}</span>${btn(t('quiz.submitExam'),'finish','secondary')}</div>`:`<div class="quiz-bottom">${btn(icon('back')+' '+t('quiz.previous'),'previous','ghost',s.index===0?'disabled':'')}<span class="small muted">${t('quiz.savedAfterCheck')}</span>${btn(tx('Concludi allenamento','Finish practice'),'finish','secondary')}</div>`}</div>`;}
function explanation(q){const it=langAttr(q);return `<p${it}>${esc(q.explanation)}</p>`+(q.reasons?`<details open><summary>${t('explain.reasons')}</summary>`+q.reasons.map((reason,i)=>`<p><strong>${String.fromCharCode(65+i)}. ${i===q.answer?t('explain.correct'):t('explain.incorrect')}</strong> — ${mark(it,esc(reason))}</p>`).join('')+`</details><p class="small muted">${t('explain.source')}: ${mark(english()?' lang="it"':'',esc(q.source)+'.'+(q.sourceNote?' '+esc(q.sourceNote):' Graner = PDF Katie Graner; Mappa = mappa concettuale fornita. Pagine PDF, non numerazione stampata.'))}</p>`:'')+btn(t('explain.deeper'),'lesson','ghost','data-id="'+(q.topicChapter||q.chapter)+'"');}
function remaining(s){const seconds=Math.max(0,Math.ceil((s.deadline-Date.now())/1000));return String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');}
function finish(force=false){const s=state.active;if(!s)return;const complete=()=>{if(!state.active||state.active.id!==s.id)return;document.querySelectorAll('dialog').forEach(d=>d.close());const result=C.complete(state,ALL.questions);resultId=result.id;save();nav('result');};const missing=s.ids.length-Object.keys(s.answers).length;if(!force)ask(t('confirm.submitTitle'),missing?t('confirm.submitMissing',{n:missing}):t('confirm.submitAll'),t('confirm.submitButton'),complete);else complete();}
function resultPage(){const r=state.history.find(x=>x.id===resultId)||history()[0];if(!r)return progress();const percent=Math.round(r.score/r.ids.length*100),passed=r.mode==='exam'&&r.score>=26;const chapterStats=ALL.chapters.map(ch=>{const ids=r.ids.filter(id=>byId(id).chapter===ch.id);return {ch:LC(ch),n:ids.length,correct:ids.filter(id=>r.answers[id]?.choice===byId(id).answer).length};}).filter(x=>x.n);const weakest=[...chapterStats].sort((a,b)=>a.correct/a.n-b.correct/b.n)[0];return `${T.session(r)==='legacy'?'<div class="callout">'+tx('Archivio storico: sessione mista Foundation / Agile.','Historical archive: mixed Foundation / Agile session.')+'</div>':''}<div class="result-hero"><div class="eyebrow muted">${modeLabel(r.mode)} · ${date(r.finishedAt)}</div><h1>${r.score}<span style="font-size:24px;color:var(--muted)"> / ${r.ids.length}</span></h1><h2>${r.mode==='exam'?(passed?t('result.passed'):t('result.map')):t('result.step')}</h2><p>${t('result.percent',{n:percent})} ${r.mode==='exam'?t('result.examNote'):t('result.practiceNote')}</p><div class="actions">${pageBtn(t('result.backToPractice'),'practice','')}${btn(t('result.review',{chapter:weakest.ch.short}),'lesson','secondary',`data-id="${weakest.ch.id}"`)}</div></div><div class="panel"><h3>${t('result.byChapter')}</h3>${chapterStats.map(x=>`<div class="history-row"><span>${x.ch.title}</span><strong>${x.correct}/${x.n}</strong></div>`).join('')}</div><div class="section-title section-gap"><h2>${t('result.reviewTitle')}</h2><span class="small muted">${t('result.reviewHint')}</span></div>${r.ids.map((id,i)=>{const q=L(byId(id)),a=r.answers[id],ok=a?.choice===q.answer,it=langAttr(q);return `<details class="review-item"><summary><span class="${ok?'status-ok':'status-bad'}">${ok?'✓':'○'}</span> ${i+1}. ${mark(it,esc(q.prompt))}</summary><div class="answer-line">${t('result.yourAnswer')}: <strong${a?it:''}>${a?esc(q.options[a.choice]):t('result.noAnswer')}</strong></div><div class="answer-line status-ok">${t('result.correctAnswer')}: <strong${it}>${esc(q.options[q.answer])}</strong></div>${explanation(q)}<div class="actions"><span class="tag">${q.lo} · K${q.k}</span>${btn(state.bookmarks.includes(id)?t('result.unsave'):t('result.save'),'bookmark','ghost',`data-id="${id}"`)}</div></details>`;}).join('')}`;}
function progress(){const s=C.summarize(D.questions,state.stats),exams=history().filter(r=>r.mode==='exam');return `${header(t('progress.title'),t('progress.subtitle'))}${legacyHistory()} ${statsMarkup()}<div class="columns"><section><div class="section-title"><h2>${t('progress.chapters')}</h2></div><div class="chapter-list">${chapterRows()}</div><div class="callout"><strong>${t('progress.solid',{n:s.solid})}</strong><br>${t('progress.solidNote')}</div></section><section class="panel"><h2>${t('progress.sessions')}</h2><p>${t('progress.sessionsCount',{n:history().length,exams:exams.length})}</p>${history().length?history().slice(0,20).map(r=>`<div class="history-row"><div>${modeLabel(r.mode)}<small>${date(r.finishedAt)}</small></div><strong>${r.score}/${r.ids.length}</strong>${btn(t('progress.review'),'history','secondary sm',`data-id="${r.id}"`)}</div>`).join(''):`<div class="empty">${icon('chart')}<h3>${t('progress.emptyTitle')}</h3><p>${t('progress.emptyText')}</p>${pageBtn(t('progress.start'),'practice','')}</div>`}</section></div>`;}
const glossaryRows=()=>track==='agile'?D.glossary:english()&&EN.glossary.length?EN.glossary:D.glossary;
function glossary(){return `${header(t('glossary.title'),t('glossary.subtitle'))}<label class="sr-only" for="glossary-query">${t('glossary.search')}</label><input class="glossary-search" id="glossary-query" type="search" placeholder="${t('glossary.placeholder')}"><div class="small muted search-count" id="search-count">${t('glossary.count',{n:glossaryRows().length})}</div><div class="glossary-grid" id="glossary-results">${glossaryItems('')}</div><p class="small muted section-gap">${t('glossary.note')} <a href="https://glossary.istqb.org/" target="_blank" rel="noopener">${t('glossary.official')} ↗</a>.</p>`;}
function glossaryMatches(query){const q=query.toLocaleLowerCase(I.locale);return glossaryRows().filter(([term,desc])=>(term+' '+desc).toLocaleLowerCase(I.locale).includes(q));}
function glossaryItems(query){const items=glossaryMatches(query);return items.length?items.map(([term,desc])=>`<article class="glossary-item"><h3>${esc(term)}</h3><p>${esc(desc)}</p></article>`).join(''):`<p class="muted">${t('glossary.none')}</p>`;}
function languagePanel(){return `<section class="panel"><h2>${t('language.title')}</h2><p>${t('language.text')}</p><div class="actions" role="group" aria-label="${t('language.title')}">${I.langs.map(l=>btn(t('language.'+l),'lang',I.lang===l?'':'secondary',`data-lang="${l}" lang="${l}" aria-pressed="${I.lang===l}"`)).join('')}</div><p class="small" style="margin-top:16px">${t('language.beta',{n:Object.keys(EN.questions).length,total:ALL.questions.length})}</p></section>`;}
function settings(){return `${header(t('settings.title'),t('settings.subtitle'))}<div class="settings-grid">${languagePanel()}<section class="panel"><h2>${t('settings.profile')}</h2><p>${t('settings.profileText')}</p><form id="profile-form"><label class="field">${t('settings.nameLabel')}<input id="profile-name" maxlength="60" value="${esc(state.name)}" placeholder="${t('settings.namePlaceholder')}" autocomplete="given-name"></label><button class="btn" style="margin-top:16px" type="submit">${t('settings.saveName')}</button></form></section><section class="panel"><h2>${t('settings.backup')}</h2><p>${t('settings.backupText')}</p><div class="actions">${btn(icon('download')+' '+t('settings.export'),'export','secondary')}${btn(t('settings.import'),'import','secondary')}</div><input id="import-file" type="file" accept=".json,application/json" hidden><p class="small" style="margin-top:16px">${t('settings.importNote')}</p>${loadIssue==='load'?btn(t('settings.recovery'),'recovery','secondary'):''}</section>${installPanel()}<section class="panel"><h2>${t('settings.about')}</h2><p>${t('settings.aboutText',{version:D.version,n:ALL.questions.length,terms:ALL.glossary.length})}</p><p>${t('settings.disclaimer')}</p><p><a href="${D.source}" target="_blank" rel="noopener">${t('settings.linkCert')} ↗</a><br><a href="${D.syllabusUrl}" target="_blank" rel="noopener">${t('settings.linkSyllabus')} ↗</a><br><a href="${D.rulesUrl}" target="_blank" rel="noopener">${t('settings.linkRules')} ↗</a></p><p class="small">${t('settings.copyright')}</p></section><section class="panel"><h2>${t('settings.reviewTitle')}</h2><p>${t('settings.reviewText')}</p><p>${t('settings.reviewText2')}</p><div class="actions">${pageBtn(t('settings.openGlossary'),'glossary','secondary')}${btn(t('settings.reset'),'reset','danger')}</div></section></div>`;}
function download(text,filename,type='application/json'){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);}
function render(focus=true){
 const page=location.hash.slice(1)||'courses',section=page.startsWith('lesson/')?'learn':page==='quiz'?(state.active?.mode==='exam'?'exam':'practice'):page==='result'?'progress':page;
 const label=page==='courses'?tx('Scelta del percorso','Choose track'):menus.some(m=>m[0]===section)?t('nav.'+section):t('nav.settings');
 const content=page.startsWith('lesson/')?lesson(Number(page.split('/')[1])):({courses,home,learn,practice,exam:examPage,quiz,result:resultPage,progress,glossary,settings}[page]||home)();
 const other=I.lang==='it'?'en':'it',issue=issueText();
 document.title='TestPilot · '+(track==='agile'?'Agile Tester':'Foundation CTFL');document.querySelector('.skip').textContent=t('meta.skip');
 document.getElementById('app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><span class="brand-mark">${icon('check')}</span><span class="brand-word">testpilot<small>LEARN. TEST. GROW.</small></span></div><div><div class="nav-label">${t('nav.workspace')}</div><nav class="nav" aria-label="${t('nav.main')}">${menus.map(([id,ic])=>`<button data-page="${id}" class="${section===id?'active':''}" ${section===id?'aria-current="page"':''} title="${t('nav.'+id)}">${icon(ic)}<span>${t('nav.'+id)}</span>${id==='learn'?'<span class="count">'+D.chapters.length+'</span>':''}</button>`).join('')}<button data-page="settings" class="mobile-settings ${section==='settings'?'active':''}" title="${t('nav.settings')}">${icon('settings')}<span>${t('nav.settings')}</span></button></nav></div><div class="side-bottom"><div class="side-tip"><span class="eyebrow" style="font-size:9px">${t('side.eyebrow')}</span><p>${t('side.tip')}</p></div><div class="profile"><div class="avatar">${esc(state.name?state.name[0].toUpperCase():'T')}</div><div>${esc(state.name||t('side.profile'))}<small>${t('side.onDevice')}</small></div></div></div></aside><div class="workspace"><header class="topbar"><div class="crumb">${icon('home')} <span>${t('nav.crumb')}</span><span>/</span><strong>${label}</strong></div><div class="mobile-brand">${icon('check')} testpilot</div><div class="topbar-tools"><div class="pill"><span class="dot"></span> ${t('topbar.pill')}</div><button class="lang-switch" data-action="lang" data-lang="${other}" lang="${other}" aria-label="${t('language.switchTo.'+other)}" title="${t('language.switchTo.'+other)}">${icon('globe')}<span>${other.toUpperCase()}</span></button></div></header><main class="main" id="main" tabindex="-1">${issue?`<div class="warning" role="alert">${esc(issue)}</div>`:''}${state.active&&page!=='quiz'?`<div class="resume"><span>${icon('clock')} ${state.active.mode==='exam'?t('resume.exam'):t('resume.practice')} · ${t('resume.answers',{n:Object.keys(state.active.answers).length,total:state.active.ids.length})}</span>${pageBtn(t('resume.button')+' '+icon('arrow'),'quiz','secondary sm')}</div>`:''}${trackBar(page)}${content}<footer class="footer"><span>TestPilot · ${track==='agile'?'Agile Tester':'Foundation CTFL'}</span><button data-page="settings">${t('footer.link')} ↗</button></footer></main></div></div>`;
 if(P)P.setBusy(page==='quiz'&&state.active?.mode==='exam');
 if(focus){window.scrollTo(0,0);document.getElementById('main').focus({preventScroll:true});}tick();
}
function tick(){const s=state.active;if(s?.mode==='exam'){if(C.expired(s)){finish(true);toast(t('toast.timeUp'));return;}const el=document.getElementById('timer');if(el){el.textContent=remaining(s);el.classList.toggle('urgent',s.deadline-Date.now()<300000);}}}
document.querySelector('.skip').addEventListener('click',e=>{e.preventDefault();document.getElementById('main').focus();});
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el||el.disabled)return;if(el.dataset.page){nav(el.dataset.page);return;}const action=el.dataset.action,id=el.dataset.id,s=state.active;switch(action){
 case'track':if(state.active&&el.dataset.track!==track){toast(tx('Concludi la sessione in corso prima di cambiare percorso. I tuoi dati restano salvati.','Finish your current session before changing tracks. Your data remains saved.'));return;}track=el.dataset.track;D=T.view(track);try{localStorage.setItem('testpilot.track',track);}catch(e){}resultId=null;nav('home');break;
 case'navigate':nav(el.dataset.destination);break;
 case'lesson':nav('lesson/'+id);break;
 case'lang':I.setLang(el.dataset.lang);selected=null;render(false);toast(t('toast.language'));break;
 case'read-lesson':if(!state.lessons.includes(+id))state.lessons.push(+id);save();render(false);toast(t('toast.chapterRead'));break;
 case'quick':start('practice',C.adaptive(bank(),state.stats));break;
 case'chapter-practice':start('practice',C.adaptive(bank(),state.stats,10,+id));break;
 case'start-practice':start('practice',C.adaptive(bank(),state.stats,+document.getElementById('practice-count').value,+document.getElementById('practice-chapter').value));break;
 case'start-review':start('review',C.adaptive(C.due(bank(),state),state.stats,20));break;
 case'start-bookmarks':start('practice',C.shuffle(bank().filter(q=>state.bookmarks.includes(q.id))).slice(0,20));break;
 case'start-exam':if(!examAvailable())return;state.examMinutes=+document.getElementById('exam-minutes').value;save();start('exam',C.exam(bank()));break;
 case'choose':if(!s)return;if(s.mode==='exam'&&Date.now()>=s.deadline){tick();return;}selected=+el.dataset.choice;if(s.mode==='exam'){s.answers[s.ids[s.index]]={choice:selected,confidence:'medium'};save();}render(false);break;
 case'check':if(!s||selected===null||s.answers[s.ids[s.index]])return;{const q=byId(s.ids[s.index]);s.answers[q.id]={choice:selected,confidence};C.record(state,q,selected,confidence);save();render(false);}break;
 case'next':case'previous':case'jump':if(!s)return;s.index=action==='jump'?+el.dataset.index:Math.max(0,Math.min(s.ids.length-1,s.index+(action==='next'?1:-1)));selected=null;confidence='medium';save();render();break;
 case'flag':if(!s)return;{const qid=s.ids[s.index];s.flags=s.flags.includes(qid)?s.flags.filter(x=>x!==qid):[...s.flags,qid];save();render(false);}break;
 case'bookmark':bookmark(id);break;
 case'finish':finish();break;
 case'history':resultId=id;nav('result');break;
 case'install':P&&P.install();break;
 case'export':P&&P.markExport();download(JSON.stringify(state,null,2),'TestPilot-'+t('file.progress')+'-'+new Date().toISOString().slice(0,10)+'.json');toast(t('toast.exported'));break;
 case'import':document.getElementById('import-file').click();break;
 case'recovery':try{download(localStorage.getItem(KEY)||'','TestPilot-'+t('file.recovery')+'.txt','text/plain');}catch(err){toast(t('toast.recoveryUnavailable'));}break;
 case'reset':ask(t('confirm.resetTitle'),t('confirm.resetText'),t('confirm.resetButton'),()=>{state=C.fresh();loadIssue='';save();nav('home');toast(t('toast.reset'));});break;
 }});
document.addEventListener('change',async e=>{const el=e.target;if(el.name==='confidence')confidence=el.value;if(el.dataset.day){const n=+el.dataset.day;state.days=el.checked?[...new Set([...state.days,n])]:state.days.filter(x=>x!==n);save();}if(el.id==='import-file'&&el.files[0]){const file=el.files[0];try{if(file.size>2*1024*1024)throw Object.assign(Error('too-large'),{code:'too-large'});const incoming=C.validateState(JSON.parse(await file.text()),ALL.questions);ask(t('confirm.importTitle'),t('confirm.importText',{name:incoming.name||t('confirm.importNoName'),sessions:incoming.history.length,questions:Object.keys(incoming.stats).length}),t('confirm.importButton'),()=>{state=incoming;loadIssue='';save();nav('home');toast(t('toast.imported'));});}catch(err){toast(err instanceof SyntaxError?t('import.notJson'):err.code==='too-large'?t('import.tooLarge'):t('import.invalid'));}el.value='';}});
document.addEventListener('input',e=>{if(e.target.id==='glossary-query'){const value=e.target.value;document.getElementById('glossary-results').innerHTML=glossaryItems(value);document.getElementById('search-count').textContent=t('glossary.count',{n:glossaryMatches(value).length});}});
document.addEventListener('submit',e=>{if(e.target.id==='profile-form'){e.preventDefault();state.name=document.getElementById('profile-name').value.trim().slice(0,60);save();render(false);toast(t('toast.nameSaved'));}});
window.addEventListener('hashchange',()=>render());window.addEventListener('pageshow',tick);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});
// Avoid silently merging divergent sessions opened in different tabs; follow language changes made in another tab.
window.addEventListener('storage',e=>{if(e.key===KEY){loadIssue='tab';render(false);}else if(e.key==='testpilot.lang'&&I.langs.includes(e.newValue)){I.setLang(e.newValue);render(false);}});
if(P)P.onChange(()=>{if(['home','settings'].includes(location.hash.slice(1)||'home'))render(false);});
render();if(!loadIssue)save();setInterval(tick,1000);
})();
</script></body>
</html>
