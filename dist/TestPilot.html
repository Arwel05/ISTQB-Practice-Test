<body><a class="skip" href="#main">Vai al contenuto</a><div id="app"></div><div id="toast" role="status" aria-live="polite"></div><script>/* Original practice material. References identify learning objectives, not official questions. */
(function (root) {
const chapters = [
 {id:1,title:'Fondamenti del testing',short:'Fondamenti',icon:'layers',weight:8,color:'#317866',intro:'Impara a ragionare da tester, prima di scegliere una tecnica.',sections:[
 ['Il test come informazione','Un team sta per rilasciare un’app di prenotazioni. Il tuo lavoro è fornire evidenze: quali comportamenti hai verificato, quali rischi restano e cosa non hai potuto controllare. Un test verde è un’informazione su ciò che hai provato, non una garanzia universale.'],
 ['Errore → difetto → malfunzionamento','Una sviluppatrice interpreta male la tariffa (errore), scrive una formula sbagliata (difetto), e un cliente riceve un totale errato (malfunzionamento, o failure). Il difetto può rimanere nascosto finché non si verificano le condizioni che lo attivano. Il debugging cerca la causa e corregge il codice; il testing valuta e rende visibili problemi.'],
 ['Sette idee da usare sul campo','I test rivelano difetti, ma non ne provano l’assenza. Provare tutto è generalmente impraticabile. Anticipare il testing riduce rilavorazioni. I difetti tendono a concentrarsi. Test sempre uguali perdono efficacia nel trovare nuovi problemi. Il contesto guida le scelte. Un sistema senza difetti rilevati può comunque non servire agli utenti.'],
 ['Dal requisito all’evidenza','Pianifica obiettivi e risorse; analizza cosa verificare; progetta come verificarlo; prepara dati, procedure e ambiente; esegui e confronta risultati; comunica e archivia. Monitoraggio e controllo accompagnano il lavoro. La tracciabilità collega requisiti, test, risultati e difetti.'],
 ['Lavorare insieme','Qualità e responsabilità sono condivise. Un punto di vista indipendente può intercettare assunzioni comuni, ma isolamento e comunicazione ostile peggiorano il lavoro. Descrivi fatti riproducibili, ascolta e distingui il prodotto dalla persona che lo ha realizzato.'] ],trap:'“Tutti i test sono passati” non significa “non ci sono difetti”.',example:'Un checkout esegue tutti i requisiti documentati, ma richiede 18 passaggi e gli utenti lo abbandonano: il problema è il valore per l’utente, non il numero di test verdi.'},
 {id:2,title:'Testing nel ciclo di sviluppo',short:'Ciclo di sviluppo',icon:'cycle',weight:6,color:'#5377a1',intro:'Scegli il test giusto nel momento giusto.',sections:[
 ['Partire presto','Prima del codice puoi discutere esempi, rivedere requisiti e preparare test. In un lavoro iterativo queste attività si ripetono a ogni incremento. Shift left significa anticipare opportunamente il testing: i controlli sul sistema integrato restano necessari.'],
 ['Livelli e tipi','Un componente si prova isolatamente. L’integrazione di componenti verifica le loro interfacce. Il testing di sistema valuta il sistema completo. L’integrazione di sistemi guarda i collegamenti con altri sistemi. L’accettazione verifica esigenze di business e disponibilità all’uso. Funzionale e non funzionale sono tipi di test, non livelli.'],
 ['Una correzione, due domande','Dopo una correzione, il confirmation testing chiede se il problema originario è risolto. La regressione cerca effetti collaterali altrove, usando l’analisi d’impatto per decidere cosa riprovare. Anche una migrazione o un aggiornamento dell’ambiente può richiedere testing di manutenzione.'],
 ['Sviluppo guidato dai test','TDD parte da piccoli test sul codice. ATDD concorda test di accettazione con il business prima dell’implementazione. BDD descrive comportamenti con esempi comprensibili. In DevOps, feedback rapidi e pipeline aiutano, ma non eliminano valutazioni umane e manutenzione dei test.'],
 ['Imparare dal processo','In retrospettiva il team esamina cosa ha funzionato, sceglie miglioramenti verificabili e ne segue gli effetti. Un’azione concreta ha un responsabile e un modo di capire se ha aiutato.'] ],trap:'Confirmation e regression testing rispondono a domande diverse.',example:'Correggi lo sconto fedeltà: riprova il caso che falliva, poi verifica IVA e rimborsi che usano lo stesso calcolo.'},
 {id:3,title:'Testing statico',short:'Testing statico',icon:'scan',weight:4,color:'#ad7851',intro:'Trova problemi prima ancora di eseguire il software.',sections:[
 ['Leggere è già testare','Una review di una user story può trovare un requisito contraddittorio. Un analizzatore statico può segnalare codice irraggiungibile. Nessuno dei due richiede l’esecuzione del programma sotto test. Una prova dinamica osserva invece il comportamento in esecuzione.'],
 ['Una review che funziona','Definisci scopo, oggetto e criteri. Distribuisci il materiale e permetti una lettura individuale. Discuti e analizza le anomalie, concorda le azioni e verifica le correzioni. Anomalia non significa automaticamente difetto: può servire chiarire il contesto.'],
 ['Persone e responsabilità','L’autore prepara e corregge il prodotto. I revisori lo esaminano. Il moderatore facilita la collaborazione. Lo scriba registra anomalie e decisioni. Il responsabile della review organizza il lavoro; il management mette a disposizione risorse. Una persona può assumere più ruoli se appropriato.'],
 ['Quanto formalizzare','Una review informale richiede poca struttura. Un walkthrough è generalmente guidato dall’autore. Una review tecnica cerca consenso e decisioni tecniche. Un’ispezione usa un processo più formale con ruoli, criteri e misure. La scelta dipende da rischio, obiettivo e contesto.'] ],trap:'Il testing statico trova direttamente difetti nei prodotti di lavoro; non osserva failure in esecuzione.',example:'“La risposta deve essere rapida” non dà una soglia verificabile. Una review può far emergere questa ambiguità prima di sviluppare.'},
 {id:4,title:'Analisi e progettazione dei test',short:'Tecniche di test',icon:'grid',weight:11,color:'#8b6ca6',intro:'Trasforma regole e scenari in casi di test motivati.',sections:[
 ['Partizioni di equivalenza','Per un campo età che accetta interi da 18 a 65, considera tre classi: sotto 18, da 18 a 65, sopra 65. Un rappresentante per classe offre copertura delle partizioni, non di ogni valore possibile. Le classi invalide contano.'],
 ['Valori limite','Sullo stesso intervallo, la BVA a 2 valori usa 17, 18, 65, 66. La BVA a 3 valori aggiunge 19 e 64. Scrivi sempre dominio, inclusività e tecnica richiesta: sui reali non esiste automaticamente “l’intero precedente”.'],
 ['Regole e stati','Una tabella decisionale combina condizioni e azioni. Due condizioni booleane indipendenti producono fino a quattro regole: elimina solo combinazioni impossibili o accorpa quelle equivalenti in modo motivato. Nei modelli a stati conta anche la storia: visitare tutti gli stati non garantisce di percorrere tutte le transizioni.'],
 ['Guardare il codice','La copertura delle istruzioni confronta istruzioni eseguite ed eseguibili. La copertura dei rami guarda i trasferimenti di controllo. Coprire tutti i rami implica coprire le istruzioni raggiungibili, ma non tutti i percorsi né la correttezza dei risultati. Un ramo falso può non contenere nuove istruzioni.'],
 ['Esperienza e collaborazione','Error guessing usa esperienza con errori ricorrenti. Il testing esplorativo combina apprendimento, progettazione ed esecuzione con un obiettivo. Le checklist ricordano categorie di controlli. User story, esempi e criteri di accettazione diventano più chiari se business, sviluppo e testing collaborano.'],
 ['Esempio svolto','Spedizione gratuita se cliente premium OPPURE totale ≥ 50 €. Le quattro combinazioni sono: premium/sopra soglia, premium/sotto soglia, standard/sopra soglia, standard/sotto soglia. Solo l’ultima paga la spedizione. Un test che copre “premium con 80 €” non prova la regola per un cliente standard.'] ],trap:'100% di copertura di una misura non significa 100% di copertura di tutte le altre.',example:'Se esegui soltanto il ramo vero di un IF senza ELSE puoi eseguire tutte le istruzioni, lasciando il ramo falso non verificato.'},
 {id:5,title:'Gestione delle attività di test',short:'Gestione del testing',icon:'compass',weight:9,color:'#b78338',intro:'Usa tempo, evidenze e rischi per prendere decisioni.',sections:[
 ['Piano e criteri','Un piano chiarisce obiettivi, ambito, approccio, risorse, rischi e comunicazione. I criteri di ingresso indicano le condizioni per iniziare; quelli di uscita le condizioni per completare. Una scadenza può richiedere una decisione consapevole sul rischio residuo.'],
 ['Stimare e dare priorità','Una stima a tre punti ponderata usa (ottimistica + 4 × più probabile + pessimistica) / 6. Il risultato è una stima, non un impegno certo. Nel sequenziamento dei test considera rischi, copertura, disponibilità e dipendenze: un test prioritario potrebbe richiedere prima un test di preparazione.'],
 ['Rischi diversi','Un rischio di prodotto riguarda la qualità del prodotto: per esempio un pagamento duplicato. Un rischio di progetto riguarda la consegna: per esempio indisponibilità dell’ambiente. Probabilità e impatto aiutano a stabilire il livello di rischio e l’intensità dei test.'],
 ['Monitorare e intervenire','Il monitoraggio confronta stato e piano con misure utili. Il controllo decide azioni: cambiare priorità, risorse o calendario. Un report di avanzamento aiuta decisioni in corso; un report di completamento riassume risultati, scostamenti, problemi aperti e rischi residui.'],
 ['Rendere riproducibile','Gestisci versioni di software, test, dati e ambiente. Un defect report utile indica titolo chiaro, versione, precondizioni, passi, risultato atteso e ottenuto, evidenze e gravità. La gravità dell’effetto e la priorità di intervento non coincidono necessariamente.'],
 ['Piramide e quadranti','La piramide suggerisce molti test piccoli e rapidi alla base e meno test ampi ai livelli alti. I quadranti distinguono prospettiva tecnica o di business e supporto al team o critica del prodotto. Sono modelli per ragionare, non una sequenza obbligatoria.'] ],trap:'La percentuale di test passati, da sola, non descrive il rischio di rilascio.',example:'Il 98% dei test passa, ma il pagamento può essere duplicato: una metrica aggregata non rende trascurabile un difetto critico.'},
 {id:6,title:'Strumenti di test',short:'Strumenti',icon:'tool',weight:2,color:'#568483',intro:'Scegli gli strumenti in funzione del problema.',sections:[
 ['Un supporto, molti compiti','Gli strumenti possono gestire test e difetti, analizzare codice, generare dati, eseguire prove, misurare copertura o carico. Sceglili in base a obiettivi e integrazione nel processo. Uno strumento di gestione non esegue automaticamente tutti i test registrati.'],
 ['Valore e costo dell’automazione','I controlli ripetitivi sono buoni candidati: l’automazione può aumentare ripetibilità e velocità. Servono però implementazione, dati, ambienti, manutenzione e analisi dei risultati. Test instabili e fiducia eccessiva nei report possono nascondere problemi.'],
 ['Un esperimento prima della scala','Prova lo strumento su casi rappresentativi, misura benefici e costi e verifica competenze e compatibilità. Se l’interfaccia cambia spesso, valuta se spostare una parte dei controlli a un livello più stabile.'] ],trap:'Automatizzare una verifica scadente la rende più veloce, non necessariamente più utile.',example:'Una suite che fallisce casualmente a ogni build consuma attenzione: stabilizza dati, sincronizzazione e ambiente prima di ampliarla.'}
];

const rows = [
[1,'1.1.1',1,'Quale è un obiettivo legittimo del testing?','Fornire informazioni sulla qualità e sul rischio','Provare che nessun difetto esiste','Correggere tutti i difetti del codice','Sostituire ogni decisione di rilascio','Le evidenze dei test aiutano le decisioni. Non dimostrano assenza assoluta di difetti; correggere il codice è attività di debugging.'],
[1,'1.1.2',2,'Un test rivela un totale errato. La sviluppatrice trova una formula sbagliata e la corregge. Come si chiama questa seconda attività?','Debugging','Test di accettazione','Analisi statica automatica','Pianificazione dei test','Individuare la causa nel codice e correggerla è debugging. Il test ha evidenziato il problema; un test successivo potrà confermare la correzione.'],
[1,'1.2.1',2,'Perché discutere esempi di comportamento durante la definizione dei requisiti?','Per prevenire interpretazioni diverse prima dell’implementazione','Per evitare ogni test dinamico successivo','Per trasferire tutta la qualità al tester','Per dimostrare che il prodotto è già corretto','Gli esempi rendono visibili ambiguità quando correggerle è meno oneroso. Non sostituiscono la verifica del software implementato.'],
[1,'1.2.2',2,'Quale attività è principalmente di quality assurance, orientata al processo?','Migliorare il processo di review dopo averne analizzato le lacune','Eseguire un test di login','Segnalare un totale errato nel carrello','Confrontare risultato ottenuto e atteso','La QA cerca di migliorare i processi per prevenire problemi. Le altre attività valutano direttamente un prodotto: sono controllo della qualità.'],
[1,'1.2.3',2,'Un analista legge male una regola, il codice contiene un confronto errato e una transazione viene rifiutata. Qual è il difetto?','Il confronto errato nel codice','La lettura sbagliata dell’analista','Il rifiuto osservato della transazione','Il cliente che invia la transazione','L’errore umano può introdurre un difetto nel prodotto. Quando quel difetto si manifesta durante l’esecuzione si osserva un failure.'],
[1,'1.3.1',2,'Un sistema soddisfa tutte le specifiche, ma gli utenti non riescono a svolgere il loro lavoro. Quale principio spiega meglio il problema?','L’assenza di difetti è una falsa garanzia di utilità','I difetti si distribuiscono sempre uniformemente','I test esaustivi sono sempre possibili','Ogni difetto produce sempre un failure','Anche un prodotto conforme alle specifiche può non soddisfare i bisogni reali. La verifica dei requisiti non basta senza considerare l’uso e il valore.'],
[1,'1.3.1',2,'Una suite invariata trova sempre meno nuovi difetti. Qual è la risposta più appropriata?','Rivedere casi, dati e scenari mantenendo la regressione utile','Eliminare tutti i test che passano','Concludere che il sistema non contiene difetti','Ripetere soltanto gli stessi dati più spesso','I test possono perdere efficacia nel trovare nuovi problemi. Aggiornarli e ampliarli aiuta; i test di regressione continuano ad avere valore.'],
[1,'1.4.1',2,'Stai ricavando condizioni di test da una specifica. In quale attività sei principalmente?','Analisi dei test','Esecuzione dei test','Completamento dei test','Debugging','L’analisi identifica cosa testare. La progettazione stabilisce come, l’implementazione prepara gli elementi eseguibili e l’esecuzione produce risultati.'],
[1,'1.4.2',2,'Due team testano un videogioco e un dispositivo medico. Perché i loro processi possono essere diversi?','Rischi, vincoli e contesto influenzano il processo','Il testing ha un unico processo valido per ogni prodotto','Solo la dimensione del team influenza i test','Il testing non serve ai videogiochi','Approccio e rigore dipendono da contesto, rischi, ciclo di sviluppo e vincoli. Le tecniche non si applicano in modo identico a ogni prodotto.'],
[1,'1.4.3',2,'Quale prodotto di lavoro è tipicamente generato durante l’esecuzione dei test?','Un registro dei risultati effettivi','Una prima definizione degli obiettivi strategici','Il codice della correzione','Il contratto commerciale del progetto','Il test log registra quanto è accaduto durante l’esecuzione. Piano, codice delle correzioni e contratti hanno scopi e momenti differenti.'],
[1,'1.4.4',2,'Un requisito cambia. Quale informazione aiuta maggiormente a identificare i test da aggiornare?','I collegamenti di tracciabilità tra requisito e test','Il numero totale di sviluppatori','L’ordine alfabetico dei nomi dei test','Il solo numero di difetti chiusi','La tracciabilità rende visibili dipendenze e copertura, aiutando l’analisi d’impatto. Un conteggio aggregato non identifica i test coinvolti.'],
[1,'1.4.5',2,'Quale compito appartiene principalmente al ruolo di gestione del test?','Coordinare pianificazione, monitoraggio e controllo','Correggere ogni difetto applicativo','Approvare unilateralmente ogni requisito di business','Scrivere obbligatoriamente tutto il codice di produzione','La gestione del test coordina attività e risorse. Il ruolo di testing si concentra soprattutto sulle attività tecniche; i ruoli possono essere ricoperti dalla stessa persona.'],
[1,'1.5.1',2,'Come comunica meglio un tester un problema controverso?','Presenta passi ed evidenze e ascolta le spiegazioni del team','Attribuisce il difetto alla scarsa competenza dell’autore','Evita di segnalare il problema per non creare conflitti','Invia soltanto “non funziona”','Una comunicazione precisa e costruttiva facilita la soluzione. Colpevolizzare o omettere evidenze riduce la collaborazione.'],
[1,'1.5.2',1,'Nel whole team approach, chi contribuisce alla qualità?','Tutto il team','Soltanto i tester','Soltanto il product owner','Soltanto un revisore esterno','Le competenze si completano e la qualità è condivisa. Ciò non annulla i ruoli specialistici né eventuali requisiti di indipendenza.'],
[1,'1.5.3',2,'Quale è un possibile vantaggio di un tester indipendente dall’autore?','Può mettere in discussione assunzioni condivise dall’autore','Garantisce che non rimangano difetti','Non ha bisogno di comunicare col team','Conosce sempre il codice meglio dell’autore','L’indipendenza porta prospettive diverse, ma non garantisce completezza e può creare isolamento se manca collaborazione.'],
[1,'1.3.1',2,'Il 70% dei difetti rilevati si trova in due moduli su venti. Cosa suggerisce questa evidenza?','Concentrare ulteriori indagini sui moduli a rischio senza ignorare gli altri','Smettere di testare tutti gli altri moduli','Assumere che il 70% dei difetti futuri sarà identico','Distribuire lo sforzo sempre in parti uguali','La concentrazione dei difetti orienta le priorità. Non dimostra che altrove non esistano problemi né predice esattamente i difetti futuri.'],
[2,'2.1.1',2,'In uno sviluppo iterativo, come si collocano normalmente le attività di test?','Si ripetono e si adattano nei vari incrementi','Avvengono soltanto dopo l’ultima iterazione','Si limitano alla documentazione iniziale','Sono sostituite dalla retrospettiva','Ogni incremento richiede feedback e verifiche coerenti con il lavoro svolto. La regressione resta necessaria quando il prodotto evolve.'],
[2,'2.1.2',1,'Quale pratica favorisce il testing in qualunque ciclo di sviluppo?','Coinvolgere i tester presto nella revisione dei prodotti di lavoro','Attendere sempre la fine della codifica per pensare ai test','Far progettare i test soltanto agli utenti finali','Non collegare i test agli obiettivi','Il coinvolgimento precoce permette di chiarire requisiti e preparare verifiche. Non richiede un particolare modello di sviluppo.'],
[2,'2.1.3',1,'Quale approccio usa piccoli test sul codice per guidarne l’implementazione?','TDD','Test di manutenzione','Beta testing','Ispezione formale','Nel TDD si parte da un test che fallisce, si implementa quanto serve e si migliora il codice. ATDD lavora invece sugli esempi di accettazione condivisi.'],
[2,'2.1.4',2,'Una pipeline DevOps esegue test automatici a ogni modifica. Quale affermazione è più corretta?','Accelera il feedback, ma richiede test affidabili e manutenzione','Elimina ogni necessità di testing manuale','Garantisce che ogni build sia pronta per il rilascio','Rende inutili i test non funzionali','Automazione e integrazione continua accelerano la scoperta di problemi, ma non coprono da sole tutti i rischi.'],
[2,'2.1.5',2,'Quale esempio rappresenta lo shift left?','Rivedere i criteri di accettazione prima della codifica','Spostare tutti i test dopo il rilascio','Eliminare i test di sistema','Affidare ogni verifica agli utenti in produzione','Anticipare discussione e verifica aiuta a prevenire problemi. Non significa eliminare i controlli necessari nelle fasi successive.'],
[2,'2.1.6',2,'Una retrospettiva individua ritardi negli ambienti di test. Qual è l’esito più utile?','Un’azione assegnata con una misura per valutarne il miglioramento','Un elenco di colpe senza azioni','La cancellazione dei test d’integrazione','La promessa generica di lavorare meglio','Un miglioramento concreto va applicato e verificato. La sola discussione, senza responsabilità e follow-up, non cambia il processo.'],
[2,'2.2.1',2,'Verifichi lo scambio di messaggi tra il sistema ordini e un gateway di pagamento esterno. Quale livello descrive meglio il test?','Integrazione di sistemi','Componente isolato','Analisi statica','Unit test di una funzione interna','L’interazione tra sistemi distinti è integrazione di sistemi. Le interazioni tra componenti interni riguardano invece l’integrazione di componenti.'],
[2,'2.2.2',2,'Misuri il tempo di risposta con 500 utenti simultanei. Che tipo di test stai eseguendo?','Non funzionale, di prestazioni','Solo funzionale','Solo confirmation testing','Review informale','Le prestazioni descrivono quanto bene il sistema opera. Il tipo di test non determina da solo il livello a cui viene eseguito.'],
[2,'2.2.3',2,'Dopo una correzione riprovi il caso che causava il crash. Qual è l’obiettivo immediato?','Confermare che il difetto originario sia stato corretto','Dimostrare l’assenza di ogni regressione','Misurare la copertura dei requisiti del progetto','Verificare ogni interfaccia esterna','Questo è confirmation testing. Per cercare effetti collaterali della modifica serve anche una selezione di test di regressione.'],
[2,'2.3.1',2,'Un’applicazione stabile migra a una nuova versione del database. Quale test è pertinente?','Testing di manutenzione basato sull’impatto della migrazione','Nessuno, perché il codice applicativo non cambia','Soltanto una review del contratto','Solo test del primo sviluppo, senza adattamenti','Una modifica dell’ambiente può cambiare il comportamento. L’analisi d’impatto aiuta a selezionare verifiche di migrazione e regressione.'],
[2,'2.2.1',2,'Un gruppo di utenti verifica che il prodotto supporti il proprio flusso operativo. Quale livello è più pertinente?','Accettazione','Componente','Integrazione di componenti','Analisi del flusso di controllo','Il testing di accettazione guarda esigenze e disponibilità all’uso. Il test di sistema può aver già verificato requisiti tecnici senza validare l’intero uso operativo.'],
[2,'2.2.3',2,'La correzione del login potrebbe influire sul recupero password. Quale attività cerca questo effetto collaterale?','Regression testing','Solo confirmation testing del login','Solo analisi dei requisiti iniziali','Rimozione dei test già superati','La regressione cerca conseguenze indesiderate delle modifiche. Riprovare soltanto il difetto originale non verifica le funzionalità collegate.'],
[3,'3.1.1',1,'Quale prodotto può essere esaminato mediante testing statico?','Una user story non ancora implementata','Soltanto un programma in esecuzione','Soltanto un file eseguibile installato','Soltanto una schermata in produzione','Requisiti, modelli, codice e test possono essere esaminati senza eseguire il programma sotto test.'],
[3,'3.1.2',2,'Una review scopre che due requisiti si contraddicono. Qual è il vantaggio principale?','Correggere l’incoerenza prima che si propaghi nell’implementazione','Garantire che tutti i requisiti siano completi','Eliminare automaticamente tutti i test dinamici','Misurare direttamente le prestazioni del sistema','La scoperta anticipata può evitare rilavorazioni. Una review non prova la completezza e non misura prestazioni runtime.'],
[3,'3.1.3',2,'Quale attività è testing statico?','Un analizzatore segnala una variabile usata prima dell’inizializzazione senza eseguire il programma','Un test invia richieste HTTP al servizio','Un utente osserva un crash','Un test misura la memoria durante l’esecuzione','L’analizzatore esamina il prodotto senza eseguirlo. Le altre attività osservano un sistema in esecuzione.'],
[3,'3.2.1',1,'Quale beneficio offre un feedback frequente degli stakeholder?','Chiarire prima aspettative e incomprensioni','Congelare per sempre i requisiti','Rendere superflua ogni comunicazione futura','Impedire qualunque modifica','Feedback precoci e frequenti aiutano ad allineare il prodotto ai bisogni e a ridurre malintesi. Non eliminano il cambiamento.'],
[3,'3.2.2',2,'Prima della discussione collettiva, i revisori esaminano autonomamente il documento. Quale attività è?','Review individuale','Risoluzione e reporting','Implementazione dei test','Esecuzione dinamica','L’esame individuale permette di identificare anomalie da analizzare insieme. La risoluzione riguarda invece correzioni e relativo follow-up.'],
[3,'3.2.3',1,'Chi facilita una riunione di review e aiuta a mantenerla produttiva?','Il moderatore','Il compilatore','L’utente finale necessariamente','Il solo autore, in ogni tipo di review','Il moderatore facilita collaborazione, discussione e gestione del tempo. Lo scriba registra; l’autore spiega e corregge il prodotto.'],
[3,'3.2.4',2,'Quale review è normalmente la più formale, con criteri, ruoli e raccolta di misure?','Ispezione','Review informale','Scambio estemporaneo in chat','Qualunque walkthrough senza preparazione','L’ispezione applica un processo formalizzato. Un walkthrough è generalmente guidato dall’autore e non equivale automaticamente a un’ispezione.'],
[3,'3.2.5',1,'Quale fattore favorisce il successo di una review?','Obiettivi chiari e tempo sufficiente per la preparazione','Usare il conteggio dei difetti per colpevolizzare gli autori','Discutere senza leggere il materiale','Evitare competenze diverse nel gruppo','Preparazione, obiettivi condivisi e clima costruttivo migliorano la review. La valutazione punitiva delle persone scoraggia segnalazioni utili.'],
[4,'4.1.1',2,'Derivi test dalle regole di una specifica senza usare la struttura del codice. Quale famiglia di tecniche usi?','Black-box','White-box','Solo analisi statica','Solo debugging','Le tecniche black-box derivano test dal comportamento specificato. Le white-box usano invece struttura interna e flusso di controllo.'],
[4,'4.2.1',3,'Un campo accetta età intere da 18 a 65 inclusi. Quale insieme copre le tre partizioni sotto, dentro e sopra l’intervallo?','17, 40, 66','18, 40, 65','20, 30, 40','17, 16, 66','17 rappresenta la classe sotto soglia, 40 quella valida e 66 quella sopra soglia. Più valori della stessa classe non coprono una classe mancante.'],
[4,'4.2.1',3,'Una tariffa è A per 0–9 km, B per 10–29 km e C da 30 km in poi. Per distanze intere non negative, quanti test minimi coprono queste partizioni valide?','3','2','4','40','Le tre fasce hanno comportamenti distinti: serve almeno un rappresentante per ciascuna. La domanda riguarda solo le partizioni valide indicate.'],
[4,'4.2.2',3,'Un campo accetta interi da 10 a 20 inclusi. Quale insieme dà copertura BVA a 2 valori sui due confini?','9, 10, 20, 21','10, 15, 20','9, 11, 19, 21','8, 10, 20, 22','Ogni confine separa due classi: 9/10 al limite inferiore e 20/21 al superiore. Per la BVA a 2 valori servono i due valori ai lati di ciascun confine.'],
[4,'4.2.2',3,'Per l’intervallo intero valido 10–20, quali valori aggiungi a 9, 10, 20, 21 per la BVA a 3 valori?','11 e 19','8 e 22','12 e 18','0 e 30','La BVA a 3 valori verifica il valore limite e i suoi due vicini: 9,10,11 e 19,20,21. 8 e 22 non sono i vicini interni dei limiti validi.'],
[4,'4.2.3',3,'Uno sconto si applica solo se il cliente è socio E il totale è almeno 100 €. Quale caso riceve lo sconto?','Socio, totale 100 €','Non socio, totale 150 €','Socio, totale 99 €','Non socio, totale 99 €','Entrambe le condizioni devono essere vere. “Almeno 100” include 100; né la sola appartenenza né il solo importo bastano.'],
[4,'4.2.3',3,'Due condizioni booleane sono indipendenti e tutte le combinazioni sono possibili. Quante regole ha la tabella decisionale completa prima di semplificarla?','4','2','3','8','Due possibilità per ciascuna delle due condizioni danno 2 × 2 = 4 combinazioni. Le azioni uguali possono consentire una semplificazione successiva.'],
[4,'4.2.4',3,'Un account passa da Attivo a Bloccato dopo tre password errate consecutive; un login corretto azzera il conteggio. Partendo da Attivo, quale sequenza lo blocca?','Errata, errata, errata','Errata, corretta, errata','Corretta, errata, corretta','Errata, errata, corretta','Il blocco dipende da tre errori consecutivi. Un successo azzera il conteggio e interrompe la sequenza.'],
[4,'4.2.4',3,'Un modello ha transizioni A→B, B→A, B→C e C→A. Il percorso A→B→C→A copre quale percentuale delle transizioni?','75%','100%','50%','25%','Il percorso usa tre transizioni distinte su quattro. Visita tutti gli stati, ma non percorre B→A: copertura degli stati e delle transizioni sono diverse.'],
[4,'4.3.1',2,'Una suite esegue 18 delle 24 istruzioni eseguibili. Qual è la copertura delle istruzioni?','75%','80%','60%','100%','La copertura è 18/24 × 100 = 75%. Non si conta il numero di test né il numero di righe del file, che può includere commenti.'],
[4,'4.3.2',2,'Una suite copre il 100% dei rami raggiungibili. Cosa puoi concludere sulle istruzioni raggiungibili?','Sono coperte al 100%','Sono necessariamente coperte solo al 50%','Nessuna istruzione è necessariamente eseguita','Tutti i possibili percorsi sono coperti','La copertura dei rami include quella delle istruzioni raggiungibili. Non implica copertura di tutti i percorsi, soprattutto in presenza di cicli.'],
[4,'4.3.3',2,'Quale limite ha una suite con copertura strutturale del 100%?','Può non rilevare funzionalità richieste ma non implementate','Dimostra che tutti i requisiti sono soddisfatti','Garantisce l’assenza di difetti','Rende inutili i risultati attesi','La struttura esistente non rivela da sola funzionalità mancanti. Servono anche test basati sulle specifiche e oracoli adeguati.'],
[4,'4.4.1',2,'Un tester prova un nome con apostrofo ricordando difetti simili in passato. Quale tecnica sta usando?','Error guessing','Analisi dei valori limite necessariamente','Copertura dei rami','Stima a tre punti','La scelta nasce dall’esperienza su possibili errori. Non richiede una partizione o un modello strutturale formalizzato.'],
[4,'4.4.2',2,'In una sessione con obiettivo definito, il tester impara dal comportamento e adatta subito i test successivi. È un esempio di:','Testing esplorativo','Esecuzione rigidamente scriptata','Solo ispezione','Testing casuale senza obiettivo','Nel testing esplorativo apprendimento, progettazione ed esecuzione si influenzano. Un charter e note rendono la sessione focalizzata e comunicabile.'],
[4,'4.4.3',2,'Qual è un rischio di una checklist troppo generica?','Tester diversi possono interpretare le voci in modi diversi','Garantisce automaticamente copertura totale','Impedisce ogni uso dell’esperienza','Richiede sempre accesso al codice sorgente','Le voci dovrebbero essere comprensibili e verificabili. Una checklist guida l’attenzione ma non garantisce copertura completa né risultati identici.'],
[4,'4.5.1',2,'Business, sviluppo e testing discutono insieme una user story. Quale risultato cercano soprattutto?','Una comprensione condivisa sostenuta da esempi','Una story priva di qualunque criterio verificabile','L’eliminazione di ogni comunicazione futura','La scelta del linguaggio di programmazione da parte dei tester','Le prospettive diverse fanno emergere ambiguità e casi mancanti. La collaborazione migliora comprensione e testabilità della story.'],
[4,'4.5.2',2,'“Dato un carrello vuoto, quando aggiungo un prodotto, allora compare una riga” è un criterio espresso in forma:','Orientata allo scenario','Di copertura dei rami','Di stima del rischio','Di tabella delle risorse','La forma Given/When/Then descrive uno scenario concreto. I criteri possono anche essere espressi come regole o checklist.'],
[4,'4.5.3',3,'Una story dice: “Dopo tre tentativi errati consecutivi l’account si blocca”. Quale test di accettazione è più direttamente pertinente?','Account attivo; tre password errate consecutive; verificare il blocco','Account attivo; una password errata; aspettarsi il blocco','Account attivo; login corretto; aspettarsi il blocco','Account bloccato; cambiare il colore del pulsante','Il test traduce il criterio in precondizione, azioni e risultato osservabile. Gli altri casi contraddicono la regola o non la verificano.'],
[4,'4.2.1',3,'Un campo formato accetta solo PDF o PNG; gli altri valori formano una classe invalida. Quale insieme copre le tre classi indicate?','PDF, PNG, TXT','PDF, PDF, PNG','TXT, DOC, GIF','PNG, PNG, PNG','Le classi specificate sono PDF, PNG e altro. TXT rappresenta la classe invalida; tre formati invalidi non coprono le due classi valide.'],
[4,'4.2.2',3,'Un carrello accetta quantità intere da 1 a 99. Quale insieme copre i due confini con BVA a 2 valori?','0, 1, 99, 100','1, 50, 99','2, 98','0, 50, 100','Le coppie adiacenti ai confini sono 0/1 e 99/100. Un valore centrale può essere utile per altri scopi, ma non sostituisce un valore di confine.'],
[4,'4.3.2',2,'Un IF ha un ramo vero e uno falso, senza ELSE. Un test percorre solo il ramo vero. Qual è la copertura dei due rami?','50%','100%','0%','Non esiste un ramo falso senza ELSE','Anche senza un blocco ELSE esiste il trasferimento di controllo quando la condizione è falsa. Percorrere solo l’esito vero copre un ramo su due.'],
[4,'4.2.3',3,'Accesso consentito se (badge valido) E (PIN corretto). Hai provato vero/vero e falso/vero. Quante combinazioni restano per coprire la tabella completa?','2','0','1','3','Mancano vero/falso e falso/falso. Le quattro combinazioni sono possibili per le due condizioni indipendenti.'],
[5,'5.1.1',2,'Quale contenuto è appropriato in un piano di test?','Ambito, approccio, risorse e criteri di completamento','Soltanto l’elenco dei difetti già corretti','Soltanto il codice sorgente','Una garanzia di assenza di rischi','Il piano coordina obiettivi e lavoro. Un elenco di difetti o il codice non sostituiscono approccio, risorse e criteri.'],
[5,'5.1.2',1,'Come può contribuire un tester alla pianificazione di un’iterazione?','Chiarendo testabilità, rischi e sforzo di verifica delle story','Garantendo che ogni story sia priva di difetti','Decidendo da solo tutte le priorità commerciali','Rinviando ogni discussione dei test alla fine','Il tester porta una prospettiva sulla verifica e sui rischi, aiutando stime e criteri. La pianificazione resta un’attività collaborativa.'],
[5,'5.1.3',2,'“L’ambiente è disponibile e lo smoke test passa” è usato per decidere se iniziare una campagna. Si tratta di:','Criterio di ingresso','Criterio di uscita','Defect report','Metrica di copertura dei rami','Il criterio definisce la disponibilità a iniziare l’attività. Un criterio di uscita definisce quando considerarla completata.'],
[5,'5.1.4',3,'Stima ottimistica 4 ore, più probabile 7, pessimistica 16. Con (O + 4M + P)/6, qual è la stima?','8 ore','9 ore','7 ore','27 ore','(4 + 4×7 + 16)/6 = 48/6 = 8. La media semplice dei tre valori darebbe 9, ma non è la formula ponderata richiesta.'],
[5,'5.1.5',3,'T1 copre un rischio basso. T2 copre un rischio alto ma richiede T3. T3 è disponibile e prepara i dati. Quale ordine rispetta rischio e dipendenza?','T3, T2, T1','T2, T3, T1','T1, T2, T3','T2, T1, T3','Per eseguire T2 correttamente serve prima T3. Poi si affronta il rischio alto prima di T1: la priorità non annulla le dipendenze.'],
[5,'5.1.6',1,'Quale configurazione descrive la piramide dei test?','Molti test piccoli e rapidi alla base, meno test ampi in cima','Solo test end-to-end','Lo stesso numero di test per ogni livello obbligatoriamente','Solo test manuali di accettazione','La piramide rappresenta una distribuzione tipica per ottenere feedback rapido e limitare costi dei test più ampi. Non prescrive un numero fisso.'],
[5,'5.1.7',2,'Nei quadranti del testing, dove si collocano tipicamente i test esplorativi orientati al business che criticano il prodotto?','Q3','Q1','Q2','Q4','Q3 guarda il prodotto dalla prospettiva del business e ne valuta il comportamento. Q1 è tecnico a supporto del team, Q2 business a supporto, Q4 tecnico di critica.'],
[5,'5.2.1',1,'Quali due attributi si usano normalmente per valutare il livello di un rischio?','Probabilità e impatto','Numero di tester e colore dell’interfaccia','Età del progetto e nome del prodotto','Numero di test e numero di commenti','Il rischio combina la possibilità che un evento si verifichi e le sue conseguenze. Un solo conteggio di test non rappresenta questi due aspetti.'],
[5,'5.2.2',2,'Quale è un rischio di progetto, distinto da un rischio di prodotto?','L’ambiente di test non sarà pronto in tempo','Il sistema calcola male le imposte','Un utente può leggere dati altrui','Il checkout duplica un pagamento','L’ambiente in ritardo minaccia il piano e la consegna. Gli altri esempi riguardano caratteristiche o comportamenti problematici del prodotto.'],
[5,'5.2.3',2,'L’analisi identifica una funzione con alta probabilità di guasto e grave impatto. Come dovrebbe influenzare il testing?','Aumentare priorità e profondità dei test pertinenti','Escluderla perché difficile','Ridurre i test perché il rischio è già noto','Limitarsi a contare i test totali','L’analisi del rischio orienta ambito, priorità, tecniche e sforzo. Conoscere un rischio non equivale a ridurlo.'],
[5,'5.2.4',2,'Dopo i test permane un rischio importante non mitigato. Qual è una risposta appropriata?','Comunicarlo e supportare una decisione esplicita sul rischio residuo','Ometterlo se la maggioranza dei test passa','Dichiararlo nullo perché la data è vicina','Cambiare la metrica per far risultare tutto verde','Controllare il rischio comprende mitigazione e monitoraggio. I rischi residui devono essere visibili a chi decide; un test verde altrove non li annulla.'],
[5,'5.3.1',1,'Quale è una metrica di avanzamento dell’esecuzione?','Numero di test eseguiti rispetto a quelli pianificati','Nome del responsabile del progetto','Colore del logo applicativo','Numero di riunioni commerciali','Il confronto tra eseguito e pianificato aiuta a seguire l’avanzamento. Va letto insieme a risultati, rischio e qualità, non come prova unica di prontezza.'],
[5,'5.3.2',2,'Quale informazione è particolarmente utile in un report di completamento?','Risultati complessivi, scostamenti e rischi residui','Una dichiarazione assoluta di assenza di difetti','Solo il numero di ore senza risultati','Tutti i log grezzi senza sintesi per il destinatario','Il report riassume cosa è stato raggiunto e cosa resta aperto. Deve aiutare il destinatario a decidere, non soltanto accumulare dati.'],
[5,'5.3.3',2,'Devi comunicare lo stato dei test a dirigenti non tecnici. Quale approccio è più adatto?','Sintetizzare impatto, rischi e decisioni richieste con evidenze accessibili','Inviare solo stack trace senza contesto','Nascondere tutti i difetti aperti','Usare lo stesso dettaglio tecnico per ogni destinatario','Forma e dettaglio vanno adattati al pubblico. La sintesi deve restare fedele alle evidenze e rendere chiari i rischi.'],
[5,'5.4.1',2,'Un test fallisce solo su una vecchia build, ma i risultati non indicano le versioni. Quale pratica risolve il problema di tracciabilità?','Gestione della configurazione di build, test, dati e ambiente','Aumentare soltanto il numero di test','Eliminare tutti i risultati falliti','Rinominare il prodotto','Identificare versioni e baseline rende i risultati interpretabili e riproducibili. Più test non compensano configurazioni sconosciute.'],
[5,'5.5.1',3,'Un’app si chiude quando salvi un nome con apostrofo. Quale segnalazione è più utile?','Build 2.1, Windows 11; aprire Profilo, inserire D’Amico, salvare; atteso salvataggio, ottenuta chiusura; log allegato','“Profilo rotto, sistemare subito”','“Errore dello sviluppatore”','“App lenta” senza altri dettagli','La prima segnalazione offre contesto, passi, dati, confronto atteso/ottenuto ed evidenze. Le altre non consentono di riprodurre e analizzare il problema.'],
[5,'5.1.4',3,'Su progetti comparabili il test richiede il 25% dello sforzo di sviluppo. Per 120 giornate di sviluppo, quale stima basata sul rapporto ottieni?','30 giornate','25 giornate','45 giornate','480 giornate','120 × 0,25 = 30. La validità dipende dalla comparabilità dei progetti: il rapporto storico non garantisce lo sforzo reale.'],
[5,'5.1.5',3,'T1 copre R1 e R2; T2 copre R2 e R3; T3 copre R4. Hai già eseguito T1. Con priorità alla maggiore copertura aggiuntiva, quanti nuovi requisiti copre T2?','1','2','3','0','R2 è già coperto da T1; T2 aggiunge soltanto R3. La copertura aggiuntiva conta gli elementi ancora scoperti, non tutti quelli del test.'],
[6,'6.1.1',2,'Vuoi identificare automaticamente codice irraggiungibile senza eseguire il programma. Quale strumento scegli?','Analizzatore statico','Generatore di carico','Registratore di test GUI','Sistema di ticket da solo','L’analisi statica esamina la struttura del codice. Un generatore di carico richiede esecuzione e un sistema di ticket organizza segnalazioni.'],
[6,'6.2.1',1,'Quale è un possibile beneficio dell’automazione dei test?','Esecuzione ripetibile di controlli frequenti','Assenza totale di manutenzione','Garanzia automatica di qualità','Eliminazione della progettazione dei test','L’automazione può rendere controlli ripetibili e rapidi. Restano necessari progettazione, manutenzione e interpretazione dei risultati.'],
[6,'6.1.1',2,'Devi organizzare casi di test, esecuzioni e risultati condivisi. Quale categoria di strumenti è più pertinente?','Gestione dei test','Solo profiling della memoria','Solo compilazione','Solo generazione di carico','Gli strumenti di gestione aiutano a pianificare e registrare il lavoro. Non implicano che i casi registrati vengano eseguiti automaticamente.'],
[6,'6.2.1',1,'Quale è un rischio dell’automazione?','Sottovalutare l’impegno di manutenzione e riporre eccessiva fiducia nei test automatizzati','Avere controlli ripetibili','Ricevere feedback più rapido','Ridurre attività ripetitive','Suite fragili, costi sottostimati e fiducia eccessiva possono ridurre il valore dell’automazione. Le altre opzioni sono benefici potenziali.']
];

'use strict';
const D=root.TrainerData;
const syllabus='https://istqb.org/wp-content/uploads/2024/11/ISTQB-CTFL-AT_Syllabus_v1.0.pdf';
const chapters=[
{id:7,title:'Agile · Valori e collaborazione',short:'Agile: sviluppo',icon:'cycle',color:'#317866',weight:0,intro:'Materiale integrativo Agile Tester: valori, feedback e pianificazione. Non entra nella simulazione CTFL.',sections:[
['Valori, non divieti','Il Manifesto mette al primo posto persone, software funzionante, collaborazione e adattamento. Non elimina strumenti, documenti, contratti o piani: ne valuta l’utilità. Se un requisito è ambiguo, una conversazione con esempi è più efficace di aggiungere campi obbligatori a un modulo. La decisione va poi conservata nella forma necessaria per test, manutenzione e vincoli di progetto.'],
['Whole team e feedback','La qualità è una responsabilità condivisa. Business, sviluppo e testing chiariscono insieme esempi, rischi e criteri prima di implementare. Il tester contribuisce con pensiero critico, non diventa l’unico responsabile della qualità. Una demo precoce può smentire un’ipotesi sul bisogno dell’utente anche quando tutti i test tecnici passano: verificare il codice e validare il valore sono attività complementari.'],
['Storie verificabili','Le 3C sono Card, Conversation e Confirmation. La scheda avvia una conversazione, mentre esempi e criteri confermano la comprensione. INVEST richiede storie indipendenti, negoziabili, di valore, stimabili, piccole e testabili. “Il sito deve essere veloce” non specifica un esito verificabile: occorrono condizioni, carico e soglia concordati. Evitare di prescrivere l’implementazione quando il bisogno può essere espresso come comportamento.'],
['Scrum, Kanban e pianificazione','Scrum usa Sprint di durata fissa, al massimo un mese nella Scrum Guide 2020; non è obbligatorio usare sempre due settimane. Il Daily ispeziona il progresso verso lo Sprint Goal: le tre domande tradizionali non sono obbligatorie. Kanban rende visibile il flusso e limita il lavoro in corso. Release planning guarda un orizzonte più ampio; iteration planning dettaglia storie, rischi, attività e test vicini. Adattare il piano non significa accettare qualsiasi modifica senza valutarne l’impatto.']
],trap:'Agile non significa assenza di documentazione o cambiamenti arbitrari che compromettono lo Sprint Goal.',example:'Una richiesta di sconto arriva durante lo Sprint: chiarire valore, rischio e impatto con il Product Owner prima di modificare il lavoro. Il cambiamento non è né automaticamente vietato né automaticamente accettato.'},
{id:8,title:'Agile · Qualità durante l’iterazione',short:'Agile: pratiche',icon:'shield',color:'#937244',weight:0,intro:'Test continui, regressione, feedback tecnico e comunicazione del rischio.',sections:[
['Testare mentre si costruisce','Analisi e test iniziano con le storie: cercare ambiguità prima del codice previene rilavorazioni. Durante l’iterazione si verificano componenti, integrazioni e comportamenti del sistema in base al rischio. I livelli non spariscono e non devono essere tutti sequenziali. La regressione controlla le parti già esistenti dopo una modifica; il confirmation testing verifica invece che il difetto specifico sia stato corretto.'],
['CI e regressione sostenibile','L’integrazione frequente dà feedback rapido solo se build e controlli sono attendibili. Una pipeline può compilare, fare analisi statica, eseguire test e produrre report. Una build verde dimostra soltanto che quei controlli sono passati in quelle condizioni. Servono test utili, manutenzione, dati riproducibili e analisi dei fallimenti. Uno smoke test seleziona rapidamente build testabili; non sostituisce la regressione completa.'],
['Informare le decisioni','Una board mostra lo stato del lavoro, un burndown il lavoro residuo secondo la misura adottata: nessuno dei due dimostra da solo la qualità. Integrare rischi ancora aperti, copertura, difetti e risultati. Un numero elevato di test passati può nascondere la mancata verifica del pagamento. Il tester rende visibili tali limiti senza trasformare il report in una lista di attività priva di significato.'],
['Indipendenza e miglioramento','Collaborare con gli sviluppatori favorisce prevenzione e contesto; mantenere un punto di vista critico riduce i bias condivisi. Pair testing, revisioni incrociate o competenze esterne possono aiutare secondo il rischio. La retrospettiva esamina il processo e sceglie azioni verificabili: per esempio stabilizzare tre test intermittenti e misurare i falsi allarmi nella prossima iterazione. Non è una riunione per attribuire colpe.']
],trap:'Automazione e build verde non provano assenza di difetti. Velocità del team e qualità del prodotto sono misure diverse.',example:'Se cento test verdi non coprono il rimborso, un cambiamento nei pagamenti richiede nuovi controlli mirati. Non basta confrontare il numero totale dei test.'},
{id:9,title:'Agile · Metodi, rischi e strumenti',short:'Agile: tecniche',icon:'tool',color:'#667d9a',weight:0,intro:'Distinguere TDD, ATDD e BDD, scegliere tecniche e motivare le priorità.',sections:[
['TDD, ATDD e BDD: leggere gli indizi','TDD guida piccoli passi di sviluppo: test che fallisce per il motivo atteso, implementazione minima che passa, refactoring con test verdi. ATDD parte da esempi di accettazione concordati con business, sviluppo e testing prima dell’implementazione. BDD favorisce una comprensione condivisa del comportamento, spesso espressa con Given–When–Then. La sola frase “test automatici di sistema” non permette di scegliere tra queste pratiche: occorrono scopo, partecipanti e momento.'],
['Piramide e quadranti','La piramide suggerisce molti controlli veloci a livello basso e meno test end-to-end costosi; non vieta i test UI e non impone una percentuale universale. I quadranti combinano prospettiva tecnica/business e supporto al team/critica del prodotto: Q1 componenti tecnici, Q2 esempi funzionali a supporto, Q3 esplorazione e valutazione business, Q4 qualità tecnica come prestazioni. Sono una guida alla conversazione e alla copertura, non quattro fasi da eseguire in ordine.'],
['Rischio, stima e criteri','Il rischio di prodotto dipende da probabilità e impatto del problema. Il rischio orienta priorità, profondità e tecniche; la stima include preparazione dei dati, ambienti, esecuzione, analisi e manutenzione. Non confondere rischio con solo costo o solo frequenza. Criteri di accettazione concreti sono una base per i test, ma non esauriscono tutti i rischi: sicurezza, accessibilità e regressione possono richiedere controlli ulteriori.'],
['Tecniche applicate','Per un campo intero ammesso da 18 a 65, le partizioni sono sotto 18, da 18 a 65, sopra 65. La BVA a due valori usa 17,18,65,66; non basta testare un valore centrale. Nell’esplorazione, una charter definisce missione, ambito e rischi; la sessione conserva note, risultati e domande. Una mind map organizza idee, ma non esegue automaticamente i test. Gli strumenti vanno scelti per il problema, considerando manutenzione, competenze e attendibilità dei risultati.']
],trap:'Il livello del test non identifica da solo TDD, ATDD o BDD. Leggi chi collabora, quando e per quale scopo.',example:'Prima di sviluppare un rimborso, business, tester e sviluppatore concordano esempi validi e negati: ATDD. Il programmatore scrive poi un test di componente rosso e implementa la regola: TDD. Le due pratiche possono convivere.'}

const rows=[
[7,'Graner p. 9, Q1 (corretta)','Un requisito ambiguo blocca il team. Quale scelta esprime persone e interazioni?', ['Confrontarsi direttamente e registrare gli esempi concordati','Aggiungere approvazioni obbligatorie senza confronto','Eliminare ogni strumento','Attendere che il contratto risolva il dubbio'], ['La conversazione chiarisce il significato; conservarne l’esito mantiene la tracciabilità utile.','Aumentare il processo senza chiarire il bisogno non risolve l’ambiguità.','Il Manifesto valorizza le persone più degli strumenti, ma non vieta gli strumenti.','La negoziazione contrattuale non sostituisce la comprensione condivisa.']],
[7,'Graner p. 15, Q1 (corretta)','Un feedback cambia il bisogno del cliente. Come rispondere?', ['Valutare valore e impatto e adattare il piano','Ignorarlo perché il piano è approvato','Implementarlo senza analizzare rischi','Abbandonare ogni pianificazione'], ['Adattare significa decidere sulla base di nuove informazioni, conservando controllo e obiettivi.','Seguire il piano a ogni costo trascura il valore del feedback.','Accogliere il cambiamento non elimina l’analisi dell’impatto.','La pianificazione resta utile, ma è evolutiva.']],
[7,'Graner p. 81, Q3','Chi è responsabile della qualità in un whole-team approach?', ['L’intero team, con competenze complementari','Soltanto il tester','Soltanto chi approva il rilascio','Un gruppo esterno a fine progetto'], ['La responsabilità è condivisa; questo non rende intercambiabili tutte le competenze.','Il tester contribuisce e facilita, non assorbe la responsabilità degli altri.','L’approvazione del rilascio non produce da sola qualità.','Il controllo tardivo non sostituisce la prevenzione nel team.']],
[7,'Graner p. 81, Q4','Qual è il beneficio principale di mostrare presto un prototipo?', ['Verificare ipotesi sul bisogno prima di investire molto','Dimostrare che il prodotto non ha difetti','Eliminare i test di accettazione','Bloccare definitivamente i requisiti'], ['Il feedback anticipato permette di correggere una direzione sbagliata quando il costo è minore.','Il prototipo non prova la correttezza del prodotto finale.','Il feedback integra, non annulla, l’accettazione.','L’apprendimento può far evolvere i requisiti.']],
[7,'Graner p. 82, Q5; Mappa p. 2','Una storia dice “ricerca veloce”. Qual è il contributo più utile del tester?', ['Chiarire carico, soglia e risultati attesi con il team','Accettare “veloce” come criterio misurabile','Scegliere da solo la soluzione tecnica','Rimandare ogni chiarimento al collaudo'], ['Condizioni e soglie rendono osservabile la qualità richiesta e sostengono esempi verificabili.','“Veloce” dipende dalle aspettative: senza condizioni non è un oracolo affidabile.','Il bisogno va concordato; imporre l’implementazione non è il primo passo.','Un chiarimento tardivo aumenta rilavorazioni e divergenze.']],
[7,'Graner p. 82, Q8; Mappa p. 3','Quale attività appartiene soprattutto all’iteration planning?', ['Dettagliare test e attività delle storie vicine','Fissare immutabilmente tutte le release future','Consegnare solo un report finale','Evitare stime dei test'], ['Il dettaglio cresce sul lavoro imminente, includendo rischi, dati e test.','Il release planning è più ampio e comunque adattivo, non immutabile.','Il reporting finale non è pianificazione dell’iterazione.','L’effort del testing fa parte del lavoro da pianificare.']],
[7,'Mappa p. 2','La colonna “in lavorazione” supera il limite WIP. Quale risposta favorisce il flusso?', ['Aiutare a completare il lavoro aperto prima di iniziarne altro','Aprire più attività per tenere tutti occupati','Nascondere le attività bloccate','Eliminare la visualizzazione del flusso'], ['Limitare il lavoro iniziato riduce code e rende visibili i colli di bottiglia.','Più attività aperte possono aumentare attese e multitasking.','Nascondere il blocco impedisce di gestirlo.','La visualizzazione aiuta a individuare il problema.']],
[7,'Mappa pp. 1–2 (precisata)','Nella Scrum Guide 2020, il Daily Scrum richiede sempre le tre domande tradizionali?', ['No: il formato deve aiutare a ispezionare il progresso verso lo Sprint Goal','Sì: le tre domande sono obbligatorie','No: è una presentazione al cliente','Sì: serve ad approvare individualmente ogni attività'], ['Le tre domande sono una possibile tecnica, non un vincolo della guida 2020.','Confondere una pratica storica con un obbligo porta a una risposta troppo assoluta.','Il Daily non è la Sprint Review con gli stakeholder.','Il Daily serve all’adattamento del piano, non al controllo individuale.']],
[8,'Graner p. 82, Q6','Quale risultato rende utile una retrospettiva?', ['Un miglioramento concreto con responsabilità e verifica','Una graduatoria delle persone che hanno sbagliato','Solo una demo del prodotto','La promessa di non avere mai più difetti'], ['Un’azione verificabile trasforma l’osservazione in apprendimento sul processo.','Attribuire colpe riduce sicurezza e collaborazione.','La demo riguarda la review del prodotto, non sostituisce la retrospettiva.','Zero difetti futuri non è una promessa verificabile realistica.']],
[8,'Graner p. 82, Q7','Una pipeline CI è verde. Cosa si può concludere?', ['I controlli eseguiti sono passati nelle condizioni della pipeline','Il prodotto è privo di difetti','Ogni bisogno del cliente è soddisfatto','La regressione futura è impossibile'], ['Il risultato è circoscritto a controlli, dati, ambiente e versione effettivamente usati.','I test possono mancare difetti e coprire solo parte del comportamento.','La correttezza tecnica non prova automaticamente l’utilità per il cliente.','Le modifiche future possono introdurre nuovi problemi.']],
[8,'Graner p. 16, Q5; Mappa p. 4','A ogni iterazione cresce la regressione manuale. Quale strategia è sostenibile?', ['Automatizzare controlli stabili e importanti e mantenere la suite','Automatizzare tutto senza valutare costi','Rinunciare alla regressione','Conservare per sempre anche test obsoleti'], ['La selezione considera rischio, ripetibilità, costo e manutenzione; libera tempo per nuove indagini.','Test instabili o poco utili possono costare più del beneficio.','Le nuove funzionalità possono danneggiare quelle esistenti.','Controlli obsoleti consumano risorse e possono produrre falsi allarmi.']],
[8,'Graner p. 12, Q14','Qual è un contributo del tester nel team Agile?', ['Aiutare il team a prevenire problemi e comunicare rischi','Essere l’unico responsabile di tutti i difetti','Limitarsi al collaudo finale','Approvare ogni decisione di business da solo'], ['Coaching, esempi e pensiero critico migliorano le decisioni durante tutto il ciclo.','La responsabilità della qualità resta condivisa.','L’intervento anticipato previene problemi invece di rilevarli soltanto.','Le decisioni di business richiedono i responsabili del prodotto.']],
[8,'Mappa p. 4','Un burndown scende regolarmente. Quale conclusione è giustificata?', ['Il lavoro residuo misurato sta diminuendo, ma la qualità richiede altre evidenze','Tutti i requisiti sono corretti','Non restano rischi di prodotto','La copertura dei test è completa'], ['Il grafico rappresenta lavoro residuo, non una prova autonoma di qualità o copertura.','I requisiti possono essere errati pur con attività completate.','Il rischio residuo va valutato con evidenze specifiche.','Una misura di effort non misura la copertura.']],
[8,'Mappa p. 4','Qual è lo scopo di un Build Verification Test?', ['Valutare rapidamente se la build è adatta a test ulteriori','Sostituire ogni test di regressione','Certificare l’assenza di vulnerabilità','Misurare la soddisfazione degli utenti'], ['Un insieme breve di controlli essenziali evita di investire su una build inutilizzabile.','La selezione rapida lascia fuori molti comportamenti.','La sicurezza richiede analisi e test dedicati.','Il funzionamento minimo non misura il valore percepito.']],
[8,'Mappa pp. 4–5','Come mantenere pensiero critico collaborando strettamente con gli sviluppatori?', ['Usare revisioni incrociate e discutere ipotesi e rischi','Accettare automaticamente ogni spiegazione del codice','Isolare sempre il tester da ogni conversazione','Considerare la collaborazione incompatibile con il testing'], ['Prospettive diverse possono sfidare le assunzioni senza perdere il contesto condiviso.','Il consenso non è una verifica indipendente delle assunzioni.','L’isolamento può perdere informazioni e ritardare feedback.','Collaborazione e critica costruttiva possono rafforzarsi.']],
[8,'Graner p. 9, Q4 (rielaborata)','Quale documentazione è coerente con un approccio Agile?', ['Informazioni utili, aggiornate e proporzionate a rischi e vincoli','Nessun documento in qualsiasi contesto','Tutti i documenti possibili prima di iniziare','Solo codice anche per decisioni normative'], ['La leggerezza riguarda utilità e manutenzione, non un divieto assoluto di documentare.','Esistono bisogni di tracciabilità, manutenzione e conformità.','Massimizzare documenti non equivale a massimizzare valore.','Il codice non registra necessariamente motivazioni o evidenze richieste.']],
[9,'Graner p. 83, Q10','Qual è la sequenza essenziale del TDD?', ['Test rosso, codice minimo verde, refactoring','Codice completo, rilascio, primo test','Refactoring senza test, poi accettazione','Demo, contratto, rilascio'], ['Il fallimento atteso verifica il test; il codice soddisfa il comportamento e il refactoring migliora la struttura mantenendo i test verdi.','Il test arriva troppo tardi per guidare lo sviluppo.','Manca la rete di test che protegge il refactoring.','Sono attività possibili di progetto, ma non il ciclo TDD.']],
[9,'Graner p. 11, Q13 (disambiguata)','Business, sviluppatore e tester definiscono esempi di accettazione prima del codice. Quale pratica descrive il caso?', ['ATDD','Solo test di carico','Debugging dopo rilascio','Sola analisi statica'], ['ATDD usa esempi di accettazione condivisi come guida all’implementazione.','Il carico verifica una caratteristica non funzionale specifica.','Il debugging localizza e corregge cause di guasti, non definisce l’accettazione prima del codice.','L’analisi statica non descrive la collaborazione sugli esempi di accettazione.']],
[9,'Mappa p. 5','Qual è il ruolo di Given–When–Then negli scenari BDD?', ['Esprimere contesto, evento e comportamento atteso in modo condiviso','Provare automaticamente ogni requisito','Sostituire ogni conversazione','Identificare sempre test di componente'], ['La struttura rende esplicite precondizioni, azione e risultato; la comprensione condivisa resta centrale.','Una forma testuale non garantisce copertura o esecuzione.','Gli scenari sono frutto e supporto della conversazione.','La sintassi non determina il livello del test.']],
[9,'Graner p. 11, Q11 (corretta)','Due funzionalità hanno costi simili: una gestisce pagamenti, l’altra il colore di un’icona. Come prioritizzare i test?', ['Valutare probabilità e impatto dei problemi','Usare solo l’ordine alfabetico','Testare solo la più facile','Usare incremental design come misura del rischio'], ['L’analisi del rischio considera conseguenze e probabilità; il contesto può rendere prioritari i pagamenti.','L’ordine alfabetico non rappresenta il rischio.','La facilità non indica l’importanza del guasto.','Il design incrementale non è una misura di probabilità e impatto.']],

 ['FA-2.3.2','Quale attività rientra nel ruolo del tester in un team Agile?',

 ['FA-3.1.2','Che cosa rappresenta la piramide dei test?',

 ['FA-3.1.2','Secondo il syllabus, con quali strumenti si automatizzano di solito i test alla base della piramide?',

 ['FA-3.1.2','Su quale principio si fonda la piramide dei test?',

 ['FA-3.1.3','Un team esegue test di carico e di sicurezza. In quale quadrante si collocano?',

 ['FA-3.1.3','Quale descrizione corrisponde al quadrante Q2?',

  ['Q3 raccoglie test esplorativi, di usabilità, scenari e accettazione utente, con scenari e dati realistici.','Q1 riguarda gli unit test degli sviluppatori.','I quadranti includono test manuali e automatici.','I quadranti riguardano il testing dinamico, e questi test lo sono.']],
 ['FA-3.1.4','Sprint zero di un nuovo progetto Scrum: come contribuisce la tester?',

 ['FA-3.2.1','Nell’iteration planning ci sono tre elementi: A) calcolo degli interessi di un mutuo, usato da tutti i clienti; B) nuovo colore di un pulsante; C) report mensile, già stabile, usato da due persone. Quale scelta è più giustificata?',

 ['FA-3.2.1','Per la storia “ricerca prodotti” il team individua il rischio “risposte lente con molti utenti”. Come si classifica e che cosa lo mitiga meglio?',

 ['FA-3.2.2','Nel planning poker le carte rivelate sono 3, 5, 5 e 21. Che cosa fa il team?',

 ['FA-3.2.2','Due storie richiedono lo stesso sforzo di sviluppo: una riguarda il calcolo delle commissioni (rischio alto), l’altra un testo informativo (rischio basso). Come si riflette il testing nella stima?',

 ['FA-3.3.1','La definition of done d’integrazione chiede che tutte le interfacce fra unità siano testate. Il report: 9 interfacce su 10 testate, nessun difetto maggiore aperto. Che cosa concludi?',
